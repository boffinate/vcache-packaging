# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvdp-pesi (schema vmod/1, DESIGN.md).
#
# The older pins use Vinyl's build macros. Varnish 9.1 selects upstream's
# VCACHE build rules, which accept both providers from 9.1; using that commit
# on 9.0 would discard upstream's minimum-version check. Package promotion
# remains Vinyl-only. The 0 in 0~master keeps Debian versions digit-first.
#
# The private headers and VSC_main.h need the matching engine source tree,
# beyond its installed development package. engine_source provisions that
# tree and regenerates the VSC headers omitted from the dist archive.
#
# The suite stays undeclared because the 9.0 tests e00000/e00001 time out on
# a logexpect that fails to match "1001 End" even when it is present in VSL.
schema: vmod/1
id: pesi
upstream:
  git: https://code.uplex.de/uplex-varnish/libvdp-pesi.git
  homepage: https://code.uplex.de/uplex-varnish/libvdp-pesi
sources:
  head: master
  default:
    ref: master
    commit: d6c234da43e2aec7dc5db48013b0eaaf66668981
    version: "0~master"
  by_series:
    varnish-9.1:
      ref: master
      commit: "5125576556da4cb2f9a0be68bafdd003a877aecc"
      version: "0~master"
    vinyl-9.1:
      ref: master
      commit: "916dd724a1854ba2988b0a040aa9c397fe6ea533"
      version: "0~master"
package:
  summary: Parallel ESI delivery processor for Vinyl Cache
  description:
    - libvdp-pesi provides a Vinyl delivery processor (VDP) that runs ESI
    - subrequests in parallel instead of sequentially, which can cut
    - response latency substantially when a page includes several
    - uncacheable fragments. It is activated per request by calling
    - pesi.activate() in vcl_deliver and works with existing ESI setups,
    - provided the backend does not depend on includes arriving in serial
    - order.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
      - zlib1g-dev
    rpm:
      - python3
      - python3-docutils
      - zlib-devel
  modules:
    - pesi
    - pesi_debug
  families:
    - vinyl
  promoted: "true"
engine_source: required
