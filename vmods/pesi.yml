# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvdp-pesi (schema vmod/1, DESIGN.md).
#
# UPLEX Vinylized this repo in March 2026: master builds against Vinyl Cache 9
# natively (vinylapi.pc, VINYL_* macros; configure.ac declares
# VINYL_PREREQ([9.0],[trunk]) and its AC_INIT version is trunk) and a separate
# 8.0 branch serves Varnish 8, so Varnish 9 cells are EXPECTED RED at
# configure; v2 carries no patches (SCOPE.md). No usable tags, so both lanes
# pin master (selector precedent; the 0 in 0~master keeps the Debian version
# digit-first).
#
# configure.ac hard-requires the VINYLSRC environment variable pointing at a
# Vinyl Cache *source tree* (it checks for $VINYLSRC/include/miniobj.h and
# AC_MSG_ERRORs without it), on top of the normal vinylapi.pc machinery.
# engine_source: required makes the harness provision that tree from the
# engine's own source pin, regenerating the VSC headers the dist archive
# omits (decision 14). Container-proven against vinyl-9.0.1: configure
# accepts the release (VINYL_PREREQ([9.0],[trunk])), the build converges
# after vsctool regenerates VSC_main.h, and both modules load
# (docs/20260811-vmod-candidate-survey.md).
#
# No tests: key on purpose: upstream's VTC suite ran 52/54 against
# vinyl-9.0.1 (2026-08-11) with e00000/e00001 timing out on a logexpect
# that never matches "1001 End" despite it being present in the VSL --
# revisit when upstream moves.
schema: vmod/1
id: pesi
upstream:
  git: https://code.uplex.de/uplex-varnish/libvdp-pesi.git
  homepage: https://code.uplex.de/uplex-varnish/libvdp-pesi
sources:
  head: master
  default:
    ref: master
    commit: d6c234da43e2aec7dc5db48013b0eaaf66668981
    version: "0~master"
package:
  summary: Parallel ESI delivery processor for Vinyl Cache
  description:
    - libvdp-pesi provides a Vinyl delivery processor (VDP) that runs ESI
    - subrequests in parallel instead of sequentially, which can cut
    - response latency substantially when a page includes several
    - uncacheable fragments. It is activated per request by calling
    - pesi.activate() in vcl_deliver and works with existing ESI setups,
    - provided the backend does not depend on includes arriving in serial
    - order.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
      - zlib1g-dev
    rpm:
      - python3
      - python3-docutils
      - zlib-devel
  modules:
    - pesi
    - pesi_debug
  families:
    - vinyl
  promoted: "true"
engine_source: required
