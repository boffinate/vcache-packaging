# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-re (schema vmod/1, DESIGN.md).
#
# Upstream's tags are stale (pre-Vinylize), so both release and trunk lanes
# use master. UPLEX Vinylized master in March 2026 (vinylapi.pc, VINYL_*
# autotools macros; Varnish 8 lives on a separate 8.0 branch), therefore
# Varnish 9 cells are EXPECTED RED at configure; v2 carries no patches
# (SCOPE.md). Per decision 13 package.families is vinyl, which is the
# branch's actual build-system support. The 0 in 0~master makes the trunk
# version valid for Debian, whose package versions must start with a digit.
# Compat still renders every pairing honestly.
schema: vmod/1
id: re
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-re.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-re
sources:
  head: master
  default:
    ref: master
    version: "0~master"
package:
  summary: Regular expression matching with subexpression capture for Vinyl Cache
  description:
    - libvmod-re matches strings against PCRE2 regular expressions and
    - makes captured subexpressions available in VCL. A regex object is
    - compiled once at VCL initialisation, its match method tests a
    - subject, and backref retrieves captured substrings from the most
    - recent match, replacing the plain-VCL idiom of matching once and
    - running regsub again for each capture. Dynamic variants compile
    - patterns at runtime, and a regex object can act as a body filter
    - for substitutions on response bodies.
  license: BSD-2-Clause
  build_deps:
    debian:
      - autoconf-archive
      - libpcre2-dev
      - python3
      - python3-docutils
    rpm:
      - autoconf-archive
      - pcre2-devel
      - python3
      - python3-docutils
  families:
    - vinyl
