# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-zipflow (schema vmod/1, DESIGN.md).
#
# There are no usable tags, so release and trunk builds pin master. The 0 in
# 0~master keeps the Debian version digit-first.
#
# Configure hard-requires a Vinyl Cache source tree. engine_source provisions
# the pinned source with regenerated VSC headers. Upstream's default target
# also links an auxiliary test against a compiled engine tree, while the
# provisioned tree is source-only, so build_target selects only the installable
# VMOD library.
# The pandoc build dep is real either way (Makefile regenerates README.md from
# README.rst when building from git).
#
# Bundles the zipflow library by Mark Adler as a git submodule at
# src/foreign/zipflow (github.com/nigoroll/zipflow, branch vmod_zipflow), so
# checkout needs a recursive submodule update (dict precedent, which the
# harness already does). The submodule code is Zlib-licensed (verified in
# zipflow.h), hence the compound SPDX expression. configure.ac also does
# PKG_CHECK_MODULES([ZLIB], [zlib]), hence the zlib build dep.
schema: vmod/1
id: zipflow
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-zipflow.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-zipflow
sources:
  head: master
  default:
    ref: master
    commit: "90e576d5d7b3fdb1391f7a1f142989b98056ba83"
    version: "0~master"
package:
  summary: ZIP archive streaming delivery processor for Vinyl Cache
  description:
    - libvmod-zipflow provides a Vinyl delivery processor (VDP) that
    - streams responses as ZIP archives generated on the fly, using the
    - zipflow library by Mark Adler, which is bundled as a git submodule.
    - Objects are added to the archive through subrequests, similar to ESI
    - handling, and the resulting ZIP is compressed with zlib and
    - delivered while it is generated rather than stored.
  license: BSD-2-Clause AND Zlib
  build_target: "-C src libvmod_zipflow.la"
  build_deps:
    debian:
      - pandoc
      - zlib1g-dev
      - python3
      - python3-docutils
    rpm:
      - pandoc
      - zlib-devel
      - python3
      - python3-docutils
  families:
    - vinyl
  promoted: "true"
engine_source: required
