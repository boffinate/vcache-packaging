# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-curl (schema vmod/1, DESIGN.md).
#
# The latest upstream release is Varnish Cache-only: its autotools setup
# requires varnishapi and VARNISH_VMOD_* macros. Keep package expansion on
# that family while leaving Vinyl compatibility cells as useful evidence.
# Its Varnish 9-compatible master has one legacy VTC assertion that compares
# libcurl error-string spellings. Keep make-check enabled so the matrix tracks
# the upstream fix rather than masking it.
schema: vmod/1
id: curl
upstream:
  git: https://github.com/varnish/libvmod-curl.git
  homepage: https://github.com/varnish/libvmod-curl
sources:
  head: master
  default:
    # 1.0.4 predates Varnish 9. Master adds Varnish 7.3+ support, including
    # the Varnish 9 private-object lifetime API.
    ref: master
    commit: 84e391521396ab4d9a8487a55c8298849b172551
    version: "1.0.4+git20250531"
package:
  summary: HTTP client VMOD for Varnish Cache
  description:
    - libvmod-curl exposes libcurl to VCL, allowing Varnish Cache to fetch
    - HTTP headers and bodies, issue GET, HEAD, and POST requests, and
    - inspect response status, headers, errors, and bodies. It also supports
    - per-request timeouts, proxy configuration, and Unix-domain sockets.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libcurl4-openssl-dev
    rpm:
      - libcurl-devel
  families:
    - varnish
tests: make-check
