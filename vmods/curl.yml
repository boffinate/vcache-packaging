# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-curl (schema vmod/1, DESIGN.md).
#
# The source uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
# The pin is the master commit carrying the test03 fix, which matches the
# libcurl connection-error string as a pattern instead of one exact spelling.
# package.families stays varnish because upstream supports Varnish only, so
# that is the family we ship products for.
schema: vmod/1
id: curl
source_api_family: varnish
upstream:
  git: https://github.com/varnish/libvmod-curl.git
  homepage: https://github.com/varnish/libvmod-curl
sources:
  head: master
  default:
    # 1.0.4 predates Varnish 9. Master adds Varnish 7.3+ support, including
    # the Varnish 9 private-object lifetime API.
    ref: master
    commit: "98da71c65568b1c1ca2868b7badf237e490ec524"
    version: "1.0.4+git20260813"
package:
  summary: HTTP client VMOD for Varnish Cache
  description:
    - libvmod-curl exposes libcurl to VCL, allowing Varnish Cache to fetch
    - HTTP headers and bodies, issue GET, HEAD, and POST requests, and
    - inspect response status, headers, errors, and bodies. It also supports
    - per-request timeouts, proxy configuration, and Unix-domain sockets.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libcurl4-openssl-dev
    rpm:
      - libcurl-devel
  families:
    - varnish
tests: make-check
