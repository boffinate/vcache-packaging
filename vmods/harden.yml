# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-harden (schema vmod/1, DESIGN.md).
#
# Upstream 1.2 requires Varnish 9.1's VCACHE macros and private header names;
# 1.1 retains the 9.0 build rules. The VMOD hooks Varnish's native TLS, which
# Vinyl does not provide, so Vinyl compatibility failures remain expected.
schema: vmod/1
id: harden
source_api_family: varnish
upstream:
  git: https://github.com/usdnag9ugudhi/libvmod-harden.git
  homepage: https://github.com/usdnag9ugudhi/libvmod-harden
sources:
  head: main
  default:
    ref: 1.1
    commit: "cd64464fb97e03a2ca76a3607ba4781f00b7da8d"
    version: "1.1"
  by_series:
    varnish-9.1:
      ref: "1.2"
      commit: "b3d1dda6cc6244cc96968735fb45ca838e7067c5"
      version: "1.2"
package:
  summary: TLS certificate and client connection hardening VMOD for Varnish Cache
  description:
    - libvmod-harden aborts TLS handshakes when a configured certificate does
    - "not match the client's SNI or when SNI or a certificate is absent. It"
    - also provides harden.close() to drop client connections without an HTTP
    - response.
  license: Unlicense
  build_deps:
    debian:
      - libssl-dev
    rpm:
      - openssl-devel
  families:
    - varnish
tests: make-check
