# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-harden (schema vmod/1, DESIGN.md).
#
# The VMOD builds and loads against Vinyl, but both upstream VTCs open with
# "feature tls_1_3" and drive the daemon's -A TLS frontend. Vinyl has no
# native TLS, no -A option and no TLS vocabulary in vinyltest, so the tests
# abort at the feature line before anything starts. An honest red on the
# check step until Vinyl grows native TLS; the VMOD's SNI callback could
# never fire there anyway.
schema: vmod/1
id: harden
source_api_family: varnish
upstream:
  git: https://github.com/usdnag9ugudhi/libvmod-harden.git
  homepage: https://github.com/usdnag9ugudhi/libvmod-harden
sources:
  head: main
  default:
    ref: 1.1
    commit: "cd64464fb97e03a2ca76a3607ba4781f00b7da8d"
    version: "1.1"
package:
  summary: TLS certificate and client connection hardening VMOD for Varnish Cache
  description:
    - libvmod-harden aborts TLS handshakes when a configured certificate does
    - "not match the client's SNI or when SNI or a certificate is absent. It"
    - also provides harden.close() to drop client connections without an HTTP
    - response.
  license: Unlicense
  build_deps:
    debian:
      - libssl-dev
    rpm:
      - openssl-devel
  families:
    - varnish
tests: make-check
