# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-digest uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
schema: vmod/1
id: digest
source_api_family: varnish
upstream:
  git: https://github.com/varnish/libvmod-digest.git
  homepage: https://github.com/varnish/libvmod-digest
sources:
  head: master
  default:
    ref: libvmod-digest-1.0.3
    commit: "e745761469b55e83e1fca21dd0cb8eca8022935d"
    version: "1.0.3"
package:
  summary: Message digest and Base64 VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-digest computes HMACs and message digests, and encodes or
    - decodes Base64 values from VCL.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libmhash-dev
      - python3-docutils
    rpm:
      - mhash-devel
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
