# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-blobsynth (schema vmod/1, DESIGN.md).
#
# UPLEX Vinylized this repo in March 2026: master builds against Vinyl Cache 9
# natively (vinylapi.pc, VINYL_* macros) and a separate 8.0 branch targets
# Varnish-Cache 8. Tags are stale (pre-Vinylize), so both lanes pin master,
# the selector precedent; the 0 in 0~master keeps the version valid for
# Debian. Varnish 9 cells are EXPECTED RED at configure (no vinylapi.pc
# there); per decision 13 package.families is vinyl. Compat still renders
# every pairing honestly. The LICENSE file is the Unlicense (public domain
# dedication), not the usual UPLEX BSD-2-Clause.
schema: vmod/1
id: blobsynth
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-blobsynth.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-blobsynth
sources:
  head: master
  default:
    ref: master
    commit: "c45561b37f08c780fce9d7ae7be834a70e4fb857"
    version: "0~master"
package:
  summary: BLOB synthetic response body VMOD for Vinyl Cache
  description:
    - libvmod-blobsynth serves BLOBs as synthetic response bodies. Its
    - single synthetic function is the BLOB counterpart of the built-in
    - synthetic function, restricted to vcl_synth and vcl_backend_error,
    - and lets VCL emit binary content such as images directly in a
    - generated response without external files.
  license: Unlicense
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
  promoted: "true"
