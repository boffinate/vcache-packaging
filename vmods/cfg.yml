# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-cfg (schema vmod/1, DESIGN.md).
schema: vmod/1
id: cfg
source_api_family: varnish
upstream:
  git: https://github.com/carlosabalde/libvmod-cfg.git
  homepage: https://github.com/carlosabalde/libvmod-cfg
sources:
  head: main
  default:
    # Upstream closed the Varnish 9.0 line as the 9.0-archived branch. Its
    # tip is 15 unreleased commits past the last release tag, 9.0-21.2.
    ref: "9.0-archived"
    commit: "3dde9ca724580351735b0d4d7defcbbde0b8de2b"
    version: "21.2+git20260916"
package:
  summary: Configuration and environment VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-cfg exposes configuration values and selected process
    - environment information to VCL, with optional LuaJIT-backed helpers.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libcurl4-openssl-dev
      - libjemalloc-dev
      - libluajit-5.1-dev
      - xxd
    rpm:
      - libcurl-devel
      - jemalloc-devel
      - luajit-devel
      - xxd
  families:
    - varnish
    - vinyl
  promoted: "true"
