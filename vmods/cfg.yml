# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-cfg (schema vmod/1, DESIGN.md).
# The 9.1 release is flavor-neutral; the series override avoids the 9.0
# release's exclusive 9.1 upper bound.
schema: vmod/1
id: cfg
source_api_family: varnish
upstream:
  git: https://github.com/carlosabalde/libvmod-cfg.git
  homepage: https://github.com/carlosabalde/libvmod-cfg
sources:
  head: main
  default:
    ref: 9.0-21.1
    commit: "3399f0d13537c55af774b7ef019f72cdada98b4e"
    version: "21.1"
  by_series:
    varnish-9.1:
      ref: 9.1-22.0
      commit: "e415e2f3b54691f56d38cfe16bf65b0ac9edab81"
      version: "22.0"
    vinyl-9.1:
      ref: 9.1-22.0
      commit: "e415e2f3b54691f56d38cfe16bf65b0ac9edab81"
      version: "22.0"
package:
  summary: Configuration and environment VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-cfg exposes configuration values and selected process
    - environment information to VCL, with optional LuaJIT-backed helpers.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libcurl4-openssl-dev
      - libjemalloc-dev
      - libluajit-5.1-dev
      - xxd
    rpm:
      - libcurl-devel
      - jemalloc-devel
      - luajit-devel
      - xxd
  families:
    - varnish
    - vinyl
  promoted: "true"
