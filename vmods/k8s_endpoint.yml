# yaml-language-server: $schema=../schemas/vmod.schema.json
# SDK aliases translate Varnish names on Vinyl; incompatible TLS and private
# APIs remain build failures, so packages stay restricted to Varnish.
schema: vmod/1
id: k8s_endpoint
upstream:
  git: https://github.com/varnish-rs/vmod-k8s_endpoint.git
  homepage: https://github.com/varnish-rs/vmod-k8s_endpoint
sources:
  head: main
  default:
    ref: v0.1.1
    commit: "5d3fa372c226b43ae6d1b2cb3a1aeeaec22bdfc6"
    version: "0.1.1"
build: cargo
source_api_family: varnish
package:
  summary: Kubernetes endpoint director VMOD for Varnish Cache
  description:
    - vmod-k8s_endpoint watches Kubernetes EndpointSlices and exposes a
    - director that selects among the active service backends.
  license: MIT
  modules:
    - k8s_endpoint
  artifacts:
    - libvmod_k8s_endpoint.so
  families:
    - varnish
  promoted: "false"
