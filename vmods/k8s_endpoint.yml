# yaml-language-server: $schema=../schemas/vmod.schema.json
# varnish-sys locates the engine only through pkg-config varnishapi, which the
# Vinyl prefix does not provide (it ships vinylapi.pc only), so Vinyl compat
# cells are expected red and package.families stays varnish (DESIGN.md
# decision 19 attempts no normalization for Cargo sources).
schema: vmod/1
id: k8s_endpoint
upstream:
  git: https://github.com/varnish-rs/vmod-k8s_endpoint.git
  homepage: https://github.com/varnish-rs/vmod-k8s_endpoint
sources:
  head: main
  default:
    ref: v0.1.0
    commit: "8b74a31e3e2775030e6028ef09975cac5de05859"
    version: "0.1.0"
build: cargo
package:
  summary: Kubernetes endpoint director VMOD for Varnish Cache
  description:
    - vmod-k8s_endpoint watches Kubernetes EndpointSlices and exposes a
    - director that selects among the active service backends.
  license: MIT
  modules:
    - k8s_endpoint
  artifacts:
    - libvmod_k8s_endpoint.so
  families:
    - varnish
  promoted: "true"
