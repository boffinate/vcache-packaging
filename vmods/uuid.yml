# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-uuid (schema vmod/1, DESIGN.md).
schema: vmod/1
id: uuid
source_api_family: varnish
upstream:
  git: https://github.com/otto-de/libvmod-uuid.git
  homepage: https://github.com/otto-de/libvmod-uuid
sources:
  head: master
  default:
    ref: master
    commit: "2376dee2afb3333a8eaa6b12ec7481f7e0f5fe75"
    version: "0~master"
package:
  summary: UUID generation VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-uuid generates universally unique identifiers from VCL for
    - request correlation, tracing, and cache metadata.
  license: BSD-2-Clause
  build_deps:
    debian:
      # uuid-dev is util-linux's UUID library; upstream requires the OSSP
      # implementation advertised as ossp-uuid.pc.
      - libossp-uuid-dev
    rpm:
      # EL packages OSSP UUID as uuid-devel (there is no
      # ossp-uuid-devel package in EL10).
      - uuid-devel
  families:
    - varnish
    - vinyl
  promoted: "true"
