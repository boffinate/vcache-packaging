# yaml-language-server: $schema=../schemas/vmod.schema.json
# vmod-querystring (schema vmod/1, DESIGN.md).
#
# The source uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
# The catalog points at a fork (SCOPE.md) whose fix-9.1.0 tag fixes the
# QS_CHECK_SYM probe for Varnish 9.1's function-like WS_Reservation macro.
# The fork keeps the upstream release tags, so other columns are unchanged.
schema: vmod/1
id: querystring
source_api_family: varnish
upstream:
  git: https://github.com/gquintard/vmod-querystring.git
  homepage: https://git.sr.ht/~dridi/vmod-querystring
sources:
  head: main
  default:
    ref: vmod-querystring-2.0.4
    commit: "c69bb0975b149efe0aa82a71c79804e442a3df50"
    version: "2.0.4"
  by_series:
    varnish-9.1:
      ref: fix-9.1.0
      commit: "16c1c486f0624973119f38508f3ea5dc581a669d"
      version: "2.0.4+git20260922"
package:
  summary: Query-string filtering VMOD for Varnish Cache and Vinyl Cache
  description:
    - vmod-querystring gives fine-grained control over a URL query-string
    - in VCL. It can remove the query-string outright, clean it, sort its
    - parameters, or filter it down to a chosen subset by name, glob or
    - regular expression, which improves cache hit ratio for requests that
    - differ only in irrelevant parameters such as tracking tags.
  license: GPL-3.0-or-later
  configure_args:
    - --enable-docs
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "false"
