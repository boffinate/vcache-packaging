# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-jq uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
schema: vmod/1
id: jq
source_api_family: varnish
upstream:
  git: https://github.com/varnishcache-friends/libvmod-jq.git
  homepage: https://github.com/varnishcache-friends/libvmod-jq
sources:
  head: devel
  default:
    ref: 4051a7d08dc3a4ca90d9e8319d5a3a132793e1da
    commit: "4051a7d08dc3a4ca90d9e8319d5a3a132793e1da"
    version: "0.3.0"
package:
  summary: JSON processing VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-jq parses and queries JSON values from VCL through the jq
    - library.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libjq-dev
      - python3-docutils
    rpm:
      - jq-devel
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
