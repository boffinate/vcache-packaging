# yaml-language-server: $schema=../schemas/vmod.schema.json
# vmod-reqwest (schema vmod/1, DESIGN.md).
# varnish-sys locates the engine only through pkg-config varnishapi, which the
# Vinyl prefix does not provide (it ships vinylapi.pc only), so Vinyl compat
# cells are expected red and package.families stays varnish (DESIGN.md
# decision 19 attempts no normalization for Cargo sources).
schema: vmod/1
id: reqwest
upstream:
  git: https://github.com/varnish-rs/vmod-reqwest.git
  homepage: https://github.com/varnish-rs/vmod-reqwest
sources:
  head: main
  default:
    ref: v0.1.0
    commit: "bd4c8097c035ca1561b062ac3267c88b1057f1b6"
    version: "0.1.0"
build: cargo
package:
  summary: HTTP client VMOD for Varnish Cache
  description:
    - vmod-reqwest makes outbound HTTP requests from VCL through the
    - varnish-rs bindings.
  license: BSD-3-Clause
  modules:
    - reqwest
  artifacts:
    - libvmod_reqwest.so
  families:
    - varnish
  promoted: "true"
