# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-selector (schema vmod/1, DESIGN.md).
#
# Upstream does not publish current releases, so release and trunk builds pin
# master. The 0 in 0~master keeps the Debian version digit-first.
schema: vmod/1
id: selector
source_api_family: vinyl
upstream:
  git: https://gitlab.com/uplex/varnish/libvmod-selector.git
  homepage: https://gitlab.com/uplex/varnish/libvmod-selector
sources:
  head: master
  default:
    ref: master
    commit: "c0c83c1748bca037f1fdc84986cfa56697b8e158"
    version: "0~master"
package:
  summary: Fixed-string and pattern matching VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-selector builds sets of fixed strings, regular expressions
    - and integer or boolean values, and matches a subject string or number
    - against a set to associate it with a backend, a subroutine, or any of
    - the other data a set element may carry. Sets are built once from VCL
    - and queried repeatedly, with matching time proportional to the length
    - of the subject rather than the size of the set, using a compressed
    - radix trie.
  license: BSD-2-Clause
  build_deps:
    debian:
      - autoconf-archive
      - python3
      - python3-docutils
    rpm:
      - autoconf-archive
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
