# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-selector (schema vmod/1, DESIGN.md).
#
# Upstream no longer publishes releases, so both release and trunk lanes use
# master. That branch is Vinyl-flavoured (vinylapi and vinyl_vsc), therefore
# Varnish 9 cells are EXPECTED RED at configure/build; v2 carries no patches
# (SCOPE.md). Per decision 13 package.families is vinyl, which is the branch's
# actual build-system support. The 0 in 0~master makes the trunk version valid
# for Debian, whose package versions must start with a digit. Compat still
# renders every pairing honestly.
schema: vmod/1
id: selector
upstream:
  git: https://gitlab.com/uplex/varnish/libvmod-selector.git
  homepage: https://gitlab.com/uplex/varnish/libvmod-selector
sources:
  head: master
  default:
    ref: master
    version: "0~master"
package:
  summary: Fixed-string and pattern matching VMOD for Vinyl Cache
  description:
    - libvmod-selector builds sets of fixed strings, regular expressions
    - and integer or boolean values, and matches a subject string or number
    - against a set to associate it with a backend, a subroutine, or any of
    - the other data a set element may carry. Sets are built once from VCL
    - and queried repeatedly, with matching time proportional to the length
    - of the subject rather than the size of the set, using a compressed
    - radix trie.
  license: BSD-2-Clause
  build_deps:
    debian:
      - autoconf-archive
      - python3
      - python3-docutils
    rpm:
      - autoconf-archive
      - python3
      - python3-docutils
  families:
    - vinyl
