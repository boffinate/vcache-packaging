# yaml-language-server: $schema=../schemas/vmod.schema.json
# Pinned varnish-rs Cargo VMOD.
# SDK aliases translate Varnish names on Vinyl; incompatible TLS and private
# APIs remain build failures, so packages stay restricted to Varnish.
schema: vmod/1
id: fileserver
upstream:
  git: https://github.com/varnish-rs/vmod-fileserver.git
  homepage: https://github.com/varnish-rs/vmod-fileserver
sources:
  head: main
  default:
    ref: v0.1.1
    commit: "2393c33a0cc1ee430b9a2d95d31d01b786a38c26"
    version: "0.1.1"
build: cargo
source_api_family: varnish
package:
  summary: Static file server VMOD for Varnish Cache
  description:
    - vmod-fileserver serves files from a configured directory through VCL.
  license: BSD-3-Clause
  modules:
    - fileserver
  artifacts:
    - libvmod_fileserver.so
  families:
    - varnish
  promoted: "false"
