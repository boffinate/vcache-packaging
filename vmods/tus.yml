# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-tus (schema vmod/1, DESIGN.md).
#
# Engine 9.0 selects the upstream commit before the VCACHE migration raised
# the minimum engine version to 9.1. The default and trunk follow master.
# The 9.0 source uses Vinyl build rules, so selecting it does not establish
# Varnish compatibility. We carry no upstream patches (SCOPE.md).
# configure requires an engine source tree and private cache/cache_obj.h
# headers in addition to the installed SDK. engine_source: required supplies
# the selected engine's source with regenerated VSC headers (decision 14).
schema: vmod/1
id: tus
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-tus.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-tus
sources:
  head: master
  default:
    ref: master
    version: "0~master"
  by_series:
    vinyl-9.0:
      ref: master
      commit: "7dd1a25a8a792df72cdbef1ac58db8e838b44c4e"
      version: "0~master"
    varnish-9.0:
      ref: master
      commit: "7dd1a25a8a792df72cdbef1ac58db8e838b44c4e"
      version: "0~master"
package:
  summary: TUS resumable upload proxy VMOD for Vinyl Cache
  description:
    - libvmod-tus implements the tus resumable upload protocol, including
    - all currently defined protocol extensions such as concatenation. It
    - acts as a proxy that collects the pieces of an upload on the Vinyl
    - server and forwards the complete file to a backend in one request
    - for storage. The VMOD implements no permanent storage itself; a
    - backend must provide final persistence.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
engine_source: required
