# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-file (schema vmod/1, DESIGN.md).
#
# Existing tags target older engine APIs, so release and trunk builds pin
# master. Master builds against Vinyl natively since upstream switched to
# vinylapi.pc and VINYL_* macros, and source_api_family records that so the
# Varnish columns are translated; the pinned commit is that Vinylized master.
# The 0 in 0~master keeps the Debian version digit-first.
schema: vmod/1
id: file
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-file.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-file
sources:
  head: master
  default:
    ref: master
    commit: "a0a1165d95a4a1d32589384411571aa9112c70d5"
    version: "0~master"
package:
  summary: File reader VMOD with periodic refresh for Varnish Cache and Vinyl Cache
  description:
    - libvmod-file provides a reader object that reads the contents of a
    - file and re-checks it for changes at a configurable interval,
    - reloading modified contents in a background thread. Unlike the
    - std.fileread() function, which caches file contents until the engine
    - restarts, updated contents become visible without a restart. Files
    - are memory mapped for efficient access.
  license: BSD-2-Clause
  build_deps:
    debian:
      - autoconf-archive
      - python3
      - python3-docutils
    rpm:
      - autoconf-archive
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
  targets:
    - debian-13-amd64
    - debian-13-arm64
    - el10-x86_64
    - el10-aarch64
