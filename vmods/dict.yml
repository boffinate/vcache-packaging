# vmod-dict (schema vmod/1, DESIGN.md).
schema: vmod/1
id: dict
upstream:
  git: https://git.gnu.org.ua/vmod-dict.git
sources:
  head: master
  default:
    ref: v1.7
    version: "1.7"
package:
  summary: Dictionary look-up VMOD for Vinyl Cache
  description:
    - vmod-dict loads a keyword-to-value dictionary from a disk file at VCL
    - initialisation and looks keys up from VCL. Each non-empty line of the
    - dictionary file holds a keyword and a value separated by whitespace.
    - It exposes case-sensitive and case-insensitive lookup, reloading, and
    - a bound on hash table collision chains.
  license: GPL-3.0-or-later
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
