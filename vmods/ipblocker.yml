# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-ipblocker (schema vmod/1, DESIGN.md).
#
# There are no usable tags, so release and trunk builds pin main. The 0 in
# 0~main keeps the Debian version digit-first. We package only the VMOD,
# which builds standalone; upstream's
# reference daemon (server.pl, a Perl script needing Regexp::Common) is NOT
# packaged. Upstream ships no LICENSE file or source license headers;
# BSD-2-Clause below is the UPLEX org convention, flagged here until
# upstream states one.
schema: vmod/1
id: ipblocker
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-ipblocker.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-ipblocker
sources:
  head: main
  default:
    ref: main
    commit: "e1e98408a7ee28dcf63a0505a698b7a96ec9f3e3"
    version: "0~main"
package:
  summary: Dynamic IP blocklist VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-ipblocker manages dynamic IP blocklists from VCL. It sends
    - add and remove messages over a UDP or UNIX datagram socket to a
    - companion daemon that applies firewall rules (for example via
    - ipset), so VCL can block and unblock addresses or CIDR prefixes at
    - runtime, optionally grouped into named sets. The reference daemon is
    - a separate Perl script and is not part of this package.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
