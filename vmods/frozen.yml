# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-frozen (schema vmod/1, DESIGN.md).
#
# UPLEX Vinylized this repo in 2026-03: master builds against Vinyl Cache
# 9 natively (vinylapi and VINYL_* autotools macros) and a separate 8.0
# branch targets Varnish 8. Tags predate the Vinylize, so both lanes pin
# master; the 0 in 0~master makes the version valid for Debian, whose
# package versions must start with a digit. Varnish 9 cells are EXPECTED
# RED at configure (no vinylapi.pc there); v2 carries no patches
# (SCOPE.md). Per decision 13 package.families is vinyl.
# The cesanta/frozen JSON parser is vendored as git submodule src/frozen;
# the build harness always does a recursive submodule checkout (vmod-dict
# relies on the same), so nothing extra is needed here.
schema: vmod/1
id: frozen
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-frozen.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-frozen
sources:
  head: master
  default:
    ref: master
    version: "0~master"
package:
  summary: JSON parsing VMOD for Vinyl Cache
  description:
    - libvmod-frozen parses JSON in VCL using the frozen library from
    - Cesanta. A parser object is declared in vcl_init with the JSON
    - paths of interest, each carrying an expected type and optional
    - null and required constraints. The parser then reads JSON from a
    - string or from a request or response body, tracking only the
    - declared paths for low overhead, and extracts the matched values
    - with configurable fallback strings for null or absent elements.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
