# yaml-language-server: $schema=../schemas/vmod.schema.json
# Pinned varnish-rs Cargo VMOD.
# SDK aliases translate Varnish names on Vinyl; incompatible TLS and private
# APIs remain build failures, so packages stay restricted to Varnish.
schema: vmod/1
id: rers
upstream:
  git: https://github.com/varnish-rs/vmod-rers.git
  homepage: https://github.com/varnish-rs/vmod-rers
sources:
  head: main
  default:
    ref: v0.0.14
    commit: "d453cf2b00cb622bcf2672d393077d774e18995e"
    version: "0.0.15"
build: cargo
source_api_family: varnish
package:
  summary: Regular expression replacement VMOD for Varnish Cache
  description:
    - vmod-rers provides regular expression replacement helpers for VCL.
  license: BSD-3-Clause
  modules:
    - rers
  artifacts:
    - libvmod_rers.so
  families:
    - varnish
  promoted: "false"
