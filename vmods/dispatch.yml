# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-dispatch (schema vmod/1, DESIGN.md).
#
# Engine 9.0 selects the upstream commit before the VCACHE migration raised
# the minimum engine version to 9.1. The default and trunk follow master.
# source_api_family enables Varnish translation because the source uses only
# public headers. engine_source: required supplies the engine tree required
# by configure for both families.
# Upstream's src/Makefile.am uses $(VMOD_FLAGS), which neither engine's m4
# defines, so the library is versioned and the harness resolves its .so
# symlink (decision 24). package.families follows upstream's Vinyl support.
schema: vmod/1
id: dispatch
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-dispatch.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-dispatch
sources:
  head: master
  default:
    ref: master
    version: "0~master"
  by_series:
    vinyl-9.0:
      ref: master
      commit: "668d957211e2be266360d8ea1a430d9f8a245abd"
      version: "0~master"
    varnish-9.0:
      ref: master
      commit: "668d957211e2be266360d8ea1a430d9f8a245abd"
      version: "0~master"
engine_source: required
package:
  summary: Dispatch to VCL labels or subroutines by integer id for Vinyl Cache
  description:
    - libvmod-dispatch maps integer identifiers to VCL labels or
    - subroutines and branches to them at request time. A dispatch object
    - is populated at VCL initialisation by adding an integer together
    - with a label or subroutine name, then a request jumps to the label
    - or calls the subroutine registered for a computed integer, so
    - routing decisions driven by numbers replace long chains of explicit
    - VCL conditionals.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
