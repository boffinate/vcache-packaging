# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-dispatch (schema vmod/1, DESIGN.md).
#
# Upstream's tags are stale (pre-Vinylize), so both release and trunk lanes
# use master. Master is Vinyl-native (vinylapi.pc, VINYL_* autotools macros;
# Varnish 8 lives on a separate 8.0 branch), and source_api_family enables
# translation for the Varnish columns because the source includes only public
# headers. Its configure hard-requires an engine source tree, which
# engine_source: required provides for both families (VINYLSRC and VARNISHSRC
# are both exported).
# Upstream's src/Makefile.am sets libvmod_dispatch_la_LDFLAGS = $(VMOD_FLAGS),
# a variable neither engine's m4 defines, so the library is built versioned
# and the harness resolves the resulting .so symlink (decision 24).
# Per decision 13 package.families is vinyl, which is the branch's actual
# build-system support. The 0 in 0~master makes the trunk version valid for
# Debian, whose package versions must start with a digit.
schema: vmod/1
id: dispatch
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-dispatch.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-dispatch
sources:
  head: master
  default:
    ref: master
    version: "0~master"
engine_source: required
package:
  summary: Dispatch to VCL labels or subroutines by integer id for Vinyl Cache
  description:
    - libvmod-dispatch maps integer identifiers to VCL labels or
    - subroutines and branches to them at request time. A dispatch object
    - is populated at VCL initialisation by adding an integer together
    - with a label or subroutine name, then a request jumps to the label
    - or calls the subroutine registered for a computed integer, so
    - routing decisions driven by numbers replace long chains of explicit
    - VCL conditionals.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
