# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvfp-brotli (schema vmod/1, DESIGN.md).
#
# Engine 9.0 selects the upstream commit before the VCACHE migration raised
# the minimum engine version to 9.1. The default and trunk follow master.
# source_api_family enables Varnish translation because the source uses only
# cache/cache.h and cache/cache_filter.h, whose VFP API is shared (decision 19).
# The 9.0 source also requires the engine changes described in upstream's
# README (54af42d or later); its configure minimum alone does not prove that
# every 9.0 engine can build it.
schema: vmod/1
id: brotli
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvfp-brotli.git
  homepage: https://code.uplex.de/uplex-varnish/libvfp-brotli
sources:
  head: master
  default:
    ref: master
    version: "0~master"
  by_series:
    vinyl-9.0:
      ref: master
      commit: "b9adda40115815120b71fdfa42ef9c8c9567757a"
      version: "0~master"
    varnish-9.0:
      ref: master
      commit: "b9adda40115815120b71fdfa42ef9c8c9567757a"
      version: "0~master"
package:
  summary: Brotli compression fetch processor for Vinyl Cache
  description:
    - libvfp-brotli is a Vinyl fetch processor (VFP) that compresses and
    - decompresses response bodies fetched from backends with the brotli
    - algorithm. It provides built-in br and unbr filters using default
    - parameters, plus encoder and decoder objects whose quality, window,
    - buffer sizes and content hints can be configured from VCL, and it
    - publishes statistics under a BROTLI counter namespace. ESI delivery
    - of brotli-compressed content is not supported.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libbrotli-dev
      - python3
      - python3-docutils
    rpm:
      - brotli-devel
      - python3
      - python3-docutils
  families:
    - vinyl
