# yaml-language-server: $schema=../schemas/vmod.schema.json
# Pinned varnish-rs Cargo VMOD.
# varnish-sys locates the engine only through pkg-config varnishapi, which the
# Vinyl prefix does not provide (it ships vinylapi.pc only), so Vinyl compat
# cells are expected red and package.families stays varnish (DESIGN.md
# decision 19 attempts no normalization for Cargo sources).
schema: vmod/1
id: fcgi
upstream:
  git: https://github.com/varnish-rs/vmod-fcgi.git
  homepage: https://github.com/varnish-rs/vmod-fcgi
sources:
  head: main
  default:
    ref: 821221922e7437a22e668c42680d98e6560aa4ca
    commit: "821221922e7437a22e668c42680d98e6560aa4ca"
    version: "0.1.1"
build: cargo
package:
  summary: FastCGI VMOD for Varnish Cache
  description:
    - vmod-fcgi forwards VCL requests to FastCGI backends.
  license: BSD-3-Clause
  modules:
    - fastcgi
  artifacts:
    - libvmod_fastcgi.so
  families:
    - varnish
  promoted: "true"
