# yaml-language-server: $schema=../schemas/vmod.schema.json
# Pinned varnish-rs Cargo VMOD.
# SDK aliases translate Varnish names on Vinyl; incompatible TLS and private
# APIs remain build failures, so packages stay restricted to Varnish.
schema: vmod/1
id: fcgi
upstream:
  git: https://github.com/varnish-rs/vmod-fcgi.git
  homepage: https://github.com/varnish-rs/vmod-fcgi
sources:
  head: main
  default:
    ref: e52072e9cb4c651d4530f01edf6cfad870e06a04
    commit: "e52072e9cb4c651d4530f01edf6cfad870e06a04"
    version: "0.1.1"
build: cargo
source_api_family: varnish
package:
  summary: FastCGI VMOD for Varnish Cache
  description:
    - vmod-fcgi forwards VCL requests to FastCGI backends.
  license: BSD-3-Clause
  modules:
    - fastcgi
  artifacts:
    - libvmod_fastcgi.so
  families:
    - varnish
  promoted: "false"
