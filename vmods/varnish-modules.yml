# yaml-language-server: $schema=../schemas/vmod.schema.json
# varnish-modules (schema vmod/1, DESIGN.md).
#
# One catalog entry for the whole collection (DESIGN.md decision 9): upstream
# builds all nine modules or none, and Debian itself ships them as one
# package, so this is one row and one package carrying nine .so.
#
# The source uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
schema: vmod/1
id: varnish-modules
source_api_family: varnish
upstream:
  git: https://github.com/varnish/varnish-modules.git
  homepage: https://github.com/varnish/varnish-modules
sources:
  head: master
  default:
    ref: 0.28.0
    commit: "7abe0e2a59a685b4ea8626ff1a3fe9c60a037368"
    version: "0.28.0"
package:
  summary: Collection of nine core VMODs maintained by the Varnish project
  description:
    - varnish-modules bundles nine VMODs maintained by the Varnish project
    - in a single source tree and a single package. It ships accept for
    - allow-list header filtering, bodyaccess for request-body inspection,
    - header for multi-value header manipulation, saintmode for marking
    - backends sick per object, str for string utilities, tcp for TCP
    - socket tuning, var for typed VCL variables, vsthrottle for request
    - throttling, and xkey for secondary-key cache invalidation.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3-docutils
    rpm:
      - python3-docutils
  modules:
    - accept
    - bodyaccess
    - header
    - saintmode
    - str
    - tcp
    - var
    - vsthrottle
    - xkey
  families:
    - varnish
    - vinyl
  promoted: "true"
tests: make-check
