# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-re2 (schema vmod/1, DESIGN.md).
#
# Upstream's tags are stale (pre-Vinylize), so both release and trunk lanes
# use master. UPLEX Vinylized master in March 2026 (vinylapi.pc, VINYL_*
# autotools macros; Varnish 8 lives on a separate 8.0 branch), therefore
# Varnish 9 cells are EXPECTED RED at configure; v2 carries no patches
# (SCOPE.md). Per decision 13 package.families is vinyl, which is the
# branch's actual build-system support. The 0 in 0~master makes the trunk
# version valid for Debian, whose package versions must start with a digit.
# Compat still renders every pairing honestly.
#
# The VMOD is written in C++ (it binds Google RE2 directly), so the rpm
# build deps add gcc-c++; the generated recipes' base set carries only gcc,
# and on Debian build-essential already ships g++.
schema: vmod/1
id: re2
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-re2.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-re2
sources:
  head: master
  default:
    ref: master
    commit: "c009a80895cc4a5fa88bd4c1433d8e6955521be7"
    version: "0~master"
package:
  summary: Google RE2 linear-time regular expressions for Vinyl Cache
  description:
    - libvmod-re2 gives VCL access to the Google RE2 regular expression
    - engine as an alternative to the native PCRE2 matching built into
    - the cache engine. RE2
    - restricts patterns to a formally regular language, with no
    - backreferences, and matches as a finite automaton without
    - backtracking, so matching time is guaranteed linear in the length
    - of the subject and the exponential worst cases of backtracking
    - matchers cannot occur. The VMOD exposes compiled regex objects with
    - subexpression capture and set objects that match many patterns in a
    - single pass.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libre2-dev
      - python3
      - python3-docutils
    rpm:
      - gcc-c++
      - python3
      - python3-docutils
      - re2-devel
  families:
    - vinyl
  promoted: "true"
