# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-redis (schema vmod/1, DESIGN.md).
#
# The source uses Varnish API spellings, recorded by source_api_family so
# cross-family builds can normalize its disposable source tree.
schema: vmod/1
id: redis
source_api_family: varnish
upstream:
  git: https://github.com/carlosabalde/libvmod-redis.git
  homepage: https://github.com/carlosabalde/libvmod-redis
sources:
  head: main
  default:
    ref: "9.0-23.1"
    commit: "b6ca669fc9af3399f3845d9d4930683b4e378aa8"
    version: "23.1"
package:
  summary: Redis client VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-redis lets VCL execute commands against one or more Redis
    - servers. It supports standalone servers, replicated pairs with
    - automatic role discovery, Redis Cluster with MOVED and ASK
    - redirection, Sentinel-driven fail-over, and TLS. Connections are
    - pooled per worker thread or shared across them, with configurable
    - timeouts, retries, and per-server sickness tracking.
  license: BSD-2-Clause AND BSD-3-Clause AND LicenseRef-Public-Domain
  build_deps:
    debian:
      - libhiredis-dev
      - libev-dev
      - libssl-dev
      - autoconf-archive
      - python3
      - python3-docutils
    rpm:
      - hiredis-devel
      - libev-devel
      - openssl-devel
      - autoconf-archive
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
