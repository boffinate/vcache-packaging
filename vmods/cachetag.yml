# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-cachetag (schema vmod/1, DESIGN.md).
schema: vmod/1
id: cachetag
source_api_family: vinyl
upstream:
  git: https://github.com/boffinate/libvmod-cachetag.git
  homepage: https://github.com/boffinate/libvmod-cachetag
sources:
  head: main
  default:
    ref: v1.0.1
    commit: a3897aaccf1d6996c00ee14b2c6e1ddac91ac982
    version: "1.0.1"
package:
  summary: Tag-based cache invalidation VMOD for Varnish Cache and Vinyl Cache
  description:
    - Cachetag adds tag-based invalidation to Varnish Cache and Vinyl Cache,
    - running on the
    - in-memory storage engines and on Fellow persistent storage. Backends
    - label responses with tags such as product:123, and one purge then
    - invalidates every cached object carrying the tag, without tracking
    - down each URL. At scale it is designed to be significantly more
    - memory efficient than the bundled xkey.
  license: MPL-2.0
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
tests: make-check
