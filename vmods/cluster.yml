# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-cluster (schema vmod/1, DESIGN.md).
#
# Tags do not describe the current API, so release and trunk builds pin
# master. The 0 in 0~master keeps the version valid for Debian.
schema: vmod/1
id: cluster
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-cluster.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-cluster
sources:
  head: master
  default:
    ref: master
    commit: "316d6ee2f9a34c3529a93b4b384a04f733ae10ac"
    version: "0~master"
package:
  summary: Cache clustering and sharding director VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-cluster provides a director that makes cache clustering and
    - sharding across several cache nodes easy, typically on top of a
    - shard director. When another cluster node is the designated member
    - for an object, the request is forwarded to that node; when the local
    - node is the designated member, or the request is uncacheable or the
    - selected member is on a denylist, a real backend is used instead.
    - Methods control the denylist, the real backend, handling of
    - uncacheable requests, and resolution depth, from vcl_init and
    - vcl_backend_fetch.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
