# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-cluster (schema vmod/1, DESIGN.md).
#
# UPLEX Vinylized this repo in March 2026: master builds against Vinyl Cache 9
# natively (vinylapi.pc, VINYL_* macros) and a separate 8.0 branch targets
# Varnish-Cache 8. Tags are stale (pre-Vinylize), so both lanes pin master,
# the selector precedent; the 0 in 0~master keeps the version valid for
# Debian. Varnish 9 cells are EXPECTED RED at configure (no vinylapi.pc
# there); per decision 13 package.families is vinyl. Compat still renders
# every pairing honestly.
schema: vmod/1
id: cluster
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-cluster.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-cluster
sources:
  head: master
  default:
    ref: master
    version: "0~master"
package:
  summary: Cache clustering and sharding director VMOD for Vinyl Cache
  description:
    - libvmod-cluster provides a director that makes cache clustering and
    - sharding across several Vinyl Cache nodes easy, typically on top of a
    - shard director. When another cluster node is the designated member
    - for an object, the request is forwarded to that node; when the local
    - node is the designated member, or the request is uncacheable or the
    - selected member is on a denylist, a real backend is used instead.
    - Methods control the denylist, the real backend, handling of
    - uncacheable requests, and resolution depth, from vcl_init and
    - vcl_backend_fetch.
  license: BSD-2-Clause
  build_deps:
    debian:
      - python3
      - python3-docutils
    rpm:
      - python3
      - python3-docutils
  families:
    - vinyl
