# yaml-language-server: $schema=../schemas/vmod.schema.json
# libvmod-crypto (schema vmod/1, DESIGN.md).
#
# Tags do not describe the current API, so release and trunk builds pin
# master. The 0 in 0~master keeps the Debian version digit-first.
# configure hard-requires OpenSSL libcrypto (AC_CHECK_LIB) and also the
# openssl, base64, sed, dd and bash programs (AC_MSG_ERROR if absent),
# hence the openssl CLI package in build_deps alongside the -dev/-devel
# library package.
schema: vmod/1
id: crypto
source_api_family: vinyl
upstream:
  git: https://code.uplex.de/uplex-varnish/libvmod-crypto.git
  homepage: https://code.uplex.de/uplex-varnish/libvmod-crypto
sources:
  head: master
  default:
    ref: master
    commit: "0b6cb770ab0fc134bcd7c02ea09bd6dddfe53736"
    version: "0~master"
package:
  summary: Asymmetric cryptographic signature VMOD for Varnish Cache and Vinyl Cache
  description:
    - libvmod-crypto verifies and generates asymmetric cryptographic
    - signatures in VCL using OpenSSL libcrypto. Keys are loaded from
    - PEM encoded public or private key strings or constructed from RSA
    - components, and verifier and signer objects accumulate data with
    - update methods before validating a signature or producing one,
    - using digests such as sha256, sha512 and their siblings.
  license: BSD-2-Clause
  build_deps:
    debian:
      - libssl-dev
      - openssl
      - python3
      - python3-docutils
    rpm:
      - openssl
      - openssl-devel
      - python3
      - python3-docutils
  families:
    - varnish
    - vinyl
  promoted: "true"
