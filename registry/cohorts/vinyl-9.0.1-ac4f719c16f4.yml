# RELEASE COHORT - candidate
#
# Minted 2026-07-28 from the release pin blocks the two lane drivers already
# carry: recipes/debian-13/pins.env and recipes/el9/cohort.env, VINYL_TRACK
# release. The id was derived on 2026-07-26 when the release track was
# drafted, before this manifest existed; minting waited for the first
# validated release-track build, which is ci.yml run 30352844760. The
# identity is derived, not chosen: see the canonical input blob in
# registry/README.md and reproduce it with
#
#   python3 tools/release_tool.py cohort-id --cohort vinyl-9.0.1-ac4f719c16f4
#
# status: candidate -- real pinned inputs, evidence recorded per target as the
# CI lanes produce it. It becomes `released` when the pre-release is published
# and every target records the digests of the artifacts actually published.
schema: cachetag-cohort/v1
status: candidate
cohort: vinyl-9.0.1-ac4f719c16f4
cachetag:
  version: 1.0.1
  # Identical to the trunk cohort's cachetag block: one cachetag release is
  # built against both Vinyl inputs. The named v1.0.1 release tag is the
  # build input; its peeled commit and the deterministic archive digest are
  # recorded as evidence and verified by CI.
  source_sha256: "9aba3effcb20cfc70b77a4729990e3cd2ae1712ad242f4e4c45a664e1949eac2"
  git_commit: "a3897aaccf1d6996c00ee14b2c6e1ddac91ac982"
vinyl:
  version: 9.0.1
  # Unlike the trunk cohort, this source_url serves the archive itself:
  # upstream's own release tarball, digest-pinned, downloaded and verified by
  # the lane drivers. No Vinyl git checkout is read on this track.
  source_url: https://vinyl-cache.org/downloads/vinyl-cache-9.0.1.tgz
  source_sha256: "2e8ec67cd213ea6864c763939d64912025557342fad2a5ffda6c7c5b59bdeb17"
  git_commit: "423648c4cb6b225b3268ffc337354ea938f5efee"
  vrt: "23.0"
  # Vinyl bakes VMOD_ABI_Version as "<PACKAGE_STRING> <commit>", so the strict
  # ABI token is this commit id by construction; the lanes assert the baked
  # string in the tarball against this pin before building.
  strict_abi: "423648c4cb6b225b3268ffc337354ea938f5efee"
  patches: []
  # Upstream's own statements about this release, recorded as references and
  # rendered verbatim as links into generated release content -- never
  # restated in this project's voice. Both URLs verified live (HTTP 200) on
  # 2026-07-28. Not a digest input.
  release_notes:
    - title: Vinyl Cache 9.0.1 release notes
      url: https://vinyl-cache.org/releases/rel9.0.1.html
    - title: Changes in Vinyl Cache 9.0
      url: https://vinyl-cache.org/docs/9.0/whats-new/changes-9.0.html
# Built from upstream's digest-pinned release tarball, VINYL_TRACK=release.
engine: vinyl-release
build_profile:
  name: production
  # Revision 1: same single production profile definition as the trunk
  # cohort records.
  revision: 1
# Every VMOD whose catalog lanes build a package for this cohort's engine on
# its targets. Not a hand-maintained wish list: validate_cohort compares it
# against registry/vmods/ in both directions, so a selected VMOD cannot be
# forgotten here and a VMOD nothing builds cannot block every release.
required_vmods:
  - cachetag
  - dict
  - fixture1
  - fixture2
  - fixture3
  - fixture4
  - fixture5
  - fixture6
  - fixture7
  - redis
storage_support:
  - default
targets:
  - debian-13-amd64
  - el9-x86_64
support:
  channel: pre-release
  release_owner: Boffinate
  fellow: excluded
  buddy: source-harness-only
