# A distro-native manifest describes a cachetag package built and tested
# against a distribution's own Vinyl packages. It has no cohort identity: its
# compatibility claim is bound to the exact distro Vinyl binary package
# version recorded below. Debian does not currently ship a Vinyl 9 package, so
# this file exists to fix the schema and lane, not to claim support.
