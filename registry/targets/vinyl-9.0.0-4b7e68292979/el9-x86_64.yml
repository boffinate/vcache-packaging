install:
  # Read from the installed vinyl-cache-devel package by the spec's %build
  #   pkg-config --define-variable=libdir=%{_libdir} --variable=vmoddir vinylapi
  # which fails the build when it disagrees with this value.
  vmoddir: /usr/lib64/vinyl-cache/vmods
  vmoddir_source: pkg-config
# The digests of the RPMs actually published, from release-draft.yml run
# 30193639092. They are NOT the digests the ci.yml run of the same inputs
# produced: RPM headers carry build-time state that SOURCE_DATE_EPOCH does not
# pin, so every EL9 rebuild of identical inputs yields different bytes. The
# Debian lane's .deb, by contrast, is bit-identical across runs, which is why
# that manifest's digests did not need refreshing at publication.
artifacts:
  - filename: libvmod-cachetag-1.0.0-1.el9.x86_64.rpm
    sha256: "19ad3338dc92ae01d6248dfd8bca6ae6186043bfaa1a123866849274453203c3"
  - filename: libvmod-cachetag-debuginfo-1.0.0-1.el9.x86_64.rpm
    sha256: "452567ab698edde281ab50314efa6802dabecf0b829db96b90231da12e1f90ff"
  - filename: libvmod-cachetag-debugsource-1.0.0-1.el9.x86_64.rpm
    sha256: "b08fcb4d943831f3669402bedc3135e0a67e7299abf3524e137a7cb725472ac7"
  - filename: libvmod-cachetag-1.0.0-1.el9.src.rpm
    sha256: "aa4a18a202f56f8ceb0d21ed093dc80d8458fdec563192d010cd0b116c6b6935"
tests:
  # rpmlint over all nine packages in ci.yml run 30192249530: 5 errors and 22
  # warnings, exactly the set triaged item by item in
  # docs/20260724_2240_note_step-7-8-el9-lane.md and waived there with
  # reasons. The lane records rpmlint output rather than enforcing an
  # allowlist, so this verdict rests on that comparison being made, which is
  # weaker than the Debian lane's lintian exit status.
  package_lint: pass
  # recipes/el9/build.sh --smoke-only, in a fresh container: dnf refusing
  # cachetag while the cohort runtime is absent, then install, VCL compile,
  # fetch, warm hit, tag purge, post-purge miss, clean SIGTERM, uninstall
  # leaving the runtime untouched. All steps passed in run 30192249530.
  installed_package_smoke: pass
  # See the Debian target manifest: the suite ran on the pinned archive in the
  # same run, but not against the production-hardened package build the plan
  # asks for. No lane does that yet.
  full_behavior_suite: pending
  # nightly-transactions.yml runs 30192509993 and 30193144553: the mismatch and
  # same-ABI fixtures rebuilt from this cohort's own RPMs, then 17 dnf
  # scenarios in fresh containers. Reproduces the step-9 findings on the real
  # cohort id: plain dnf upgrade refuses the whole transaction under
  # best=True, and the four destructive paths are all --allowerasing with a
  # package named alongside it.
  upgrade_transactions: pass
