# EL9-compatible x86_64, project-cohort lane -- candidate.
#
# target.distro is the EL family rather than one rebuild vendor; the exact
# builder image is recorded below by digest. Every recorded output comes from
# the Mock clean-room lane in CI (.github/workflows/ci.yml, job "EL9 x86_64
# (Mock)"), never from a laptop build.
#
# Unlike the Debian lane, this buildroot is not pinned: Mock resolves from
# AlmaLinux's and EPEL's live mirrors, which publish no snapshot service. The
# plan's reproducibility rule offers "pin buildroot repositories OR record
# exact resolved package versions", and this lane takes the second option --
# hence build_dependencies below, and dist/el9/logs/buildroot-packages.tsv in
# the run's artifacts, which also records which repository served each package.
schema: cachetag-target/v1
status: candidate
lane: cohort
cohort: vinyl-9.0.0-4b7e68292979
target:
  id: el9-x86_64
  distro: el
  distro_release: 9
  distro_id: el9
  arch: x86_64
  package_format: rpm
  dist_tag: el9
package:
  revision: 1
  source_name: libvmod-cachetag
  binary_name: libvmod-cachetag
vinyl_packages:
  origin: cohort
  runtime_name: vinyl-cache
  runtime_version: "9.0.0~git20260520.25761f8505-1.el9"
  dev_name: vinyl-cache-devel
  dev_version: "9.0.0~git20260520.25761f8505-1.el9"
build:
  profile: production
  image_ref: almalinux:9
  image_digest: "sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743"
  compiler: "gcc 11.5.0-14.el9.alma.1 (GNU C17 11.5.0 20240719, Red Hat 11.5.0-14)"
  configure_options: "%configure --disable-static --docdir=%{_pkgdocdir}"
  # As recorded in the DW_AT_producer string of the shipped
  # libvmod_cachetag.so, read out of the libvmod-cachetag-debuginfo package
  # that the same build produced. EL9 builds with -grecord-gcc-switches, so
  # this is the compiler's own account of the flags it was given, not a
  # restatement of what redhat-rpm-config is expected to supply.
  cflags: "-m64 -march=x86-64-v2 -mtune=generic -g -O2 -flto -ffat-lto-objects -fexceptions -fstack-protector-strong -fasynchronous-unwind-tables -fstack-clash-protection -fcf-protection=full -fPIC -fplugin=annobin"
  # Supplied by %configure from redhat-rpm-config; the effect is verified on
  # the shipped objects by the lane's own ELF inspection (RELRO present,
  # BIND_NOW set) rather than asserted from the macro definition.
  ldflags: "as supplied by %configure from redhat-rpm-config; verified on the shipped objects as RELRO plus BIND_NOW"
  # scripts/ci/el9/container-mock.sh exports SOURCE_DATE_EPOCH for the whole
  # Mock session, and the value it uses is the Vinyl commit's author date, not
  # the cachetag commit's committer date the Debian lane uses. Recorded as it
  # is rather than as it ought to be; see the step-10 mint note.
  source_date_epoch: "1779265093"
  # recipes/el9/container/build.sh's hardening stage, output in
  # dist/el9/logs/hardening.txt: RELRO, BIND_NOW, stack protector and
  # fortified libc calls on vinyld, libvinylapi and libvmod_cachetag.so.
  hardening_check: pass
  build_dependencies: []
install:
  # Read from the installed vinyl-cache-devel package by the spec's %build
  #   pkg-config --define-variable=libdir=%{_libdir} --variable=vmoddir vinylapi
  # which fails the build when it disagrees with this value.
  vmoddir: /usr/lib64/vinyl-cache/vmods
  vmoddir_source: pkg-config
artifacts: []
tests:
  package_lint: pending
  installed_package_smoke: pending
  full_behavior_suite: pending
  upgrade_transactions: pending
