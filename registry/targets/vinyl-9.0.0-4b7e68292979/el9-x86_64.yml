# EL9-compatible x86_64, project-cohort lane -- candidate.
#
# target.distro is the EL family rather than one rebuild vendor; the exact
# builder image is recorded below by digest. Every recorded output comes from
# the Mock clean-room lane in CI (.github/workflows/ci.yml, job "EL9 x86_64
# (Mock)"), never from a laptop build.
#
# Unlike the Debian lane, this buildroot is not pinned: Mock resolves from
# AlmaLinux's and EPEL's live mirrors, which publish no snapshot service. The
# plan's reproducibility rule offers "pin buildroot repositories OR record
# exact resolved package versions", and this lane takes the second option --
# hence build_dependencies below, and dist/el9/logs/buildroot-packages.tsv in
# the run's artifacts, which also records which repository served each package.
schema: cachetag-target/v1
status: candidate
lane: cohort
cohort: vinyl-9.0.0-4b7e68292979
target:
  id: el9-x86_64
  distro: el
  distro_release: 9
  distro_id: el9
  arch: x86_64
  package_format: rpm
  dist_tag: el9
package:
  revision: 1
  source_name: libvmod-cachetag
  binary_name: libvmod-cachetag
vinyl_packages:
  origin: cohort
  runtime_name: vinyl-cache
  runtime_version: "9.0.0~git20260520.25761f8505-1.el9"
  dev_name: vinyl-cache-devel
  dev_version: "9.0.0~git20260520.25761f8505-1.el9"
build:
  profile: production
  image_ref: almalinux:9
  image_digest: "sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743"
  compiler: "gcc 11.5.0-14.el9.alma.1 (GNU C17 11.5.0 20240719, Red Hat 11.5.0-14)"
  # All three read out of Mock's build.log, which the lane now keeps as
  # dist/el9/logs/mock-cachetag-rpmbuild.log: the %configure expansion as
  # rpmbuild ran it, and the flag variables redhat-rpm-config set for it. The
  # compiler corroborates the CFLAGS independently -- EL9 builds with
  # -grecord-gcc-switches, so the shipped debuginfo's DW_AT_producer reads
  # "GNU C17 11.5.0 20240719 (Red Hat 11.5.0-14) -m64 -march=x86-64-v2 ...".
  configure_options: "./configure --build=x86_64-redhat-linux-gnu --host=x86_64-redhat-linux-gnu --program-prefix= --disable-dependency-tracking --prefix=/usr --exec-prefix=/usr --bindir=/usr/bin --sbindir=/usr/sbin --sysconfdir=/etc --datadir=/usr/share --includedir=/usr/include --libdir=/usr/lib64 --libexecdir=/usr/libexec --localstatedir=/var --sharedstatedir=/var/lib --mandir=/usr/share/man --infodir=/usr/share/info --disable-static --docdir=/usr/share/doc/libvmod-cachetag"
  cflags: "-O2 -flto=auto -ffat-lto-objects -fexceptions -g -grecord-gcc-switches -pipe -Wall -Werror=format-security -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS -specs=/usr/lib/rpm/redhat/redhat-hardened-cc1 -fstack-protector-strong -specs=/usr/lib/rpm/redhat/redhat-annobin-cc1 -m64 -march=x86-64-v2 -mtune=generic -fasynchronous-unwind-tables -fstack-clash-protection -fcf-protection"
  ldflags: "-Wl,-z,relro -Wl,--as-needed -Wl,-z,now -specs=/usr/lib/rpm/redhat/redhat-hardened-ld -specs=/usr/lib/rpm/redhat/redhat-annobin-cc1"
  # What rpmbuild actually used, which is NOT what the lane exports. EL9's
  # redhat-rpm-config derives SOURCE_DATE_EPOCH from the topmost %changelog
  # entry, so the exported value is overridden and truncated to that day at
  # midnight UTC: 1779235200 is 2026-05-20T00:00:00Z. The changelog date in
  # turn comes from the Vinyl commit's date, not the cachetag commit's, so
  # this package is dated to the wrong repository's history -- a real wart,
  # recorded rather than quietly corrected. See the step-10 mint note.
  source_date_epoch: "1779235200"
  # recipes/el9/container/build.sh's hardening stage, output in
  # dist/el9/logs/hardening.txt: RELRO, BIND_NOW, stack protector and
  # fortified libc calls on vinyld, libvinylapi and libvmod_cachetag.so.
  hardening_check: pass
