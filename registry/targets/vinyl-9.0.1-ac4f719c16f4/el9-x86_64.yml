install:
  # Read from the installed vinyl-cache-devel package by the spec's %build
  #   pkg-config --define-variable=libdir=%{_libdir} --variable=vmoddir vinylapi
  # which fails the build when it disagrees with this value.
  vmoddir: /usr/lib64/vinyl-cache/vmods
  vmoddir_source: pkg-config
# The digests of the RPMs actually published: refreshed from the publishing
# release-draft run 30360552578 (draft draft-20260728T130227Z-aaa14876510c),
# replacing the evidence run 30352844760's values, per the precedent of the
# first cohort's publication. RPM digests are per-run: headers carry
# build-time state SOURCE_DATE_EPOCH does not pin, so every EL9 rebuild of
# identical inputs yields different bytes. The Debian lane's .deb, by
# contrast, is bit-identical across both runs, which is why that manifest's
# digests did not need refreshing.
artifacts:
  - filename: libvmod-cachetag-1.0.1-1.el9.x86_64.rpm
    sha256: "27cefb9180746b1af10cc31e87e38370a4111dd5d9290f15b79e9f9d537a7699"
  - filename: libvmod-cachetag-debuginfo-1.0.1-1.el9.x86_64.rpm
    sha256: "3e86e0b11a259263b31096b65ebf1218492caf01ebaa4496edf2f7a5b77e3b46"
  - filename: libvmod-cachetag-debugsource-1.0.1-1.el9.x86_64.rpm
    sha256: "0b31d7b9e324f2cf03446cc7f670f8fb8e9636f2b403cf96c3a7941708ffdb69"
  - filename: libvmod-cachetag-1.0.1-1.el9.src.rpm
    sha256: "7f17f96c41b2baedcd5f6cc8646ce67b49a16e8ffed708f1dd7e39a3ace8be91"
tests:
  # rpmlint over all nine packages in run 30352844760: the gating pass
  # against recipes/el9/rpmlint-waivers.rpmlintrc reports "9 packages and 0
  # specfiles checked; 0 errors, 0 warnings" (logs/rpmlint-gate.log) and the
  # stage propagates the exit status; the unfiltered findings remain visible
  # in logs/rpmlint.log.
  package_lint: pass
  # recipes/el9 smoke, in a fresh container: dnf refusing cachetag while the
  # cohort runtime is absent, then install, VCL compile, fetch, warm hit,
  # tag purge, post-purge miss, clean SIGTERM, uninstall leaving the runtime
  # untouched. logs/smoke.log of run 30352844760: ALL STEPS PASSED.
  installed_package_smoke: pass
  # ci.yml run 30357799478 (track release,
  # https://github.com/boffinate/vcache-packaging/actions/runs/30357799478),
  # vtc-suite/vtc-suite.sh in a fresh container: the packaged vinyltest --
  # owned by vinyl-cache 9.0.1-1.el9 itself, vtest2 pin db5ccb4a07 -- drove
  # the full default-storage VTC matrix against the installed
  # libvmod-cachetag 1.0.1-1.el9, proven the only libvmod_cachetag.so on
  # the filesystem, sha256
  # 74bb85c40afdfddd1ec2c332af3232d88d848259a550250a307f08283292e9e1 in
  # /usr/lib64/vinyl-cache/vmods. 52/52 passed, 0 skipped; the 25
  # Fellow/Buddy VTCs are excluded by src/Makefile.am's TESTS, and
  # cachetag_wal_test cannot run against installed packages -- its pass
  # stands as source-archive evidence from the 1.0.1 release proof.
  # pm00007=clean, no retry. Mitigations in force: -j1 serial, and
  # -p debug=+vclrel, needed because 9.0.1 lacks 7de492b0e8 ("Shut down
  # pools when stopping"); removable when the release track reaches a Vinyl
  # containing it.
  full_behavior_suite: pass
  # nightly-transactions.yml run 30358318441 (release track): the mismatch
  # and same-ABI fixtures rebuilt from this cohort's own RPMs with the
  # track-derived candidate versions (9.0.2~git20260724.ffffffffffff /
  # .eeeeeeeeeeee, releases 1.mismatchfixture.el9 / 1.sameabifixture.el9),
  # then the dnf scenario matrix in fresh containers against the 9.0.1-1.el9
  # baseline -- 19 rows in mismatch/logs/summary.tsv, one sanity control
  # plus 18 dnf scenarios. Same outcome shape as the trunk cohort's matrix:
  # plain dnf upgrade refuses the whole transaction under best=True, every
  # destructive path carries --allowerasing with a package named alongside
  # it, versionlock blocks the erasing install, and history undo restores
  # the cohort.
  upgrade_transactions: pass
