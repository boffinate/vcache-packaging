  ldflags: "-Wl,-z,relro -Wl,--as-needed -Wl,-z,now -specs=/usr/lib/rpm/redhat/redhat-hardened-ld -specs=/usr/lib/rpm/redhat/redhat-annobin-cc1"
  # Committer date of the cachetag v1.0.1 release commit -- the recorded
  # input registry/README.md defines this field to be. Confirmed to reach
  # the bytes in run 30352844760: the Mock chroot environment in
  # logs/mock-cachetag-rpmbuild.log carries SOURCE_DATE_EPOCH=1785230737
  # (the per-package derived-config forwarding), and the built cachetag
  # RPM's header BUILDTIME reads 1785230737. The 1.0.0-1 evidence recorded
  # the changelog-derived midnight truncation instead; that story lives in
  # the step-10 mint note and the step-2 epoch note.
  source_date_epoch: "1785230737"
  # logs/hardening.txt of run 30352844760 records ELF type DYN, GNU_RELRO,
