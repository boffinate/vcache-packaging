name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/matrix.py validate
      # schemas/ are generated outputs; catch a hand-edit or a stale regen.
      - run: python3 tools/matrix.py schema --check
      - run: python3 tools/matrix.py selftest
      - run: bash scripts/check-package-version-ordering.sh
