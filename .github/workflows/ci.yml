name: CI

# Runs on every pull request and on push to main. Deliberately does NOT run the
# mismatch-fixture or upgrade-transaction matrices (see
# nightly-transactions.yml) and does NOT assemble or publish a release (see
# release-draft.yml) -- per the plan's "Tiered CI workflow" section and "keep
# release credentials out of pull-request workflows".
#
# Restructured 2026-07-28 for Phase 1 of
# docs/20260728_0833_plan_vmod-matrix-failure-isolation.md. The shape is now:
#
#   structural validation ---> VMOD discovery ---> VMOD invocation matrix
#                                                        |
#                                              collector, if: !cancelled()
#
# What changed is the failure domain, not the packages. The single shared
# cachetag-source-archive job that could block the entire package matrix is
# gone; each VMOD gets a complete reusable-workflow invocation, and the
# collector reconciles every expected row against an independently computed
# ledger so a row that never started is reported as missing evidence rather
# than vanishing from the summary. The Debian and EL9 build commands and pins
# moved into .github/workflows/vmod-package.yml unchanged.
#
# Both Vinyl engine channels are still built: `vinyl-trunk-pinned` catches
# problems introduced by Vinyl core changes early, and `vinyl-release` builds
# the packages users will actually install, from the digest-pinned upstream
# release tarball. They were the `track` matrix axis; they are now named engine
# inputs in registry/vmods/cachetag.yml, so a Vinyl channel can never be
# confused with a VMOD source channel. See
# docs/20260726_1235_note_two-track-release-and-trunk.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject:
        description: >-
          Deliberate failure injection, for the failure-isolation verification
          cases in the matrix plan. Dispatch-only and inert everywhere else: a
          pull request or a push always runs with `none`, and nothing below
          reads this input on those events. No build script is modified by any
          of these -- the injection points are the manifest copy, the expanded
          source pins, one step before a package build, and one result upload.
        required: false
        default: none
        type: choice
        options:
          - none
          - manifest # a malformed VMOD manifest -> failed_manifest_validation
          - source_checkout # a ref that cannot resolve -> failed_source_checkout
          - source_digest # a wrong archive digest -> failed_source_digest
          - debian_build # a failing Debian row -> failed_package_build
          - el9_build # a failing EL9 row -> failed_package_build
          - suppress_result # one row uploads no record -> missing_result_record

# Least privilege by default; no job in this workflow needs to write
# anything. release-draft.yml is the only workflow that elevates permissions,
# and only in its own release-assembly job.
permissions:
  contents: read

jobs:
  structural-validation:
    name: structural validation and tooling selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No VMOD checkout here, deliberately. This job validates the registry on
      # behalf of every VMOD, so it must not be able to fail because one VMOD's
      # repository is unreachable. The cachetag configure.ac cross-check runs
      # inside the cachetag invocation, after its own checkout.
      - name: scripts/ci/test-common.sh
        run: scripts/ci/test-common.sh

      - name: tools/release_tool.py selftest
        run: python3 tools/release_tool.py selftest

      - name: tools/ci_matrix.py selftest
        run: python3 tools/ci_matrix.py selftest

      - name: registry schemas, identities and wiring (no VMOD source needed)
        run: python3 tools/release_tool.py --no-cachetag-cross-check validate

      - name: VMOD catalog structure
        run: python3 tools/ci_matrix.py check-catalog

  discover-vmods:
    name: discover selected VMODs
    needs: structural-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Ids and paths come from the checked-in file names, never from parsing a
      # manifest. Parsing happens inside each VMOD's own invocation, so one
      # malformed entry becomes one failed matrix copy instead of preventing
      # discovery of the others.
      - name: list the selected VMOD manifests
        id: discover
        shell: bash
        run: |
          set -eu
          set -o pipefail
          python3 tools/ci_matrix.py list-vmods --format github | tee -a "$GITHUB_OUTPUT"

  vmods:
    name: VMOD
    needs: [structural-validation, discover-vmods]
    if: ${{ !cancelled() && needs.discover-vmods.result == 'success' }}
    strategy:
      fail-fast: false
      # A cost control, not a failure control: every entry stays queued after
      # another entry fails.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover-vmods.outputs.matrix) }}
    uses: ./.github/workflows/vmod-package.yml
    with:
      manifest: ${{ matrix.manifest }}
      vmod_id: ${{ matrix.id }}
      tier: ci
      inject: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject) || 'none' }}

  collect:
    name: reconcile every expected row
    needs: [structural-validation, discover-vmods, vmods]
    # Runs after ordinary failures and respects an intentional cancellation.
    # This is the job that makes a partial run legible: it reports successes
    # even when the run is red, and it fails the run when a required row failed
    # or produced no evidence at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download every result record
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results

      # Separate directories per artifact, not one shared one: every lane
      # writes a file literally named SHA256SUMS and a shared directory would
      # let one row silently clobber another's.
      - name: download every package artifact
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: packages-*
          path: packages

      # The collector rebuilds the expected ledger from its own fresh checkout,
      # so an injected malformed manifest has to be reapplied here too --
      # otherwise the injected run would reconcile against the full, valid lane
      # list and report exactly the invented lane rows the plan's case 2
      # forbids. Same corruption, same file, as vmod-package.yml applies.
      - name: inject a malformed manifest
        if: github.event_name == 'workflow_dispatch' && inputs.inject == 'manifest'
        shell: bash
        run: |
          set -eu
          for manifest in registry/vmods/*.yml; do
            printf 'schema: vmod-ci/v1\nid: %s\n' "$(basename "$manifest" .yml)" \
              > "$manifest"
          done

      - name: note the upstream job outcomes
        shell: bash
        run: |
          set -eu
          {
            echo "## Upstream job outcomes"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| structural-validation | ${{ needs.structural-validation.result }} |"
            echo "| discover-vmods | ${{ needs.discover-vmods.result }} |"
            echo "| vmods (aggregate) | ${{ needs.vmods.result }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: combined checksum summary
        shell: bash
        run: |
          set -eu
          {
            echo "## Combined checksum summary"
            echo
            echo "Native package filenames as built, which are also the names"
            echo "release-draft.yml publishes them under; the distro-bearing"
            echo "release-asset name the registry generates"
            echo "(\`libvmod-cachetag-1.0.1-1-debian-13-amd64.deb\`) is recorded in"
            echo "\`release-manifest.json\` rather than used as a filename, because"
            echo "renaming a .deb contradicts the .changes and .buildinfo beside it."
            echo
            if [ -d packages ]; then
              find packages -name SHA256SUMS | sort | while read -r sums; do
                echo "### $(dirname "${sums#packages/}")"
                echo '```text'
                cat "$sums"
                echo '```'
                echo
              done
            else
              echo "No package artifacts were produced."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, because it is the step that fails the run. Everything the
      # summary should show has been written by now.
      - name: reconcile the expected ledger against the observed results
        shell: bash
        run: |
          set -eu
          python3 tools/ci_matrix.py reconcile \
            --tier ci \
            --results "$GITHUB_WORKSPACE/results" \
            --json "$GITHUB_WORKSPACE/reconciled.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload the reconciled ledger
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ci-reconciled-ledger
          path: reconciled.json
          if-no-files-found: warn
          retention-days: 14
