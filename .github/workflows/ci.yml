name: CI

# Runs on every pull request and on push to main. It invokes the per-VMOD
# reusable workflow at tier `ci`, which deliberately does NOT run the
# mismatch-fixture or upgrade-transaction matrices -- those are the
# `transactions` tier, a deliberate dispatch against one release cohort's
# packages and never a scheduled or per-push run -- and does NOT assemble or
# publish a release (see release-draft.yml). Per the plan's "Tiered CI workflow"
# section and "keep release credentials out of pull-request workflows".
#
# Restructured 2026-07-28 for Phases 1 and 2 of
# docs/20260728_0833_plan_vmod-matrix-failure-isolation.md. The shape is now:
#
#   structural validation --+-> VMOD discovery -------------+
#                           |                               |
#                           +-> engine discovery            |
#                                    |                      |
#                            engine matrix ----------------+--> VMOD invocation matrix
#                            (fail-fast: false)                       |
#                                                        collector, if: !cancelled()
#
# What changed is the failure domain, not the packages. The single shared
# cachetag-source-archive job that could block the entire package matrix is
# gone; each VMOD gets a complete reusable-workflow invocation, and the
# collector reconciles every expected row against an independently computed
# ledger so a row that never started is reported as missing evidence rather
# than vanishing from the summary. The Debian and EL9 build commands and pins
# moved into .github/workflows/vmod-package.yml unchanged.
#
# Phase 2 added the engine half. The Vinyl runtime, development and debug
# packages are built once per engine input and target here, uploaded as
# `engine-<engine-id>-<target-id>` with their resolved identity inside them, and
# every VMOD package row downloads, verifies and installs that artifact instead
# of rebuilding the engine inside itself. The VMOD matrix depends on the
# aggregate engine matrix only under `!cancelled()`, so a failed engine row
# never skips a VMOD invocation: each row decides from its own requested
# artifact whether it can proceed, and reports `blocked_by_engine_artifact` with
# the engine row identity when it cannot.
#
# Both Vinyl engine channels are still built: `vinyl-trunk-pinned` catches
# problems introduced by Vinyl core changes early, and `vinyl-release` builds
# the packages users will actually install, from the digest-pinned upstream
# release tarball. They were the `track` matrix axis; they are now named engine
# inputs in registry/vmods/cachetag.yml, so a Vinyl channel can never be
# confused with a VMOD source channel. See
# docs/20260726_1235_note_two-track-release-and-trunk.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject:
        description: >-
          Deliberate failure injection, for the failure-isolation verification
          cases in the matrix plan. Dispatch-only and inert everywhere else: a
          pull request or a push always runs with `none`, and nothing below
          reads this input on those events. No build script is modified by any
          of these -- the injection points are the manifest copy, the expanded
          source pins, one step before a package build, and two artifact
          uploads. The two engine cases act on vinyl-release/debian-13-amd64,
          which is tools/ci_matrix.py's INJECT_ENGINE_ROW; it is the one engine
          row BOTH VMODs consume, so the case shows one root cause blocking
          rows in two different VMODs. Its three sibling engine rows and the
          four package rows naming them must complete.
        required: false
        default: none
        type: choice
        options:
          - none
          # Cachetag-scoped. Every one of these must leave dict's four rows
          # green, which is half of the Phase 3 isolation demonstration.
          - manifest # a malformed VMOD manifest -> failed_manifest_validation
          - source_checkout # a ref that cannot resolve -> failed_source_checkout
          - source_digest # a wrong archive digest -> failed_source_digest
          - debian_build # a failing Debian row -> failed_package_build
          - el9_build # a failing EL9 row -> failed_package_build
          - suppress_result # one row uploads no record -> missing_result_record
          # Dict-scoped, and the other half: each must leave cachetag's six
          # rows green. recipe_generation has no cachetag analogue -- it writes
          # an unresolved token into an already-rendered recipe, proving the
          # lane refuses one the generator never saw.
          - dict_source # a ref that cannot resolve -> failed_source_checkout
          - dict_build # a failing Debian row -> failed_package_build
          - recipe_generation # a corrupt generated recipe -> failed_recipe_generation
          # Redis-scoped, added in Step 7 Wave 1 with the third VMOD. Each must
          # leave cachetag's six rows AND dict's four green, which is what makes
          # the isolation claim about a SET rather than about a pair. The build
          # one is aimed at the RPM family because dict's is aimed at the Debian
          # one. patch_omission is the reviewed-patch capability's own gate: it
          # deletes the rendered patch after generation, and the two families
          # refuse it for different reasons -- dpkg-source rejects a 3.0 (quilt)
          # series naming a missing file, build-rpm.sh compares the spec's Patch
          # lines against the files rendered beside it.
          # redis derives its archive from the tag in one step, so a bad ref
          # dies inside the derivation and classifies as failed_source_archive,
          # not dict_source's failed_source_checkout. Measured: run 30491871562.
          - redis_source # a ref that cannot resolve -> failed_source_archive
          - redis_build # a failing EL9 row -> failed_package_build
          - patch_omission # a declared patch removed -> failed_package_build
          # Neither VMOD: these act entirely in the engine matrix below.
          - engine_build # one engine row fails -> blocked_by_engine_artifact
          - suppress_engine_artifact # one engine row publishes nothing -> ditto

# Least privilege by default; no job in this workflow needs to write
# anything. release-draft.yml is the only workflow that elevates permissions,
# and only in its own release-assembly job.
permissions:
  contents: read

jobs:
  structural-validation:
    name: structural validation and tooling selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No VMOD checkout here, deliberately. This job validates the registry on
      # behalf of every VMOD, so it must not be able to fail because one VMOD's
      # repository is unreachable. The cachetag configure.ac cross-check runs
      # inside the cachetag invocation, after its own checkout.
      - name: scripts/ci/test-common.sh
        run: scripts/ci/test-common.sh

      - name: tools/release_tool.py selftest
        run: python3 tools/release_tool.py selftest

      - name: tools/ci_matrix.py selftest
        run: python3 tools/ci_matrix.py selftest

      - name: registry schemas, identities and wiring (no VMOD source needed)
        run: python3 tools/release_tool.py --no-cachetag-cross-check validate

      - name: VMOD catalog structure
        run: python3 tools/ci_matrix.py check-catalog

  discover-vmods:
    name: discover selected VMODs
    needs: structural-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Ids and paths come from the checked-in file names, never from parsing a
      # manifest. Parsing happens inside each VMOD's own invocation, so one
      # malformed entry becomes one failed matrix copy instead of preventing
      # discovery of the others.
      - name: list the selected VMOD manifests
        id: discover
        shell: bash
        run: |
          set -eu
          set -o pipefail
          python3 tools/ci_matrix.py list-vmods --format github | tee -a "$GITHUB_OUTPUT"

  discover-engines:
    name: select the shared engine rows
    needs: structural-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The fourth ledger builder. Engine rows are derived from the package
      # lanes that declare them, so this job is one of the places that decides
      # what the run is *supposed* to contain -- and Phase 1's rule applies:
      # any injection that changes what the ledger should contain must reach
      # every builder of it. Without this step, `inject=manifest` would derive
      # four engine rows from a manifest the rest of the run treats as
      # unparseable, and the run would end with four stray `passed` engine
      # records that no expected row claims. With it, engine-matrix sees no
      # valid lane, emits count=0, the engine job's `!= '0'` guard skips it,
      # and the summary collapses to the single failed_manifest_validation row
      # the case exists to demonstrate.
      # Scoped to the VMOD the injection names, which since 2026-07-28 is one
      # VMOD and not all of them. The scope comes from ci_matrix.py rather than
      # from a comparison written here, because four jobs rebuild the expected
      # ledger from their own fresh checkout and they must all corrupt the same
      # file: corrupting different ones would build different ledgers and the
      # run would report rows nobody asked for.
      - name: inject a malformed manifest
        if: github.event_name == 'workflow_dispatch' && inputs.inject == 'manifest'
        shell: bash
        run: |
          set -eu
          victim=$(python3 tools/ci_matrix.py injection-scope --inject manifest)
          [ -n "$victim" ] || { echo "E: the manifest injection names no VMOD" >&2; exit 1; }
          printf 'schema: vmod-ci/v1\nid: %s\n' "$victim" \
            > "registry/vmods/$victim.yml"
          cat "registry/vmods/$victim.yml"

      # This job does parse the VMOD manifests, because the engine rows are
      # derived from the package lanes that consume them. It is still not a
      # global gate: ci_matrix.py drops a manifest that does not parse, so a
      # malformed entry costs its own invocation row and nothing else. The
      # engine rows another VMOD asked for are unaffected.
      - name: derive the engine rows from the selected package lanes
        id: discover
        shell: bash
        run: |
          set -eu
          set -o pipefail
          python3 tools/ci_matrix.py engine-matrix \
            --tier ci \
            --inject "${{ (github.event_name == 'workflow_dispatch' && inputs.inject) || 'none' }}" \
            --format github | tee -a "$GITHUB_OUTPUT"

  engine:
    name: engine ${{ matrix.engine }} (${{ matrix.target }})
    needs: [structural-validation, discover-engines]
    if: ${{ !cancelled() && needs.discover-engines.result == 'success' && needs.discover-engines.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      # One engine row failing must not cancel the other three, and must not
      # cancel the VMOD rows that consume the three that worked.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-engines.outputs.matrix) }}
    env:
      VINYL_TRACK: ${{ matrix.vinyl_track }}
      # The pinned trunk snapshot, only read when the row's track is `trunk`;
      # the release track builds from the digest-pinned upstream tarball that
      # recipes/*/pins.env names and never reads a Vinyl checkout.
      VINYL_GIT_COMMIT: 25761f8505817ac50df994270bfe75b60073e33e
      VINYL_VTEST2_COMMIT: db5ccb4a078da40b3ec1ca3c18bf498bb1520888
      # Index digest resolved 2026-07-25; must match EL9_IMAGE in
      # recipes/el9/cohort.env, which is authoritative.
      EL9_IMAGE: almalinux:9@sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # No VMOD checkout anywhere in this job. That independence is the whole
      # point of the split: a shared engine package must not be able to fail
      # because one VMOD's repository is unreachable.
      - name: checkout ../vinyl-cache (pinned commit, not a GitHub remote)
        id: vinyl
        if: matrix.vinyl_track == 'trunk'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"

      # Injection case 6. Placed before the build and after everything that
      # could legitimately fail, so the classification is unambiguous. Inert
      # unless a human dispatched this workflow with an engine injection, and
      # marked on exactly one row by ci_matrix.py rather than by a workflow
      # expression that could drift from it.
      - name: injected engine-build failure
        id: inject
        if: matrix.inject_build == 'true' && steps.vinyl.outcome != 'failure'
        continue-on-error: true
        run: exit 1

      # ---- Debian 13 amd64 (pbuilder), engine scope. ----
      - name: assemble the pinned Vinyl source tree (build.sh source-engine)
        id: deb_source
        if: matrix.family == 'deb' && steps.vinyl.outcome != 'failure' && steps.inject.outcome != 'failure'
        continue-on-error: true
        run: recipes/debian-13/build.sh source-engine
        working-directory: vcache-packaging

      - name: build the pinned buildroot with mmdebstrap
        id: deb_chroot
        if: matrix.family == 'deb' && steps.deb_source.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci/debian13/make-chroot.sh
        working-directory: vcache-packaging

      - name: build the Vinyl packages in the pinned debian:trixie container (pbuilder)
        id: deb_build
        if: matrix.family == 'deb' && steps.deb_chroot.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci/debian13/debian-lane.sh engine
        working-directory: vcache-packaging

      - name: engine ABI and hardening assertions
        id: deb_abi
        if: matrix.family == 'deb' && steps.deb_build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci/debian13/assert-packages.sh engine
        working-directory: vcache-packaging

      # ---- EL9 x86_64 (Mock), engine scope. ----
      - name: Mock build (vinyl-cache only)
        id: el9_build
        if: matrix.family == 'rpm' && steps.vinyl.outcome != 'failure' && steps.inject.outcome != 'failure'
        continue-on-error: true
        run: |
          bash scripts/ci/el9/mock-build.sh \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "" \
            "$EL9_IMAGE" \
            engine
        working-directory: vcache-packaging

      # ---- Describe the artifact, then publish it. ----
      #
      # The metadata is what a consumer verifies before it builds anything, so
      # it is produced from the packages that actually exist rather than from
      # the pins alone: ci_matrix.py hashes every file it is given and records
      # a roll-up over the set. `engine-identity.sh` supplies the resolved
      # version, commit, ABI and build-input identity, read out of this row's
      # own pin file for this row's track.
      - name: stage and describe the engine artifact
        id: describe
        if: steps.deb_abi.outcome == 'success' || steps.el9_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          staging="$GITHUB_WORKSPACE/engine-artifact"
          mkdir -p "$staging/packages"
          case "${{ matrix.family }}" in
          deb)
            # Explicit suffixes, not `vinyl-cache*`: dist/debian-13 also holds
            # the cached upstream vinyl-cache-<version>.tgz on the release
            # track, which is a build input rather than a produced package.
            for pattern in .deb .ddeb .dsc .changes .buildinfo .tar.gz .tar.xz; do
              find dist/debian-13 -maxdepth 1 -type f \
                -name "vinyl-cache*$pattern" -exec cp -p {} "$staging/packages/" \;
            done
            ;;
          rpm)
            find dist/el9/packages -maxdepth 1 -type f \
              -name 'vinyl-cache*.rpm' -exec cp -p {} "$staging/packages/" \;
            ;;
          esac
          ls -la "$staging/packages"
          scripts/ci/engine-identity.sh "${{ matrix.family }}" \
            > "$staging/engine-identity.env"
          cat "$staging/engine-identity.env"
          python3 tools/ci_matrix.py engine-metadata \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --identity "$staging/engine-identity.env" \
            --packages "$staging/packages" \
            --out "$staging/engine-metadata.json"
        working-directory: vcache-packaging

      # Injection case 6b: the engine row builds and describes its artifact but
      # never publishes it. Its own row stays green; only the consumers that
      # name it must go red, which is the purest form of the property.
      - name: upload the engine artifact
        id: upload
        if: >-
          steps.describe.outcome == 'success'
          && matrix.suppress_artifact != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.engine_artifact }}
          path: engine-artifact
          if-no-files-found: error
          retention-days: 14

      - name: classify and record the engine result
        id: record
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          if [ "${{ steps.vinyl.outcome }}" = "failure" ]; then
            set_status failed_engine_build "the pinned Vinyl source was unavailable"
          elif [ "${{ steps.inject.outcome }}" = "failure" ]; then
            set_status failed_engine_build "injected engine-build failure"
          elif [ "${{ steps.deb_source.outcome }}" = "failure" ]; then
            set_status failed_engine_build "build.sh source-engine failed"
          elif [ "${{ steps.deb_chroot.outcome }}" = "failure" ]; then
            set_status failed_infrastructure "the mmdebstrap buildroot could not be built"
          elif [ "${{ steps.deb_build.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_build.outcome }}" = "failure" ]; then
            set_status failed_engine_build "the Vinyl package build failed"
          elif [ "${{ steps.deb_abi.outcome }}" = "failure" ]; then
            set_status failed_abi_or_hardening "assert-packages.sh engine failed"
          elif [ "${{ steps.describe.outcome }}" != "success" ]; then
            set_status failed_infrastructure \
              "the engine artifact could not be staged or described"
          elif [ "${{ matrix.suppress_artifact }}" = "true" ]; then
            : # deliberately published nothing; this row is still green
          elif [ "${{ steps.upload.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the engine artifact upload failed"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/engine.json" \
            --kind engine \
            --vmod "" \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --status "$status" \
            --stage engine \
            --detail "$detail" \
            --artifact "${{ matrix.engine_artifact }}"
        working-directory: vcache-packaging

      # The record and the logs together, unconditionally. The record is the
      # guaranteed evidence and always exists, so `error` still means what it
      # says while the log globs are free to match nothing on a row that failed
      # before it produced any. Build logs deliberately do NOT travel inside the
      # engine artifact: that artifact is a dependency, and a consumer should
      # download packages and metadata, not another row's logs.
      - name: upload the engine result record and logs
        id: upload_result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: |
            results/engine.json
            engine-artifact/engine-metadata.json
            engine-artifact/engine-identity.env
            vcache-packaging/dist/debian-13/logs/**
            vcache-packaging/dist/el9/logs/**
          if-no-files-found: error
          retention-days: 14

      - name: fail when this engine row failed
        if: steps.record.outputs.status != 'passed' || steps.upload_result.outcome == 'failure'
        run: exit 1

  vmods:
    name: VMOD
    needs: [structural-validation, discover-vmods, engine]
    # Deliberately NOT ordinary `needs` semantics on the engine matrix: a failed
    # engine row must not skip the VMOD invocations. Every invocation starts and
    # each of its rows decides from its own requested artifact whether it can
    # proceed. Waiting for all engine rows before starting is accepted for now;
    # the plan says to optimize start latency only if measurements justify it.
    if: ${{ !cancelled() && needs.discover-vmods.result == 'success' }}
    strategy:
      fail-fast: false
      # A cost control, not a failure control: every entry stays queued after
      # another entry fails.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover-vmods.outputs.matrix) }}
    uses: ./.github/workflows/vmod-package.yml
    with:
      manifest: ${{ matrix.manifest }}
      vmod_id: ${{ matrix.id }}
      tier: ci
      inject: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject) || 'none' }}

  collect:
    name: reconcile every expected row
    needs: [structural-validation, discover-vmods, discover-engines, engine, vmods]
    # Runs after ordinary failures and respects an intentional cancellation.
    # This is the job that makes a partial run legible: it reports successes
    # even when the run is red, and it fails the run when a required row failed
    # or produced no evidence at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download every result record
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results

      # Separate directories per artifact, not one shared one: every lane
      # writes a file literally named SHA256SUMS and a shared directory would
      # let one row silently clobber another's.
      - name: download every package artifact
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: packages-*
          path: packages

      # The collector rebuilds the expected ledger from its own fresh checkout,
      # so an injected malformed manifest has to be reapplied here too --
      # otherwise the injected run would reconcile against the full, valid lane
      # list and report exactly the invented lane rows the plan's case 2
      # forbids. Same corruption, same file, as vmod-package.yml applies.
      # Scoped to the VMOD the injection names, which since 2026-07-28 is one
      # VMOD and not all of them. The scope comes from ci_matrix.py rather than
      # from a comparison written here, because four jobs rebuild the expected
      # ledger from their own fresh checkout and they must all corrupt the same
      # file: corrupting different ones would build different ledgers and the
      # run would report rows nobody asked for.
      - name: inject a malformed manifest
        if: github.event_name == 'workflow_dispatch' && inputs.inject == 'manifest'
        shell: bash
        run: |
          set -eu
          victim=$(python3 tools/ci_matrix.py injection-scope --inject manifest)
          [ -n "$victim" ] || { echo "E: the manifest injection names no VMOD" >&2; exit 1; }
          printf 'schema: vmod-ci/v1\nid: %s\n' "$victim" \
            > "registry/vmods/$victim.yml"
          cat "registry/vmods/$victim.yml"

      - name: note the upstream job outcomes
        shell: bash
        run: |
          set -eu
          {
            echo "## Upstream job outcomes"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| structural-validation | ${{ needs.structural-validation.result }} |"
            echo "| discover-vmods | ${{ needs.discover-vmods.result }} |"
            echo "| discover-engines | ${{ needs.discover-engines.result }} |"
            echo "| engine (aggregate) | ${{ needs.engine.result }} |"
            echo "| vmods (aggregate) | ${{ needs.vmods.result }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: combined checksum summary
        shell: bash
        run: |
          set -eu
          {
            echo "## Combined checksum summary"
            echo
            echo "Native package filenames as built, which are also the names"
            echo "release-draft.yml publishes them under; the distro-bearing"
            echo "release-asset name the registry generates"
            echo "(\`libvmod-cachetag-1.0.1-1-debian-13-amd64.deb\`) is recorded in"
            echo "\`release-manifest.json\` rather than used as a filename, because"
            echo "renaming a .deb contradicts the .changes and .buildinfo beside it."
            echo
            if [ -d packages ]; then
              find packages -name SHA256SUMS | sort | while read -r sums; do
                echo "### $(dirname "${sums#packages/}")"
                echo '```text'
                cat "$sums"
                echo '```'
                echo
              done
            else
              echo "No package artifacts were produced."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, because it is the step that fails the run. Everything the
      # summary should show has been written by now.
      - name: reconcile the expected ledger against the observed results
        shell: bash
        run: |
          set -eu
          python3 tools/ci_matrix.py reconcile \
            --tier ci \
            --results "$GITHUB_WORKSPACE/results" \
            --json "$GITHUB_WORKSPACE/reconciled.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload the reconciled ledger
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ci-reconciled-ledger
          path: reconciled.json
          if-no-files-found: warn
          retention-days: 14
