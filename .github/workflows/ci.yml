name: CI

# Draft, unreviewed and unexecuted (see ../DESIGN.md). Runs on every pull
# request and on push to main. Deliberately does NOT run the mismatch-fixture
# or upgrade-transaction matrices (see nightly-transactions.yml) and does NOT
# assemble or publish a release (see release-draft.yml) -- per the plan's
# "Tiered CI workflow" section and "keep release credentials out of
# pull-request workflows".

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job in this workflow needs to write
# anything. release-draft.yml is the only workflow that elevates permissions,
# and only in its own release-assembly job.
permissions:
  contents: read

env:
  # Pinned inputs, copied here from recipes/debian-13/build.sh and
  # recipes/el9/cohort.env so this workflow can check them out before those
  # scripts run. NEVER edit these to make a failing assertion pass -- a
  # mismatch here means the pinned value and the actual input disagree, and
  # that is the thing this workflow exists to catch.
  VINYL_GIT_COMMIT: 25761f8505817ac50df994270bfe75b60073e33e
  VINYL_VTEST2_COMMIT: db5ccb4a078da40b3ec1ca3c18bf498bb1520888
  CACHETAG_VERSION: 1.0.0
  CACHETAG_SOURCE_SHA256: a262ac7a74a1464d4c0a4cc6f072ea04a77ff660b25bf0befd32dc63c18fb329
  # Exact pinned commit (closes DESIGN.md #10.1); the archive digest above is
  # a function of this commit (mtimes are pinned to its committer date), so
  # the two move together, and with the lane pins in recipes/debian-13/build.sh
  # and recipes/el9/cohort.env. Point v1.0.0 at this commit when tagging.
  CACHETAG_REF: fcc369d23b199cc8e41086f28f2322256a8843d9
  # Index digest resolved 2026-07-25 (`docker buildx imagetools inspect
  # almalinux:9`); must match EL9_IMAGE in recipes/el9/cohort.env, which is
  # authoritative (build.sh re-sources cohort.env, clobbering any env
  # override, so the pin lives there and is mirrored here for steps that
  # run containers directly).
  EL9_IMAGE: almalinux:9@sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743

jobs:
  registry-selftest:
    name: registry selftest and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout libvmod-cachetag (for the configure.ac cross-check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag

      - name: tools/release_tool.py selftest
        run: python3 tools/release_tool.py selftest
        working-directory: vcache-packaging

      - name: tools/release_tool.py validate
        run: |
          python3 tools/release_tool.py \
            --cachetag-src "$GITHUB_WORKSPACE/libvmod-cachetag" \
            validate
        working-directory: vcache-packaging

  cachetag-source-archive:
    name: build and pin the cachetag source archive
    needs: registry-selftest
    runs-on: ubuntu-latest
    # See DESIGN.md #9: a full Vinyl autotools build plus a full `make
    # distcheck` of the Default-storage VTC suite. Unmeasured; this is a
    # guess, not a measurement.
    timeout-minutes: 90
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout libvmod-cachetag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag
          fetch-depth: 0 # release-source-archive.sh reads git commit/committer-date metadata

      - name: checkout ../vinyl-cache (pinned commit, not a GitHub remote)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"

      - name: build docker/vinyl-cache-ubuntu-build.Dockerfile
        run: |
          docker build -t vinyl-cache-ubuntu-build \
            -f docker/vinyl-cache-ubuntu-build.Dockerfile docker
        working-directory: libvmod-cachetag

      - name: scripts/release-source-archive.sh
        run: |
          bash "$GITHUB_WORKSPACE/vcache-packaging/scripts/ci/source-archive.sh" \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" \
            "$CACHETAG_SOURCE_SHA256"
        working-directory: libvmod-cachetag

      - name: upload the pinned source archive
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cachetag-source-archive
          path: |
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz.sha256
            libvmod-cachetag/release/dist/libvmod-cachetag-*.metadata.json
          if-no-files-found: error
          retention-days: 14

  debian-13:
    name: Debian 13 amd64 (sbuild)
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout libvmod-cachetag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag

      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"

      - name: download the pinned cachetag source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cachetag-source-archive
          path: libvmod-cachetag/release/dist

      - name: assemble the pinned source trees (unchanged, build.sh source)
        run: recipes/debian-13/build.sh source
        working-directory: vcache-packaging

      - name: materialize the sbuild chroot from the pinned digest
        run: bash scripts/ci/debian13/make-chroot.sh
        working-directory: vcache-packaging

      - name: sbuild vinyl-cache
        run: bash scripts/ci/debian13/sbuild-vinyl.sh
        working-directory: vcache-packaging

      - name: sbuild libvmod-cachetag (against the vinyl-cache .debs just built)
        run: bash scripts/ci/debian13/sbuild-cachetag.sh
        working-directory: vcache-packaging

      - name: ABI and hardening assertions (mirrors stage-vinyl.sh / stage-cachetag.sh)
        run: bash scripts/ci/debian13/assert-packages.sh
        working-directory: vcache-packaging

      - name: lint (unchanged, build.sh lint)
        run: recipes/debian-13/build.sh lint
        working-directory: vcache-packaging

      - name: installed-package smoke, fresh container (unchanged, build.sh smoke)
        run: recipes/debian-13/build.sh smoke
        working-directory: vcache-packaging

      - name: checksums (unchanged, build.sh sums)
        run: recipes/debian-13/build.sh sums
        working-directory: vcache-packaging

      - name: upload debian-13 artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: debian-13-packages
          path: |
            vcache-packaging/dist/debian-13/*.deb
            vcache-packaging/dist/debian-13/*.ddeb
            vcache-packaging/dist/debian-13/*.dsc
            vcache-packaging/dist/debian-13/*.changes
            vcache-packaging/dist/debian-13/*.buildinfo
            vcache-packaging/dist/debian-13/*.tar.*
            vcache-packaging/dist/debian-13/SHA256SUMS
            vcache-packaging/dist/debian-13/logs/**
            vcache-packaging/dist/debian-13/work/target.txt
          if-no-files-found: error
          retention-days: 14

  el9:
    name: EL9 x86_64 (Mock)
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout libvmod-cachetag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag

      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"

      - name: download the pinned cachetag source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cachetag-source-archive
          path: libvmod-cachetag/release/dist

      - name: Mock build (vinyl-cache, then libvmod-cachetag)
        run: |
          bash scripts/ci/el9/mock-build.sh \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$EL9_IMAGE"
        working-directory: vcache-packaging

      # `deps` first because this is a fresh container: stage_lint calls
      # rpmlint directly and stage_deps is what installs it. In the local
      # lane all stages share one container, so deps has always already run
      # by the time lint does; here it has not.
      - name: report + rpmlint (unchanged, container/build.sh stage_deps stage_report stage_lint)
        run: |
          docker run --rm \
            -v "$PWD/recipes/el9:/recipes:ro" \
            -v "$PWD/dist/el9:/out" \
            -w /out \
            "$EL9_IMAGE" \
            bash /recipes/container/build.sh deps report lint
        working-directory: vcache-packaging

      - name: installed-package smoke, fresh container (unchanged, build.sh --smoke-only)
        run: recipes/el9/build.sh --smoke-only
        working-directory: vcache-packaging

      - name: upload el9 artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: el9-packages
          path: |
            vcache-packaging/dist/el9/packages/*.rpm
            vcache-packaging/dist/el9/SHA256SUMS
            vcache-packaging/dist/el9/logs/**
            vcache-packaging/dist/el9/image.txt
          if-no-files-found: error
          retention-days: 14

  checksums-summary:
    name: combined checksum summary
    needs: [debian-13, el9]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: download debian-13 artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: debian-13-packages
          path: debian-13

      - name: download el9 artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: el9-packages
          path: el9

      - name: write the combined summary
        run: |
          {
            echo "## Combined checksum summary"
            echo
            echo "Native package filenames as built. These are NOT the plan's"
            echo "release-asset names (\`libvmod-cachetag-1.0.0-1-debian-13-amd64.deb\`)"
            echo "-- those require a \`candidate\` cohort manifest, which does not"
            echo "exist yet (see DESIGN.md open question #2)."
            echo
            echo "### debian-13"
            echo '```text'
            cat debian-13/SHA256SUMS
            echo '```'
            echo
            echo "### el9"
            echo '```text'
            cat el9/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
