name: Release draft assembly

# Design notes: docs/20260725_1740_note_step-10-ci-design.md (the file the
# other comments here call DESIGN.md; it was renamed into docs/ under this
# repository's dated-note convention). Manual-trigger only:
# this is the plan's release workflow steps 1-12 ("Upload every asset to an
# internal draft GitHub Release for final validation"), NOT step 14
# ("publish it as a GitHub pre-release"). Publishing the pre-release stays a
# human/orchestrator action, per the gate note's step-10 sequencing
# ("CI clean-room builds first, then the draft release, then a real
# experimental pre-release is allowed").
#
# This workflow always does a full, fresh, clean-room rebuild rather than
# reusing a prior ci.yml run's artifacts -- so that what lands in the draft
# release is unambiguously the output of one traceable run, not a mix of
# whatever artifacts happened to still be retained from an earlier one.

on:
  workflow_dispatch:
    inputs:
      cachetag_ref:
        description: >-
          libvmod-cachetag ref to build from. Defaults to the v1.0.0 tag,
          which points at the commit CACHETAG_SOURCE_SHA256 below is a
          function of. Overriding it is for dry runs only: a mismatch fails
          the archive digest assertion rather than publishing a different
          source.
        required: false
        default: v1.0.0
        type: string
      release_archive:
        description: >-
          Build the source archive in --release mode, which refuses to run
          unless the working tree is clean and HEAD carries the annotated
          vX.Y.Z tag. Only the metadata sidecar's mode/release_stamp differ;
          the archive bytes are a function of the commit, so the digest must
          not move.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  VINYL_GIT_COMMIT: 25761f8505817ac50df994270bfe75b60073e33e
  VINYL_VTEST2_COMMIT: db5ccb4a078da40b3ec1ca3c18bf498bb1520888
  CACHETAG_SOURCE_SHA256: a262ac7a74a1464d4c0a4cc6f072ea04a77ff660b25bf0befd32dc63c18fb329
  EL9_IMAGE: almalinux:9

jobs:
  registry-selftest:
    name: registry selftest and validate --require-releasable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ inputs.cachetag_ref }}
          path: libvmod-cachetag
      - run: python3 tools/release_tool.py selftest
        working-directory: vcache-packaging
      # A hard gate since the first real cohort was minted on 2026-07-26. It
      # was informational while every checked-in cohort was a `template`, and
      # a release could not be release-ready by construction. Now it can, so a
      # failure here means the registry does not describe something publishable
      # -- a pending test verdict, a missing artifact digest, a hand-written
      # VMOD directory -- and the run must stop rather than assemble a draft
      # the registry cannot vouch for.
      - name: validate --require-releasable
        run: |
          python3 tools/release_tool.py \
            --cachetag-src "$GITHUB_WORKSPACE/libvmod-cachetag" \
            validate --require-releasable
        working-directory: vcache-packaging

  cachetag-source-archive:
    needs: registry-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ inputs.cachetag_ref }}
          path: libvmod-cachetag
          fetch-depth: 0
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - name: build docker/vinyl-cache-ubuntu-build.Dockerfile
        run: |
          docker build -t vinyl-cache-ubuntu-build \
            -f docker/vinyl-cache-ubuntu-build.Dockerfile docker
        working-directory: libvmod-cachetag
      - name: scripts/release-source-archive.sh
        run: |
          bash "$GITHUB_WORKSPACE/vcache-packaging/scripts/ci/source-archive.sh" \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" \
            "$CACHETAG_SOURCE_SHA256" \
            "${{ inputs.release_archive && 'release' || 'dev' }}"
        working-directory: libvmod-cachetag
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-cachetag-source-archive
          path: |
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz.sha256
            libvmod-cachetag/release/dist/libvmod-cachetag-*.metadata.json
          if-no-files-found: error
          retention-days: 14

  debian-13:
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ inputs.cachetag_ref }}
          path: libvmod-cachetag
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-cachetag-source-archive
          path: libvmod-cachetag/release/dist
      - run: recipes/debian-13/build.sh source
        working-directory: vcache-packaging
      - run: bash scripts/ci/debian13/make-chroot.sh
        working-directory: vcache-packaging
      - run: bash scripts/ci/debian13/debian-lane.sh
        working-directory: vcache-packaging
      - run: bash scripts/ci/debian13/assert-packages.sh
        working-directory: vcache-packaging
      - run: recipes/debian-13/build.sh lint smoke sums
        working-directory: vcache-packaging
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-debian-13-packages
          path: |
            vcache-packaging/dist/debian-13/*.deb
            vcache-packaging/dist/debian-13/*.dsc
            vcache-packaging/dist/debian-13/*.changes
            vcache-packaging/dist/debian-13/*.buildinfo
            vcache-packaging/dist/debian-13/*.tar.*
            vcache-packaging/dist/debian-13/SHA256SUMS
            vcache-packaging/dist/debian-13/logs/**
          if-no-files-found: error
          retention-days: 90

  el9:
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ inputs.cachetag_ref }}
          path: libvmod-cachetag
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-cachetag-source-archive
          path: libvmod-cachetag/release/dist
      - run: |
          bash scripts/ci/el9/mock-build.sh \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$EL9_IMAGE"
        working-directory: vcache-packaging
      - run: |
          docker run --rm \
            -v "$PWD/recipes/el9:/recipes:ro" \
            -v "$PWD/dist/el9:/out" \
            -w /out \
            "$EL9_IMAGE" \
            bash /recipes/container/build.sh deps report lint
          recipes/el9/build.sh --smoke-only
        working-directory: vcache-packaging
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-el9-packages
          path: |
            vcache-packaging/dist/el9/packages/*.rpm
            vcache-packaging/dist/el9/SHA256SUMS
            vcache-packaging/dist/el9/logs/**
          if-no-files-found: error
          retention-days: 90

  assemble-draft-release:
    name: assemble the internal draft GitHub Release
    needs: [debian-13, el9]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Elevated permissions and a protected environment are confined to this
    # one job. Configure the `release-draft` environment's protection rules
    # (required reviewers, or restrict to a release-owner team) in the
    # repository settings; this workflow file only names the environment.
    environment: release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # Downloaded into separate subdirectories, not one shared "assets"
      # directory: both lanes produce a file literally named SHA256SUMS, and
      # a shared directory would silently let the second download clobber
      # the first. release-manifest.sh reads all three subdirectories and
      # writes one merged, lane-qualified checksum file.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-cachetag-source-archive
          path: assets/source-archive
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-debian-13-packages
          path: assets/debian-13
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-el9-packages
          path: assets/el9

      # This one script now assembles the upload directory, the merged
      # checksum file and the manifest, so that the names in
      # RELEASE-SHA256SUMS are by construction the names the assets are
      # published under. The workflow used to flatten the assets itself with
      # its own copy of every glob while the script wrote lane-prefixed paths
      # into the checksum file, which matched nothing a user could download.
      - name: assemble the upload directory, RELEASE-SHA256SUMS and release-manifest.json
        run: |
          bash scripts/ci/release-manifest.sh \
            "$GITHUB_WORKSPACE/assets" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$GITHUB_WORKSPACE/upload"
        working-directory: vcache-packaging

      - name: create the internal draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cohort=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cohort"])' \
            "$GITHUB_WORKSPACE/upload/release-manifest.json")
          tag="draft-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Draft: $tag" \
            --notes "Internal draft assembled by release-draft.yml, run $GITHUB_RUN_ID, \
          cohort $cohort, cachetag ref ${{ inputs.cachetag_ref }}. \
          NOT a public pre-release. A human/orchestrator publishes the real \
          pre-release from a validated draft, per the step-10 gate decision." \
            "$GITHUB_WORKSPACE"/upload/*
