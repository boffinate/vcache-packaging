name: VCACHE API experiment

on:
  workflow_dispatch:
    inputs:
      vinyl_commit:
        description: Exact Vinyl Cache commit containing the VCACHE API implementation.
        required: true
        default: "3298560e699377ee88412bcfce2ecbeee1e9b4d8"
  push:
    branches:
      - experiment/vcache-api-upstream

permissions:
  contents: read
  actions: write

env:
  VINYL_EXPERIMENT_COMMIT: ${{ inputs.vinyl_commit || '3298560e699377ee88412bcfce2ecbeee1e9b4d8' }}

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine_batches: ${{ steps.expand.outputs.engine_batches }}
      source_batches: ${{ steps.expand.outputs.source_batches }}
      vmod_batches: ${{ steps.expand.outputs.vmod_batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: expand
        run: python3 tools/vcache_experiment.py --vinyl-commit "$VINYL_EXPERIMENT_COMMIT" >> "$GITHUB_OUTPUT"

  vmod_source:
    needs: expand
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.source_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/source_batch.py
        env:
          SOURCE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/sources/
          if-no-files-found: ignore
          retention-days: 1

  engine:
    needs: expand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.engine_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: engine-cache-key
        run: python3 tools/engine_cache.py key --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            work/artifacts
            work/results
          key: ${{ steps.engine-cache-key.outputs.key }}
      - id: restored-engine-cacheable
        run: python3 tools/engine_cache.py cacheable --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-batch
        if: steps.restored-engine-cacheable.outputs.cacheable != 'true'
        continue-on-error: true
        run: python3 tools/engine_batch.py
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-cacheable
        if: always()
        run: python3 tools/engine_cache.py cacheable --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always() && steps.engine-cacheable.outputs.cacheable == 'true' && steps.engine-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            work/artifacts
            work/results
          key: ${{ steps.engine-cache-key.outputs.key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/artifacts/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.batch }}
          path: work/results/
      - if: steps.engine-batch.outcome == 'failure'
        run: exit 1

  vmod:
    needs: [expand, engine, vmod_source]
    if: ${{ !cancelled() }}
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_batches) }}
    uses: ./.github/workflows/vmod-batch.yml
    with:
      batch: ${{ matrix.batch }}
      engine: ${{ matrix.engine }}
      target: ${{ matrix.target }}
      mode: ${{ matrix.mode }}
      runner: ${{ matrix.runner }}
      source_pattern: ${{ matrix.source_pattern }}
      items: ${{ matrix.items }}

  record:
    needs: [engine, vmod]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vcache-api-experiment-state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: state
          fetch-depth: 1
      - name: switch the scratch tree to the experiment state branch
        working-directory: state
        run: ../repo/scripts/matrix-state.sh checkout
        env:
          VCACHE_STATE_BRANCH: ci-state/vcache-api-experiment
      - run: python3 repo/tools/matrix.py merge --results-dir results --state-file state/matrix-state.json
      - name: commit and push experiment state
        working-directory: state
        run: ../repo/scripts/matrix-state.sh publish "$GITHUB_RUN_ID"
        env:
          VCACHE_STATE_BRANCH: ci-state/vcache-api-experiment

  publish:
    needs: record
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: matrix-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vcache-api-experiment/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-state/matrix
          path: state
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-state/vcache-api-experiment
          path: experiment-state
          fetch-depth: 1
      - run: scripts/render-pages.sh state/matrix-state.json experiment-state/matrix-state.json site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
