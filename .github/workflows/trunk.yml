name: trunk

on:
  workflow_dispatch:
  schedule:
    # Runs after the stable matrix and normally completes before 06:00 UTC.
    - cron: "30 5 1-31/2 * *" # odd-numbered days, 05:30 UTC; unconditional (no change-gating)

permissions:
  contents: read

jobs:
  expand:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      engines: ${{ steps.expand.outputs.engines }}
      vmod_sources: ${{ steps.expand.outputs.vmod_sources }}
      vmod_shards: ${{ steps.expand.outputs.vmod_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: expand
        run: python3 tools/matrix.py expand --lane trunk --mode compat --format github >> "$GITHUB_OUTPUT"

  vmod_source:
    needs: expand
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_sources) }}
    name: source ${{ matrix.row }} for ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/fetch-vmod-source.sh "${{ matrix.row }}" "${{ matrix.engine }}" work/vmod-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.source_artifact }}
          path: work/vmod-source/
          if-no-files-found: error
          retention-days: 1

  engine:
    needs: expand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.engines) }}
    name: engine ${{ matrix.engine }} on ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exits non-zero only on infra_failed; a classified build failure is a
      # red cell in the result JSON, not a red job.
      - run: scripts/build-engine.sh "${{ matrix.engine }}" "${{ matrix.target }}" work
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/artifacts/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/results/

  vmod:
    needs: [expand, engine, vmod_source]
    if: ${{ !cancelled() }}
    strategy:
      # Run one shard at a time; the called workflow controls the individual
      # VMOD job concurrency and every one of its matrices stays below 256.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_shards) }}
    uses: ./.github/workflows/vmod-shard.yml
    with:
      items: ${{ matrix.items }}

  publish:
    needs: [expand, engine, vmod]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # Shared with matrix.yml: both push ci-state/matrix and deploy the same
    # Pages site, so their publishes must never race.
    concurrency:
      group: matrix-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # A second checkout in its own directory so switching to the orphan
      # state branch never touches the tree matrix.py runs from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: state
          fetch-depth: 1
      - name: switch the scratch tree to the state branch
        working-directory: state
        run: ../repo/scripts/matrix-state.sh checkout
      - run: python3 repo/tools/matrix.py merge --results-dir results --state-file state/matrix-state.json
      - name: commit and push the state branch
        working-directory: state
        run: ../repo/scripts/matrix-state.sh publish "$GITHUB_RUN_ID"
      - run: |
          mkdir -p site
          python3 repo/tools/matrix.py render --state-file state/matrix-state.json --out site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
