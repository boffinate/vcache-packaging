name: release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated package-enabled target IDs; empty builds every target.
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine_batches: ${{ steps.expand.outputs.engine_batches }}
      source_batches: ${{ steps.expand.outputs.source_batches }}
      vmod_batches: ${{ steps.expand.outputs.vmod_batches }}
      package_pairs: ${{ steps.expand.outputs.package_pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: expand
        env:
          RELEASE_TARGETS: ${{ inputs.targets }}
          IMMUTABLE_RELEASES_CONFIGURED: ${{ vars.IMMUTABLE_RELEASES_CONFIGURED }}
        run: |
          if [ "$IMMUTABLE_RELEASES_CONFIGURED" != true ]; then
            echo "Enable immutable releases and set IMMUTABLE_RELEASES_CONFIGURED=true before dispatching." >&2
            exit 1
          fi
          args=(--lane release --mode package --format github)
          if [ -n "$RELEASE_TARGETS" ]; then
            args+=(--targets "$RELEASE_TARGETS")
          fi
          python3 tools/matrix.py expand "${args[@]}" >> "$GITHUB_OUTPUT"

  vmod_source:
    needs: expand
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.source_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/source_batch.py
        env:
          SOURCE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/sources/
          if-no-files-found: ignore
          retention-days: 1

  engine:
    needs: expand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.engine_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: engine-cache-key
        name: calculate release engine cache key
        run: python3 tools/engine_cache.py key --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-cache-restore
        name: restore release engine cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/artifacts
            work/results
          key: ${{ steps.engine-cache-key.outputs.key }}
      - id: restored-engine-cacheable
        name: validate restored release engine cache
        run: python3 tools/engine_cache.py cacheable --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-batch
        if: steps.restored-engine-cacheable.outputs.cacheable != 'true'
        continue-on-error: true
        run: python3 tools/engine_batch.py
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - id: engine-cacheable
        if: always()
        run: python3 tools/engine_cache.py cacheable --items "$ENGINE_BATCH_ITEMS" >> "$GITHUB_OUTPUT"
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always() && steps.engine-cacheable.outputs.cacheable == 'true' && steps.engine-cache-restore.outputs.cache-hit != 'true'
        name: save release engine cache
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/artifacts
            work/results
          key: ${{ steps.engine-cache-key.outputs.key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/artifacts/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.batch }}
          path: work/results/
      - if: steps.engine-batch.outcome == 'failure'
        name: report engine batch failure
        run: exit 1

  vmod:
    needs: [expand, engine, vmod_source]
    if: ${{ !cancelled() }}
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_batches) }}
    uses: ./.github/workflows/vmod-batch.yml
    with:
      batch: ${{ matrix.batch }}
      engine: ${{ matrix.engine }}
      target: ${{ matrix.target }}
      mode: ${{ matrix.mode }}
      runner: ${{ matrix.runner }}
      source_pattern: ${{ matrix.source_pattern }}
      items: ${{ matrix.items }}
      upload_packages: true

  cohort:
    needs: [expand, engine, vmod]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.package_pairs) }}
    name: package cohort ${{ matrix.engine }} on ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: engines-${{ matrix.target }}
          path: work/engine-bundle
      - name: select engine packages
        continue-on-error: true
        env:
          ENGINE_ID: ${{ matrix.engine }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          mkdir -p work/cohort-packages
          cp -R "work/engine-bundle/engine-$ENGINE_ID-$TARGET_ID/engine-$ENGINE_ID-$TARGET_ID-pkgs" work/cohort-packages/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: packages-*-${{ matrix.engine }}-${{ matrix.target }}
          merge-multiple: true
          path: work/cohort-packages
      - id: smoke
        continue-on-error: true
        run: scripts/test-package-cohort.sh "${{ matrix.engine }}" "${{ matrix.target }}" work/cohort-packages work
      - if: always()
        env:
          ENGINE: ${{ matrix.engine }}
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p work/results
          python3 - <<'PY'
          import json, os
          result = {
              "schema": "cohort/1",
              "engine": os.environ["ENGINE"],
              "target": os.environ["TARGET"],
              "status": "pass" if os.environ["OUTCOME"] == "success" else "failed",
          }
          with open(f"work/results/cohort--{result['engine']}--{result['target']}.json", "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/results/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/logs/
          if-no-files-found: ignore

  release:
    needs: [expand, engine, vmod, cohort]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release-stable
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # No merge-multiple here: each artifact lands in its own subdirectory of
      # pkgdl/, so packages can be collected per (engine, target) pair below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engines-*
          path: pkgdl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: pkgdl
      - name: gate, stage, and publish the green pairs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGETS: ${{ inputs.targets }}
          IMMUTABLE_RELEASES_CONFIGURED: ${{ vars.IMMUTABLE_RELEASES_CONFIGURED }}
        run: |
          set -eu
          python3 tools/release_assemble.py
