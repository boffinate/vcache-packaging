name: release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated package-enabled target IDs; empty builds every target.
        required: false
        type: string

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine_batches: ${{ steps.expand.outputs.engine_batches }}
      source_batches: ${{ steps.expand.outputs.source_batches }}
      vmod_batches: ${{ steps.expand.outputs.vmod_batches }}
      package_pairs: ${{ steps.expand.outputs.package_pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: expand
        env:
          RELEASE_TARGETS: ${{ inputs.targets }}
        run: |
          args=(--lane release --mode package --format github)
          if [ -n "$RELEASE_TARGETS" ]; then
            args+=(--targets "$RELEASE_TARGETS")
          fi
          python3 tools/matrix.py expand "${args[@]}" >> "$GITHUB_OUTPUT"

  vmod_source:
    needs: expand
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.source_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/source_batch.py
        env:
          SOURCE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/sources/
          if-no-files-found: ignore
          retention-days: 1

  engine:
    needs: expand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.engine_batches) }}
    name: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/engine_batch.py
        env:
          ENGINE_BATCH_ITEMS: ${{ matrix.items }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: work/artifacts/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.batch }}
          path: work/results/

  vmod:
    needs: [expand, engine, vmod_source]
    if: ${{ !cancelled() }}
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_batches) }}
    uses: ./.github/workflows/vmod-batch.yml
    with:
      batch: ${{ matrix.batch }}
      engine: ${{ matrix.engine }}
      target: ${{ matrix.target }}
      mode: ${{ matrix.mode }}
      runner: ${{ matrix.runner }}
      source_pattern: ${{ matrix.source_pattern }}
      items: ${{ matrix.items }}
      upload_packages: true

  cohort:
    needs: [expand, engine, vmod]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.package_pairs) }}
    name: package cohort ${{ matrix.engine }} on ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: engines-${{ matrix.target }}
          path: work/engine-bundle
      - name: select engine packages
        continue-on-error: true
        env:
          ENGINE_ID: ${{ matrix.engine }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          mkdir -p work/cohort-packages
          cp -R "work/engine-bundle/engine-$ENGINE_ID-$TARGET_ID/engine-$ENGINE_ID-$TARGET_ID-pkgs" work/cohort-packages/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: packages-*-${{ matrix.engine }}-${{ matrix.target }}
          merge-multiple: true
          path: work/cohort-packages
      - id: smoke
        continue-on-error: true
        run: scripts/test-package-cohort.sh "${{ matrix.engine }}" "${{ matrix.target }}" work/cohort-packages work
      - if: always()
        env:
          ENGINE: ${{ matrix.engine }}
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p work/results
          python3 - <<'PY'
          import json, os
          result = {
              "schema": "cohort/1",
              "engine": os.environ["ENGINE"],
              "target": os.environ["TARGET"],
              "status": "pass" if os.environ["OUTCOME"] == "success" else "failed",
          }
          with open(f"work/results/cohort--{result['engine']}--{result['target']}.json", "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/results/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/logs/
          if-no-files-found: ignore

  release:
    needs: [expand, engine, vmod, cohort]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release-stable
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # No merge-multiple here: each artifact lands in its own subdirectory of
      # pkgdl/, so packages can be collected per (engine, target) pair below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engines-*
          path: pkgdl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: pkgdl
      # Decision 13: releases are all-or-nothing per (engine, target) pair, at
      # the stable tag <engine-id>-<target>. Every expected cell — the engine's
      # own build plus every package-eligible VMOD — must be `pass` or the pair
      # publishes nothing and the job goes red. All green-pair payloads are
      # staged and validated before any stable tag or release is mutated.
      - name: gate, stage, and publish the green pairs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGETS: ${{ inputs.targets }}
        run: |
          set -eu
          python3 - <<'EOF'
          import glob, json, os, shutil, subprocess, sys

          sys.path.insert(0, "tools")

          import matrix
          import release_gate

          catalog = matrix.load_catalog(".")
          # The same expansion the build jobs ran: every expected cell of the
          # release lane in package mode, engine rows (mode "engine") included.
          targets = matrix.release_package_target_filter(catalog, os.environ.get("RELEASE_TARGETS", ""))
          expansion = matrix.expand(catalog, "release", "package", targets)
          if not expansion["engines"] or not expansion["vmods"]:
              sys.exit("release package matrix is empty")
          expected = expansion["rows"]

          results = {}
          cohort_results = {}
          for path in glob.glob("results/**/*.json", recursive=True):
              with open(path) as f:
                  cell = json.load(f)
              if cell.get("schema") == "cohort/1":
                  cohort_results[(cell["engine"], cell["target"])] = cell["status"]
                  continue
              results[(cell["row"], cell["engine"], cell["target"], cell["mode"])] = cell["status"]

          pairs = {}
          for cell in expected:
              pairs.setdefault((cell["engine"], cell["target"]), []).append(cell)

          sha = os.environ["GITHUB_SHA"]
          gate_failed = False
          prepared = []
          for (engine, target), cells in sorted(pairs.items()):
              tag = f"{engine}-{target}"
              cohort_status = cohort_results.get((engine, target), "missing result")
              if cohort_status != "pass":
                  gate_failed = True
                  print(f"gate FAILED for {tag} — package cohort: {cohort_status}")
                  continue
              bad = [(c, results.get((c["row"], engine, target, c["mode"]), "missing result"))
                     for c in cells]
              bad = [(c, status) for c, status in bad if status != "pass"]
              if bad:
                  gate_failed = True
                  print(f"gate FAILED for {tag} — publishing nothing for this pair:")
                  for c, status in bad:
                      print(f"  {c['row']} ({c['mode']}): {status}")
                  continue
              engine_doc = matrix.find_engine(catalog, engine)
              target_doc = matrix.find_target(catalog, target)
              dist = os.path.join("dist", tag)
              if os.path.isdir(dist):
                  shutil.rmtree(dist)
              try:
                  release_gate.validate_pair_payload(
                      "pkgdl", engine_doc, target_doc, cells, stage_dir=dist
                  )
              except release_gate.PayloadError as exc:
                  gate_failed = True
                  print(f"gate FAILED for {tag}: {exc}")
                  continue
              names = sorted(os.listdir(dist))
              sums = subprocess.run(["sha256sum", "--"] + names, cwd=dist,
                                    check=True, stdout=subprocess.PIPE, text=True).stdout
              with open(os.path.join(dist, "SHA256SUMS"), "w") as f:
                  f.write(sums)
              body = f"body-{tag}.md"
              with open(body, "w") as f:
                  f.write("This release contains every packaged module for this target, or it would not have been published.\n\n")
                  f.write(f"Packages built from the pinned release catalog for `{target}`, against engine `{engine}`. Every package below passed its build-and-install-and-load check.\n\n")
                  f.write("## Packages\n\n")
                  f.write("".join(f"- `{name}`\n" for name in names))
              prepared.append((tag, dist, body, names))

          for tag, dist, body, names in prepared:
              # Retry the whole delete/create transaction. A failed gh create
              # can leave a draft, so lib.sh deletes it before the next try.
              subprocess.run(["scripts/retry.sh", "release", tag, sha, body]
                             + [os.path.join(dist, n) for n in sorted(os.listdir(dist))],
                             check=True)
              print(f"published {tag}: {len(names)} packages")

          if gate_failed:
              print("release validation failed for one or more pairs; green pairs were published")
              sys.exit(1)
          EOF
