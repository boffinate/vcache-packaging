name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engines: ${{ steps.expand.outputs.engines }}
      vmod_shards: ${{ steps.expand.outputs.vmod_shards }}
      package_pairs: ${{ steps.expand.outputs.package_pairs }}
    steps:
      - uses: actions/checkout@v7
      - id: expand
        run: python3 tools/matrix.py expand --lane release --mode package --format github >> "$GITHUB_OUTPUT"

  engine:
    needs: expand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.engines) }}
    name: engine ${{ matrix.engine }} on ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      # Exits non-zero only on infra_failed; a classified build failure is a
      # red cell in the result JSON, not a red job.
      - run: scripts/build-engine.sh "${{ matrix.engine }}" "${{ matrix.target }}" work
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/artifacts/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/results/

  vmod:
    needs: [expand, engine]
    if: ${{ !cancelled() }}
    strategy:
      # Run one shard at a time; the called workflow controls the individual
      # VMOD job concurrency and every one of its matrices stays below 256.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.vmod_shards) }}
    uses: ./.github/workflows/vmod-shard.yml
    with:
      items: ${{ matrix.items }}
      upload_packages: true

  cohort:
    needs: [expand, engine, vmod]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.package_pairs) }}
    name: package cohort ${{ matrix.engine }} on ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/cohort-packages
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: packages-*-${{ matrix.engine }}-${{ matrix.target }}
          merge-multiple: true
          path: work/cohort-packages
      - id: smoke
        continue-on-error: true
        run: scripts/test-package-cohort.sh "${{ matrix.engine }}" "${{ matrix.target }}" work/cohort-packages work
      - if: always()
        env:
          ENGINE: ${{ matrix.engine }}
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p work/results
          python3 - <<'PY'
          import json, os
          result = {
              "schema": "cohort/1",
              "engine": os.environ["ENGINE"],
              "target": os.environ["TARGET"],
              "status": "pass" if os.environ["OUTCOME"] == "success" else "failed",
          }
          with open(f"work/results/cohort--{result['engine']}--{result['target']}.json", "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/results/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cohort-${{ matrix.engine }}-${{ matrix.target }}
          path: work/logs/
          if-no-files-found: ignore

  release:
    needs: [expand, engine, vmod, cohort]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release-stable
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # No merge-multiple here: each artifact lands in its own subdirectory of
      # pkgdl/, so packages can be collected per (engine, target) pair below.
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: pkgdl
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: pkgdl
      # Decision 13: releases are all-or-nothing per (engine, target) pair, at
      # the stable tag <engine-id>-<target>. Every expected cell — the engine's
      # own build plus every package-eligible VMOD — must be `pass` or the pair
      # publishes nothing and the job goes red. All green-pair payloads are
      # staged and validated before any stable tag or release is mutated.
      - name: gate, stage, and publish the green pairs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 - <<'EOF'
          import glob, json, os, shutil, subprocess, sys

          sys.path.insert(0, "tools")

          import matrix
          import release_gate

          catalog = matrix.load_catalog(".")
          # The same expansion the build jobs ran: every expected cell of the
          # release lane in package mode, engine rows (mode "engine") included.
          expansion = matrix.expand(catalog, "release", "package")
          if not expansion["engines"] or not expansion["vmods"]:
              sys.exit("release package matrix is empty")
          expected = expansion["rows"]

          results = {}
          cohort_results = {}
          for path in glob.glob("results/**/*.json", recursive=True):
              with open(path) as f:
                  cell = json.load(f)
              if cell.get("schema") == "cohort/1":
                  cohort_results[(cell["engine"], cell["target"])] = cell["status"]
                  continue
              results[(cell["row"], cell["engine"], cell["target"], cell["mode"])] = cell["status"]

          pairs = {}
          for cell in expected:
              pairs.setdefault((cell["engine"], cell["target"]), []).append(cell)

          sha = os.environ["GITHUB_SHA"]
          gate_failed = False
          prepared = []
          for (engine, target), cells in sorted(pairs.items()):
              tag = f"{engine}-{target}"
              cohort_status = cohort_results.get((engine, target), "missing result")
              if cohort_status != "pass":
                  gate_failed = True
                  print(f"gate FAILED for {tag} — package cohort: {cohort_status}")
                  continue
              bad = [(c, results.get((c["row"], engine, target, c["mode"]), "missing result"))
                     for c in cells]
              bad = [(c, status) for c, status in bad if status != "pass"]
              if bad:
                  gate_failed = True
                  print(f"gate FAILED for {tag} — publishing nothing for this pair:")
                  for c, status in bad:
                      print(f"  {c['row']} ({c['mode']}): {status}")
                  continue
              engine_doc = matrix.find_engine(catalog, engine)
              target_doc = matrix.find_target(catalog, target)
              dist = os.path.join("dist", tag)
              if os.path.isdir(dist):
                  shutil.rmtree(dist)
              try:
                  release_gate.validate_pair_payload(
                      "pkgdl", engine_doc, target_doc, cells, stage_dir=dist
                  )
              except release_gate.PayloadError as exc:
                  gate_failed = True
                  print(f"gate FAILED for {tag}: {exc}")
                  continue
              names = sorted(os.listdir(dist))
              sums = subprocess.run(["sha256sum", "--"] + names, cwd=dist,
                                    check=True, stdout=subprocess.PIPE, text=True).stdout
              with open(os.path.join(dist, "SHA256SUMS"), "w") as f:
                  f.write(sums)
              body = f"body-{tag}.md"
              with open(body, "w") as f:
                  f.write("This release contains every packaged module for this target, or it would not have been published.\n\n")
                  f.write(f"Packages built from the pinned release catalog for `{target}`, against engine `{engine}`. Every package below passed its build-and-install-and-load check.\n\n")
                  f.write("## Packages\n\n")
                  f.write("".join(f"- `{name}`\n" for name in names))
              prepared.append((tag, dist, body, names))

          for tag, dist, body, names in prepared:
              # Stable, replaceable tag: delete-and-recreate so a re-dispatch
              # after a fix replaces the release. The delete may fail because
              # the release does not exist yet; that is fine.
              subprocess.run(["gh", "release", "delete", tag, "--cleanup-tag", "--yes"])
              subprocess.run(["gh", "release", "create", tag]
                             + [os.path.join(dist, n) for n in sorted(os.listdir(dist))]
                             + ["--target", sha, "--title", tag, "--notes-file", body],
                             check=True)
              print(f"published {tag}: {len(names)} packages")

          if gate_failed:
              print("release validation failed for one or more pairs; green pairs were published")
              sys.exit(1)
          EOF
