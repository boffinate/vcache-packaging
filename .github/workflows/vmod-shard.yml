name: vmod shard

on:
  workflow_call:
    inputs:
      items:
        description: JSON array of VMOD matrix rows, limited to 128 entries.
        required: true
        type: string
      upload_packages:
        description: Upload package artifacts for package-mode cells.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  vmod:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # The caller serializes shards. Keep enough parallelism inside a shard
      # for useful throughput without flooding the Actions artifact service.
      max-parallel: 20
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.items) }}
    name: ${{ matrix.row }} vs ${{ matrix.engine }} (${{ matrix.mode }}, ${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # An early engine infra failure can produce no artifact. Continue so
        # build-vmod.sh emits the required infra_failed cell for this VMOD.
        continue-on-error: true
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.target }}
          path: work/engine/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # Keep running when acquisition failed so the cell records a specific
        # infra_failed result instead of disappearing from the report.
        continue-on-error: true
        with:
          name: ${{ matrix.source_artifact }}
          path: work/vmod-source
      - run: scripts/build-vmod.sh "${{ matrix.row }}" "${{ matrix.engine }}" "${{ matrix.target }}" "${{ matrix.mode }}" work
        env:
          VCACHE_REQUIRE_PREFETCHED_VMOD_SOURCE: "1"
      - if: ${{ always() && inputs.upload_packages && matrix.mode == 'package' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.row }}-${{ matrix.engine }}-${{ matrix.target }}
          path: work/packages/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.row }}-${{ matrix.engine }}-${{ matrix.target }}-${{ matrix.mode }}
          path: work/results/
