name: trunk early warning

# The scheduled workflow, and the ONLY scheduled workflow that runs any VMOD
# work. Policy source: docs/20260730_0826_note_step-8-maintainer-decisions.md.
#
# It follows Vinyl trunk HEAD, unpinned, so that a Vinyl core change that breaks
# a VMOD's source surfaces within days rather than at the next re-pin. The
# strict VMOD ABI token is the Vinyl commit id itself, so this is breakage that
# exists before any cohort is minted. It builds nothing installable and
# publishes nothing.
#
# Three things it deliberately does NOT do:
#
#   * it does not run the upgrade-transaction matrix. That is the `transactions`
#     tier, dispatched deliberately against one release cohort's published
#     packages; a trunk snapshot is not a published upgrade path (decision b).
#   * it does not rebuild release-channel rows. Once release artifacts are
#     built they are untouched until there is a new release (decision c).
#   * it does not run the PINNED-trunk package rows. Those live in ci.yml and
#     are event-driven: they move only when someone re-pins, so scheduling them
#     would re-prove on Thursday exactly what the pull request proved on Monday.
#
# The cost control is the gate, not the cadence. Every few days rather than
# nightly (decision a), and change-gated on both sides: nothing runs when Vinyl
# trunk HEAD has not moved and no watched VMOD branch has moved, which is most
# runs and costs about one job-minute. When a VMOD's own upstream moved but
# Vinyl trunk did not, that VMOD still runs -- that half of decision (a) is why
# the gate is per-VMOD rather than a single boolean about the engine.
#
# The engine is built ONCE per run, by trunk-engine below, and every VMOD's
# harness row unpacks the same prefix. That sharing is the economics of the
# lane: at the roadmap's ~40-VMOD ambition, a per-VMOD harness that built Vinyl
# for itself would be forty Vinyl builds to answer one question about Vinyl.
#
# Not here, deliberately: CROSS-RUN reuse of that prefix. In-run sharing is what
# pays for itself; carrying a prefix between runs is a pure optimisation of the
# rarer "a VMOD moved but Vinyl trunk did not" case, and it is worth evaluating
# from real run costs rather than from a guess. The state file reserves a field
# for the run id that produced a reusable artifact and leaves it unfilled.

on:
  schedule:
    # Monday and Thursday, 03:17 UTC. Twice a week is "every few days"; the
    # minute is off the hour because the hour is when everyone else's cron runs.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          run every row regardless of what moved. The gate still reads and
          reports every observed sha, so a forced run advances the state exactly
          as a gated one does -- it skips the decision, not the observation.
        required: false
        type: boolean
        default: false

# Read-only by default. Three jobs below elevate, each to the minimum it
# needs: advance-state and record-observations write the state file to its own
# orphan branch (contents: write), and notify opens maintainer-facing issues
# (issues: write).
permissions:
  contents: read

env:
  # The orphan branch the last-seen state lives on. Orphan because this is CI
  # bookkeeping with no business in the history of the packaging tree: it shares
  # no commit with main and nothing merges it.
  STATE_BRANCH: ci-state/trunk-watch
  STATE_FILE: trunk-watch-state.json

jobs:
  gate:
    name: has anything moved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      vinyl_changed: ${{ steps.watch.outputs.vinyl_changed }}
      vinyl_head_sha: ${{ steps.watch.outputs.vinyl_head_sha }}
      changed_vmods: ${{ steps.watch.outputs.changed_vmods }}
      moved_pins: ${{ steps.watch.outputs.moved_pins }}
      # Whether the watcher found anything a maintainer must be told about:
      # a re-pin candidate, a moved pin, a poisoned tag, or fleet candidates.
      # Written before the step's exit status is applied, so a red gate still
      # reports it and the notify job still runs.
      notify: ${{ steps.watch.outputs.notify }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Fetching one ref that may not exist yet. `continue-on-error` rather than
      # a conditional, because "the branch is not there" and "the fetch failed"
      # are the same thing to this job: both mean there is no last-seen state,
      # and the watcher's fail-open rule then treats everything as changed. A
      # freshness gate that skips work because it could not find out whether the
      # work was needed fails silently, which is the failure that matters.
      - name: fetch the last-seen state
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          git fetch --depth 1 origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
          git show "origin/$STATE_BRANCH:$STATE_FILE" > "$RUNNER_TEMP/$STATE_FILE"
          echo "--- last-seen state ---"
          cat "$RUNNER_TEMP/$STATE_FILE"

      - name: read every watched upstream
        id: watch
        shell: bash
        run: |
          set -eu
          set -o pipefail
          state="$RUNNER_TEMP/$STATE_FILE"
          [ -f "$state" ] || echo "no state file was fetched; every ref counts as changed"
          # --format github prints the gate outputs as key=value and its
          # annotations as ::notice/::warning/::error. Only the former belong in
          # $GITHUB_OUTPUT; the latter have to reach the log to be rendered, so
          # the stream is split rather than teed wholesale.
          # --issues writes the notification issues (bodies generated and
          # selftested inside the tool) from the SAME observation the gate
          # outputs come from; running the watcher twice could disagree.
          python3 tools/upstream_watch.py check \
            --state "$state" \
            --write-state "$RUNNER_TEMP/next-$STATE_FILE" \
            --issues "$RUNNER_TEMP/upstream-issues.json" \
            --format github > "$RUNNER_TEMP/gate.txt" || watch_status=$?
          # `|| true` because grep exits 1 on no match, and a watcher that died
          # before printing anything would otherwise abort here under `set -e` --
          # losing the real exit status two lines below, which is the one that
          # says what went wrong.
          grep -v '^::' "$RUNNER_TEMP/gate.txt" >> "$GITHUB_OUTPUT" || true
          cat "$RUNNER_TEMP/gate.txt"
          # A moved pin is a hard failure of the watcher and must stop the run:
          # the recorded identity and what upstream publishes under that name
          # have diverged, and nothing should be built from it until somebody
          # has established which moved.
          exit "${watch_status:-0}"

      - name: upload the observed state
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trunk-watch-observed-state
          path: ${{ runner.temp }}/next-${{ env.STATE_FILE }}
          if-no-files-found: warn
          retention-days: 30

      # The notify job runs in a separate job because it needs `issues: write`
      # and this job deliberately stays read-only.
      - name: upload the notification issues
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: upstream-watch-issues
          path: ${{ runner.temp }}/upstream-issues.json
          if-no-files-found: warn
          retention-days: 30

      - name: decide
        id: decide
        shell: bash
        run: |
          set -eu
          run='${{ steps.watch.outputs.run }}'
          if [ '${{ inputs.force }}' = 'true' ]; then
            run=true
            echo "forced by dispatch; the observation still stands and is still recorded"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo "## Trunk early-warning gate"
            echo
            echo "| signal | value |"
            echo "| --- | --- |"
            echo "| vinyl trunk changed | ${{ steps.watch.outputs.vinyl_changed }} |"
            echo "| vinyl trunk HEAD | \`${{ steps.watch.outputs.vinyl_head_sha }}\` |"
            echo "| changed VMODs | ${{ steps.watch.outputs.changed_vmods }} |"
            echo "| forced | ${{ inputs.force }} |"
            echo "| **run** | **$run** |"
            echo
            if [ "$run" != true ]; then
              echo "Nothing moved since the last run. No VMOD work was started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The piece that makes the manual publication gate work: a re-pin candidate,
  # a moved pin, a poisoned tag, or fleet candidates must reach the maintainer
  # as a durable GitHub issue, not sit in a green run's log. (A moved pin also
  # fails the gate red, which emails; the issue is the durable, resumable
  # record.) Policy: docs/20260730_1635_note_publication-authority-decision.md.
  #
  # Dedupe, by exact issue title under the upstream-watch label:
  #   * pinned rows get one issue per distinct upstream+tag. An existing OPEN
  #     issue means already reported: skip. An existing CLOSED issue means the
  #     maintainer has seen and handled it: skip, never reopen.
  #   * fleet candidates collapse into ONE rolling digest issue. While it is
  #     open, each run with new candidates comments on it; if it was closed, a
  #     later run with new candidates opens a fresh one. The watcher state
  #     records every announced tag, so a tag is announced at most once and a
  #     repeat run with nothing new produces no digest at all.
  notify:
    name: notify the maintainer
    needs: gate
    # `!cancelled()`: a moved pin fails the gate job, and that is precisely a
    # run whose findings must not be lost.
    if: ${{ !cancelled() && needs.gate.outputs.notify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: download the notification issues
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: upstream-watch-issues
          path: issues

      - name: ensure the label exists
        shell: bash
        run: |
          set -eu
          # Idempotent: creating an existing label fails, and that failure is
          # fine. Anything else surfaces on the next step's listing call.
          gh label create upstream-watch \
            --repo "$GITHUB_REPOSITORY" \
            --description "opened by tools/upstream_watch.py via trunk-early-warning" \
            --color D93F0B 2>/dev/null || true

      - name: open, comment, or skip
        shell: bash
        run: |
          set -eu
          set -o pipefail
          # One listing call, then exact-title matching locally: cheaper and
          # more precise than a search query per issue.
          gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --label upstream-watch --limit 500 \
            --json number,title,state > "$RUNNER_TEMP/existing.json"
          python3 - "$GITHUB_WORKSPACE/issues/upstream-issues.json" \
                    "$RUNNER_TEMP/existing.json" <<'PY'
          import json, pathlib, subprocess, sys, tempfile

          issues = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          existing = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          by_title = {}
          for row in existing:
              by_title.setdefault(row["title"], []).append(row)

          def gh(*args, body):
              with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as fh:
                  fh.write(body)
                  path = fh.name
              subprocess.run(
                  ["gh", *args, "--body-file", path], check=True
              )

          import os
          repo = os.environ["GITHUB_REPOSITORY"]
          for issue in issues:
              title = issue["title"]
              found = by_title.get(title, [])
              open_ones = [r for r in found if r["state"].lower() == "open"]
              if issue["kind"] == "fleet_digest":
                  # The rolling digest: comment while open, recreate if the
                  # last one was closed. The state file guarantees the body
                  # only ever carries tags not announced before.
                  if open_ones:
                      print(f"comment: {title} (#{open_ones[0]['number']})")
                      gh("issue", "comment", str(open_ones[0]["number"]),
                         "--repo", repo, body=issue["body"])
                  else:
                      print(f"create: {title}")
                      gh("issue", "create", "--repo", repo, "--title", title,
                         "--label", ",".join(issue["labels"]), body=issue["body"])
                  continue
              if found:
                  # Open = already reported; closed = seen and handled. Either
                  # way this exact upstream+tag never spawns a second issue.
                  print(f"skip ({found[0]['state'].lower()}): {title}")
                  continue
              print(f"create: {title}")
              gh("issue", "create", "--repo", repo, "--title", title,
                 "--label", ",".join(issue["labels"]), body=issue["body"])
          PY

  structural-validation:
    name: structural validation and tooling selftests
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: scripts/ci/test-common.sh
        run: scripts/ci/test-common.sh

      - name: tools/release_tool.py selftest
        run: python3 tools/release_tool.py selftest

      - name: tools/ci_matrix.py selftest
        run: python3 tools/ci_matrix.py selftest

      - name: registry schemas, identities and wiring (no VMOD source needed)
        run: python3 tools/release_tool.py --no-cachetag-cross-check validate

      - name: VMOD catalog structure
        run: python3 tools/ci_matrix.py check-catalog

  discover-vmods:
    name: discover selected VMODs
    needs: [gate, structural-validation]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # EVERY discovered VMOD, not only the changed ones, and that is not a
      # missed optimisation. The trunk ledger has a selected invocation row for
      # each of the three, so the collector expects a result record from each;
      # dropping a VMOD from the matrix would make its invocation row
      # missing_result_record and turn every gated run red. What the gate saves
      # is the expensive half -- a VMOD with no trunk lane expands to zero
      # harness rows and its invocation job is a manifest parse.
      - name: list the selected VMOD manifests
        id: discover
        shell: bash
        run: |
          set -eu
          set -o pipefail
          python3 tools/ci_matrix.py list-vmods --format github | tee -a "$GITHUB_OUTPUT"

  trunk-engine:
    name: build Vinyl trunk HEAD once
    needs: [gate, structural-validation]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.clone.outputs.commit }}
    env:
      # The install prefix, and the harness rows' `VINYL_PREFIX` must equal it.
      # libtool bakes it into the .la files, pkg-config into vinylapi.pc and
      # vmod_abi.h into the ABI string, so this tarball works at exactly one
      # path. The harness verifies the value out of the identity file rather
      # than assuming the two agree.
      VINYL_PREFIX: /opt/vinyl-trunk
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # Unpinned by design, and the only build in this repository that is. The
      # URL is the one tools/upstream_watch.py reads, so the sha the gate
      # observed and the sha this clones come from the same remote.
      - name: clone Vinyl Cache trunk HEAD
        id: clone
        shell: bash
        run: |
          set -eu
          git clone --recurse-submodules \
            https://code.vinyl-cache.org/vinyl-cache/vinyl-cache.git \
            "$GITHUB_WORKSPACE/vinyl-cache"
          commit=$(git -C "$GITHUB_WORKSPACE/vinyl-cache" rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # A difference from the gate's observation is ordinary -- trunk moved
          # between reading the ref and cloning it -- and is not a failure. What
          # matters is that everything downstream uses THIS sha, which it does:
          # the identity file carries it and the harness rows verify against it.
          expected='${{ needs.gate.outputs.vinyl_head_sha }}'
          if [ -n "$expected" ] && [ "$expected" != "$commit" ]; then
            echo "trunk moved after the gate observed $expected; building $commit"
          fi
          {
            echo "## Vinyl Cache trunk HEAD"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`$commit\` |"
            echo "| gate observed | \`$expected\` |"
            echo "| committed | $(git -C "$GITHUB_WORKSPACE/vinyl-cache" show -s --format=%cI HEAD) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ONE build, shared by every harness row in the run. That sharing is the
      # economics of the whole lane: at the roadmap's ~40-VMOD ambition,
      # building the engine per VMOD would be forty Vinyl builds to answer one
      # question about Vinyl.
      - name: build the trunk engine into a prefix
        shell: bash
        run: |
          set -eu
          . recipes/debian-13/pins.env
          mkdir -p "$GITHUB_WORKSPACE/engine-out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/vcache-packaging:/repo:ro" \
            -v "$GITHUB_WORKSPACE/vinyl-cache:/src" \
            -v "$GITHUB_WORKSPACE/engine-out:/out" \
            -e "VINYL_PREFIX=$VINYL_PREFIX" \
            -e "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "$IMAGE" \
            bash /repo/scripts/ci/trunk/build-engine.sh
        working-directory: vcache-packaging

      # A build intermediate, not a durability promise -- SCOPE.md is explicit
      # that a CI-derived archive passed between jobs is exactly that. Thirty
      # days so a failing row can still be reproduced against the engine it
      # actually saw, and no longer.
      - name: upload the trunk engine prefix
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: engine-vinyl-trunk-head-prefix
          path: |
            engine-out/vinyl-trunk-prefix.tar.gz
            engine-out/trunk-engine-identity.env
          if-no-files-found: error
          retention-days: 30

      - name: upload the engine build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trunk-engine-logs
          path: engine-out/logs/**
          if-no-files-found: warn
          retention-days: 30

  vmods:
    name: VMOD
    needs: [gate, structural-validation, discover-vmods, trunk-engine]
    # NOT ordinary `needs` semantics on trunk-engine: a failed engine build must
    # not skip the VMOD invocations, so every harness row starts and reports
    # `blocked_by_engine_artifact` from its own missing download. That is the
    # same rule ci.yml applies to its engine matrix, and it is what makes a
    # broken engine one legible finding rather than a run that silently did
    # nothing.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.discover-vmods.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover-vmods.outputs.matrix) }}
    uses: ./.github/workflows/vmod-package.yml
    with:
      manifest: ${{ matrix.manifest }}
      vmod_id: ${{ matrix.id }}
      tier: trunk
      # The gate's observation, passed through so the harness row can say
      # whether trunk moved underneath it. The row still tests, and records,
      # whatever it actually resolved.
      vinyl_trunk_sha: ${{ needs.gate.outputs.vinyl_head_sha }}

  collect:
    name: reconcile every expected row
    needs: [gate, structural-validation, discover-vmods, trunk-engine, vmods]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Whether every expected row produced evidence, however that evidence
      # reads. The state-advance job below gates on this rather than on the
      # reconciliation passing, and re-parsing the JSON there would be a second
      # reader that could disagree with this one.
      complete: ${{ steps.reconcile.outputs.complete }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download every result record
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results

      - name: note the upstream job outcomes
        shell: bash
        run: |
          set -eu
          {
            echo "## Upstream job outcomes"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| gate | ${{ needs.gate.result }} |"
            echo "| structural-validation | ${{ needs.structural-validation.result }} |"
            echo "| discover-vmods | ${{ needs.discover-vmods.result }} |"
            echo "| trunk-engine | ${{ needs.trunk-engine.result }} |"
            echo "| vmods (aggregate) | ${{ needs.vmods.result }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # `complete` is written before the reconciliation's own exit status is
      # allowed to fail the job, because a red trunk row is a LEARNED FACT and
      # the state must still advance on it. What must never advance the state is
      # incomplete evidence: a row that produced nothing tells us nothing about
      # the sha, and recording it as seen would mean never testing that sha.
      - name: reconcile the expected ledger against the observed results
        id: reconcile
        shell: bash
        run: |
          set -eu
          status=0
          python3 tools/ci_matrix.py reconcile \
            --tier trunk \
            --results "$GITHUB_WORKSPACE/results" \
            --json "$GITHUB_WORKSPACE/reconciled.json" \
            --summary "$GITHUB_STEP_SUMMARY" || status=$?
          missing=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["counts"]["missing"])' \
            "$GITHUB_WORKSPACE/reconciled.json")
          echo "missing rows: $missing"
          if [ "$missing" = 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: upload the reconciled ledger
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trunk-reconciled-ledger
          path: reconciled.json
          if-no-files-found: warn
          retention-days: 30

  advance-state:
    name: record what was tested
    needs: [gate, collect]
    # `!cancelled()` and NOT `success()`: the state advances on a red run too.
    #
    # A harness row that failed against a Vinyl trunk commit is a learned fact
    # about that commit, and re-testing a known-red sha every cadence re-pays
    # the full cost -- forty-five minutes of building Vinyl -- to learn the same
    # thing again. The next real movement is what should trigger the next run.
    #
    # What blocks the advance is INCOMPLETE evidence: if any expected row
    # produced no result record at all, we do not know what happened at that
    # sha, and recording it as seen would mean never finding out.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.collect.outputs.complete == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one elevation in this workflow, confined to the one job that needs it
    # and used only to write one file to one orphan branch.
    permissions:
      contents: write
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download the gate's observation
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: trunk-watch-observed-state
          path: observed

      - name: download every result record
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results

      # The gate observed a Vinyl sha; the harness rows TESTED one, and between
      # the two the branch may have moved. What goes into the state is what was
      # tested, or the next run would treat an untested commit as covered.
      - name: build the state from what was tested
        shell: bash
        run: |
          set -eu
          python3 - "$GITHUB_WORKSPACE/observed/next-$STATE_FILE" \
                    "$GITHUB_WORKSPACE/results" \
                    "$GITHUB_WORKSPACE/$STATE_FILE" <<'PY'
          import json, pathlib, sys

          observed, results, out = (pathlib.Path(p) for p in sys.argv[1:4])
          state = json.loads(observed.read_text(encoding="utf-8"))

          # Every harness record in the run. Each clones Vinyl trunk itself, so
          # in the ordinary case they all resolve the same commit and that is the
          # tested sha. If two disagree, trunk moved mid-run and no single commit
          # was covered by every row -- so the engine entry is left alone and the
          # next run tests a coherent one. Advancing to either would claim
          # coverage the run does not have.
          tested = []
          for path in sorted(results.rglob("*.json")):
              try:
                  record = json.loads(path.read_text(encoding="utf-8"))
              except ValueError:
                  continue
              if record.get("kind") != "source-harness":
                  continue
              commit = (record.get("source") or {}).get("engine_commit")
              if commit:
                  tested.append((record["row_key"], commit))

          print("harness rows and the Vinyl commit each tested:")
          for row_key, commit in tested:
              print(f"  {row_key}  {commit}")

          shas = {commit for _, commit in tested}
          if len(shas) > 1:
              print("W: harness rows tested different Vinyl commits; trunk moved mid-run.")
              print("W: not advancing the engine entry, so the next run re-tests coherently.")
          elif shas:
              entry = state["refs"].setdefault("vinyl-trunk", {})
              if entry.get("sha") != next(iter(shas)):
                  print(f"engine entry: {entry.get('sha')} -> {next(iter(shas))} (tested, not observed)")
              entry["sha"] = next(iter(shas))
          else:
              print("W: no harness row recorded a tested engine commit; leaving the observation.")

          out.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print()
          print(out.read_text(encoding="utf-8"))
          PY

      - name: commit it to the state branch
        shell: bash
        run: |
          set -eu
          # The workspace checkout, not a fresh clone: actions/checkout has
          # already persisted this job's credentials here, and this job is the
          # one with `contents: write`. A second clone would need the token in a
          # URL, which is a secret in a command line for no benefit.
          cp "$GITHUB_WORKSPACE/$STATE_FILE" "$RUNNER_TEMP/state-to-commit.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git checkout -B "$STATE_BRANCH" FETCH_HEAD
          else
            # First run. An ORPHAN branch: it shares no commit with main,
            # because nothing here is packaging history and a machine-written
            # state file in `git log` of the tree would be noise forever.
            git checkout --orphan "$STATE_BRANCH"
          fi
          # Whatever the previous branch left in the index, tracked-file-wise.
          # On the orphan path that is the whole packaging tree, which does not
          # belong on this branch; on the update path it is the two files below,
          # and re-adding them is idempotent.
          git rm -rf --quiet . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/state-to-commit.json" "$STATE_FILE"
          cat > README.md <<'EOF'
          # trunk-watch state

          Machine-written CI bookkeeping for `.github/workflows/trunk-early-warning.yml`.
          Not packaging history, which is why this is an orphan branch: it shares no
          commit with `main` and nothing merges it.

          `trunk-watch-state.json` is `upstream-watch-state/v1`. `refs` is the last-seen
          commit of every watched ref, where "last seen" means **tested**, not merely
          observed. `tags` is observation memory: first-seen commits and poison flags for
          the pinned rows' stable-family tags, and the announced tag set per fleet
          upstream; it advances on every run, tested or not, because a tag observation is
          a fact about the remote, not a claim about testing. The `trunk_engine_run_id`
          field is reserved for the run that produced a reusable trunk engine artifact,
          and is unfilled until the sibling repository's harness can accept a prebuilt
          prefix.

          Do not edit by hand. Deleting the branch is safe but is a deliberate act: the
          watcher fails open and the next run tests everything, fleet upstreams reseed
          silently, and the poisoned-tag memory is forgotten -- which is the one
          documented way, short of a re-pin, to clear a poison marker.
          EOF
          git add -A "$STATE_FILE" README.md
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "trunk-watch: state after run ${GITHUB_RUN_ID}

          Reconciliation was complete, so every expected row produced evidence and
          the shas recorded here describe commits that were actually tested."
          git push origin "HEAD:$STATE_BRANCH"
          echo "state branch $STATE_BRANCH updated"

  # Tag observations must persist even on runs that test nothing: fleet
  # seeding, the announced-tag record behind the digest's once-only rule, and
  # the poisoned-tag memory are all facts about what the watcher OBSERVED, and
  # most runs end at the gate with run=false, where advance-state never
  # executes. Without this job those facts would evaporate every quiet run --
  # fleet upstreams would reseed forever and a poison marker would never
  # survive a tag returning to its original value.
  #
  # It advances ONLY the `tags` map. The `refs` map keeps its tested-not-
  # observed meaning and is written exclusively by advance-state; committing
  # observed refs from here would mark untested trunk commits as covered.
  # The two jobs cannot race: this one runs precisely when advance-state was
  # skipped (gate red, run=false, or incomplete evidence).
  record-observations:
    name: record tag observations
    needs: [gate, collect, advance-state]
    if: ${{ !cancelled() && needs.advance-state.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download the gate's observation
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: trunk-watch-observed-state
          path: observed

      - name: merge the tags map into the state branch
        shell: bash
        run: |
          set -eu
          obs="$GITHUB_WORKSPACE/observed/next-$STATE_FILE"
          if [ ! -f "$obs" ]; then
            echo "no observed state was produced this run; nothing to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git checkout -B "$STATE_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$STATE_BRANCH"
          fi
          git rm -rf --quiet . >/dev/null 2>&1 || true
          git checkout "$STATE_BRANCH" -- . 2>/dev/null || true
          python3 - "$obs" "$STATE_FILE" <<'PY'
          import json, pathlib, sys

          observed, out = (pathlib.Path(p) for p in sys.argv[1:3])
          tags = json.loads(observed.read_text(encoding="utf-8")).get("tags", {})
          if out.is_file():
              state = json.loads(out.read_text(encoding="utf-8"))
          else:
              # First-ever write: refs stays EMPTY, not the observation --
              # an empty refs map fails open exactly like a missing state
              # file, so the next run still tests everything.
              state = {
                  "schema": "upstream-watch-state/v1",
                  "refs": {},
                  "tags": {},
                  "trunk_engine_run_id": "",
              }
          state["tags"] = tags
          out.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"tags map: {sum(len(v) for v in tags.values())} records across {len(tags)} keys")
          PY
          git add "$STATE_FILE"
          if git diff --cached --quiet; then
            echo "tag observations unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "trunk-watch: tag observations after run ${GITHUB_RUN_ID}

          Only the tags map advances here: a tag observation is a fact about the
          remote. The refs map keeps its tested-not-observed meaning and is written
          only by the advance-state job."
          git push origin "HEAD:$STATE_BRANCH"
          echo "tag observations recorded on $STATE_BRANCH"
