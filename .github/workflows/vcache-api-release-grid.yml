name: VCACHE API release grid

# Dispatch only: the release engines predate VCACHE_REQUIRE, so a push-triggered
# run would spend sixty jobs proving nothing.
on:
  workflow_dispatch:
    inputs:
      vinyl_commit:
        description: Exact Vinyl Cache commit containing the VCACHE API implementation.
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  grid:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/vcache-api-experiment.yml
    with:
      lane: release
      vinyl_commit: ${{ inputs.vinyl_commit }}
