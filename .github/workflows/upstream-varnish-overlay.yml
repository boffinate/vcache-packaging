name: experimental upstream Varnish overlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.catalog.outputs.engine }}
      runner: ${{ steps.catalog.outputs.runner }}
      target: ${{ steps.catalog.outputs.target }}
    steps:
      - uses: actions/checkout@v7
      - id: catalog
        run: |
          engine=$(python3 tools/matrix.py select-engine --family varnish --kind release)
          target=debian-13-amd64
          python3 tools/matrix.py env --engine "$engine" --target "$target" > /tmp/upstream-overlay.env
          . /tmp/upstream-overlay.env
          echo "engine=$ENGINE_ID" >> "$GITHUB_OUTPUT"
          echo "runner=$TARGET_RUNNER" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_ID" >> "$GITHUB_OUTPUT"

  overlay:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: scripts/probe-upstream-varnish-overlay.sh "${{ needs.select.outputs.engine }}" "${{ needs.select.outputs.target }}" work
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-upstream-varnish-overlay-${{ needs.select.outputs.target }}
          path: |
            work/packages/upstream-varnish-overlay/
            work/logs/
          if-no-files-found: error
