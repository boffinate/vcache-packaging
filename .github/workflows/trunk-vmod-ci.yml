name: trunk VMOD CI

# Draft, unreviewed and unexecuted (see
# docs/20260726_1235_note_two-track-release-and-trunk.md). This is the trunk
# track's early-warning lane, complementing (not duplicating) the pinned
# trunk lanes in ci.yml: those prove the packaging machinery -- source
# assembly, buildroot, dpkg/rpm build, lint, smoke -- against a fixed trunk
# snapshot, and only move when someone re-pins VINYL_GIT_COMMIT. This
# workflow instead follows Vinyl trunk HEAD, unpinned, so that a VMOD-
# breaking Vinyl core change surfaces within a week rather than at the next
# re-pin.
#
# Vinyl trunk moves every day, and the strict VMOD ABI token moves with
# every commit (it is the commit id itself). This catches source-level VMOD
# breakage against tomorrow's Vinyl before a cohort is ever minted. It
# builds nothing installable and publishes nothing -- no package, no
# artifact, no release. It is deliberately unpinned (trunk HEAD by design),
# unlike every other workflow in this repository, all of which build from a
# digest- or commit-pinned input.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  trunk-vmod-build:
    name: build libvmod-cachetag against Vinyl trunk HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout libvmod-cachetag (default branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          path: libvmod-cachetag

      - name: clone Vinyl Cache trunk HEAD (unpinned, by design)
        run: |
          set -eu
          git clone --recurse-submodules \
            https://code.vinyl-cache.org/vinyl-cache/vinyl-cache.git \
            "$GITHUB_WORKSPACE/vinyl-cache"
          {
            echo "## Vinyl Cache trunk HEAD"
            echo
            echo "commit: $(git -C "$GITHUB_WORKSPACE/vinyl-cache" rev-parse HEAD)"
            echo "date  : $(git -C "$GITHUB_WORKSPACE/vinyl-cache" show -s --format=%cI HEAD)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: build docker/vinyl-cache-ubuntu-build.Dockerfile
        run: |
          docker build -t vinyl-cache-ubuntu-build \
            -f docker/vinyl-cache-ubuntu-build.Dockerfile docker
        working-directory: libvmod-cachetag

      - name: scripts/test-with-vinyl-cache.sh (documented harness)
        run: bash scripts/test-with-vinyl-cache.sh "$GITHUB_WORKSPACE/vinyl-cache"
        working-directory: libvmod-cachetag
