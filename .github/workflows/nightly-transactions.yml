name: Nightly package builds and upgrade-transaction matrices

# Draft, unreviewed and unexecuted (see ../DESIGN.md). This is the plan's
# "Run on merge to the main branch and nightly" tier: representative package
# builds, fresh-environment install/import/behavior/uninstall coverage
# (already inside build.sh's smoke stage), and the mismatch-fixture +
# upgrade-transaction matrices. See DESIGN.md open question #7 for cost
# before enabling the schedule trigger for real.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VINYL_GIT_COMMIT: 25761f8505817ac50df994270bfe75b60073e33e
  VINYL_VTEST2_COMMIT: db5ccb4a078da40b3ec1ca3c18bf498bb1520888
  CACHETAG_SOURCE_SHA256: 9aba3effcb20cfc70b77a4729990e3cd2ae1712ad242f4e4c45a664e1949eac2
  CACHETAG_REF: v1.0.1
  CACHETAG_GIT_COMMIT: a3897aaccf1d6996c00ee14b2c6e1ddac91ac982
  EL9_IMAGE: almalinux:9

jobs:
  # Reuses the same source-archive job as ci.yml. Duplicated here rather than
  # factored into a reusable workflow so this file stays readable on its own;
  # revisit with `workflow_call` once both workflows have run for real and the
  # duplication is confirmed to be a maintenance cost rather than a reading aid.
  cachetag-source-archive:
    name: build and pin the cachetag source archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag
          fetch-depth: 0
      - name: verify the cachetag release tag
        run: |
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_verify_cachetag_release_checkout \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$CACHETAG_REF" "$CACHETAG_GIT_COMMIT"
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - name: build docker/vinyl-cache-ubuntu-build.Dockerfile
        run: |
          docker build -t vinyl-cache-ubuntu-build \
            -f docker/vinyl-cache-ubuntu-build.Dockerfile docker
        working-directory: libvmod-cachetag
      - name: scripts/release-source-archive.sh
        run: |
          bash "$GITHUB_WORKSPACE/vcache-packaging/scripts/ci/source-archive.sh" \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" \
            "$CACHETAG_SOURCE_SHA256" \
            "$CACHETAG_GIT_COMMIT" \
            release
        working-directory: libvmod-cachetag
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nightly-cachetag-source-archive
          path: libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  debian-13-full:
    name: Debian 13 amd64 -- build, mismatch fixture, transaction matrix
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag
      - name: verify the cachetag release tag
        run: |
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_verify_cachetag_release_checkout \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$CACHETAG_REF" "$CACHETAG_GIT_COMMIT"
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nightly-cachetag-source-archive
          path: libvmod-cachetag/release/dist

      - name: assemble source (unchanged)
        run: recipes/debian-13/build.sh source
        working-directory: vcache-packaging
      - name: sbuild chroot
        run: bash scripts/ci/debian13/make-chroot.sh
        working-directory: vcache-packaging
      - name: build both packages (pinned container)
        run: bash scripts/ci/debian13/debian-lane.sh
        working-directory: vcache-packaging
      - name: ABI/hardening assertions
        run: bash scripts/ci/debian13/assert-packages.sh
        working-directory: vcache-packaging
      - name: lint + smoke (unchanged)
        run: recipes/debian-13/build.sh lint smoke sums
        working-directory: vcache-packaging

      # These two are entirely unchanged from the recipe: both already run in
      # pinned/throwaway Docker containers and do not care how the baseline
      # .debs were produced.
      - name: mismatch-fixture.sh (unchanged)
        run: recipes/debian-13/mismatch-fixture.sh
        working-directory: vcache-packaging
      - name: transactions.sh (unchanged)
        run: recipes/debian-13/transactions.sh
        working-directory: vcache-packaging

      - name: upload debian-13 nightly evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: debian-13-nightly
          path: |
            vcache-packaging/dist/debian-13/SHA256SUMS
            vcache-packaging/dist/debian-13/mismatch/**
            vcache-packaging/dist/debian-13/logs/transactions/**
          if-no-files-found: warn
          retention-days: 30

  el9-full:
    name: EL9 x86_64 -- build, mismatch fixture, transaction matrix
    needs: cachetag-source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boffinate/libvmod-cachetag
          ref: ${{ env.CACHETAG_REF }}
          path: libvmod-cachetag
      - name: verify the cachetag release tag
        run: |
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_verify_cachetag_release_checkout \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$CACHETAG_REF" "$CACHETAG_GIT_COMMIT"
      - name: checkout ../vinyl-cache (pinned commit)
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nightly-cachetag-source-archive
          path: libvmod-cachetag/release/dist

      - name: Mock build
        run: |
          bash scripts/ci/el9/mock-build.sh \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$EL9_IMAGE"
        working-directory: vcache-packaging
      - name: report + lint + smoke (unchanged)
        run: |
          docker run --rm \
            -v "$PWD/recipes/el9:/recipes:ro" \
            -v "$PWD/dist/el9:/out" \
            -w /out \
            "$EL9_IMAGE" \
            bash /recipes/container/build.sh deps report lint
          recipes/el9/build.sh --smoke-only
        working-directory: vcache-packaging

      # Unchanged: both already run entirely in throwaway containers.
      - name: mismatch-fixture.sh (unchanged)
        run: recipes/el9/mismatch-fixture.sh
        working-directory: vcache-packaging
      - name: transactions.sh (unchanged)
        run: recipes/el9/transactions.sh
        working-directory: vcache-packaging

      - name: upload el9 nightly evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: el9-nightly
          path: |
            vcache-packaging/dist/el9/SHA256SUMS
            vcache-packaging/dist/el9/mismatch/**
          if-no-files-found: warn
          retention-days: 30
