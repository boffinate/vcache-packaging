name: VMOD package

# One complete, self-contained invocation for ONE VMOD: its manifest, its
# source, and its package targets. Phases 1 and 2 of
# docs/20260728_0833_plan_vmod-matrix-failure-isolation.md.
#
# The containment is the point. The caller's VMOD matrix runs this whole
# workflow per entry with fail-fast: false, so a source failure here cannot
# skip another VMOD's package jobs -- which is exactly what one shared
# cachetag-source-archive job did before. For the same reason this file uses
# ordinary jobs and never calls a further reusable workflow: the caller has
# already consumed the one nesting level a matrix invocation gets. That
# constraint is also why the shared engine packages arrive as an artifact
# downloaded by stable name rather than as another reusable-workflow call: the
# caller's engine matrix and this workflow's jobs are part of the same workflow
# run, so `actions/download-artifact` by name is the mechanism available here.
#
# Phase 1 moved the build commands and pins here UNCHANGED from ci.yml. Phase 2
# removed the engine half of each package row: the row now downloads
# `engine-<engine-id>-<target-id>`, verifies the resolved identity recorded
# inside it against its own pin file, installs those native packages, and builds
# only the VMOD. Any other diff in what these steps run is a bug in the
# migration, not an improvement.

on:
  workflow_call:
    inputs:
      manifest:
        description: path to the VMOD manifest, relative to the repository root
        required: true
        type: string
      vmod_id:
        description: >-
          the trusted discovery id, derived by the caller from the manifest file
          name. The manifest's own declared id is checked against it here.
        required: true
        type: string
      tier:
        description: >-
          workflow tier: `ci`, `release`, `transactions` or `trunk`, and it is
          the whole of what selects this VMOD's rows -- a lane lists the tiers
          it runs in and `expand` filters on that alone.

          `transactions` adds the mismatch fixture and the upgrade-transaction
          matrix to each package row and changes nothing else. It is a
          DELIBERATE measurement against one release cohort's packages and is
          never scheduled: the matrix answers a question about a published
          upgrade path, and a rebuilt or trunk-snapshot candidate is not one.
          Renamed from `nightly` on 2026-07-30 for exactly that reason. Its
          dispatching workflow arrives in Wave 3d; nothing calls this workflow
          with it yet.

          `trunk` expands to source-harness rows run by this workflow's own
          harness job (landed in Wave 3c); the change-gated early-warning
          workflow is its dispatcher.
        required: true
        type: string
      inject:
        description: >-
          deliberate failure injection for the plan's verification cases. Always
          `none` unless a human dispatched the caller with something else. The
          two engine cases (`engine_build`, `suppress_engine_artifact`) act
          entirely in the caller's engine matrix; this workflow sees them only
          as an engine artifact that is not there, which is exactly what it
          would see from a real engine failure.
        required: false
        type: string
        default: none
      vinyl_trunk_sha:
        description: >-
          the Vinyl trunk commit the CALLER observed, for the `trunk` tier's
          harness job. Empty means "resolve HEAD yourself", which is what a
          standalone dispatch does. When it is set and the clone resolves to
          something else, trunk moved between the gate reading it and the job
          cloning it: the job proceeds with what it resolved and says so in the
          record, because the row must report the commit it TESTED. The state
          the scheduled workflow advances is read back out of that record for
          the same reason.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # The pinned trunk snapshot, still needed by the SOURCE job: deriving the
  # cachetag release archive builds the VMOD against a Vinyl prefix, so that job
  # checks Vinyl out. No package row reads these any more -- since Phase 2 a
  # package row consumes built engine packages -- and the engine rows in ci.yml
  # carry their own copy. The cachetag source pins that used to sit beside them
  # are gone from here on purpose: they live in the VMOD manifest.
  VINYL_GIT_COMMIT: 25761f8505817ac50df994270bfe75b60073e33e
  VINYL_VTEST2_COMMIT: db5ccb4a078da40b3ec1ca3c18bf498bb1520888
  # Index digest resolved 2026-07-25 (`docker buildx imagetools inspect
  # almalinux:9`); must match EL9_IMAGE in recipes/el9/cohort.env, which is
  # authoritative (build.sh re-sources cohort.env, clobbering any env
  # override, so the pin lives there and is mirrored here for steps that
  # run containers directly).
  EL9_IMAGE: almalinux:9@sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743

jobs:
  plan:
    name: ${{ inputs.vmod_id }} manifest and lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.expand.outputs.sources }}
      targets: ${{ steps.expand.outputs.targets }}
      source_count: ${{ steps.expand.outputs.source_count }}
      target_count: ${{ steps.expand.outputs.target_count }}
      # The trunk tier's source-harness rows. `expand --format github` has
      # printed both since Phase 1; the matrix itself became a consumer in Wave
      # 3c, when the harness job below landed and the count stopped being
      # exposed only so that a tier expanding to nothing was visible.
      harnesses: ${{ steps.expand.outputs.harnesses }}
      harness_count: ${{ steps.expand.outputs.harness_count }}
      repository: ${{ steps.expand.outputs.repository }}
      # Which native recipe this VMOD is packaged from, and how CI reaches its
      # source. `expand --format github` has printed all four since the second
      # VMOD landed; this block only forwards them, so adding them changes
      # nothing about what the job runs.
      recipe: ${{ steps.expand.outputs.recipe }}
      source_host: ${{ steps.expand.outputs.source_host }}
      clone_url: ${{ steps.expand.outputs.clone_url }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # Injection case 2 from the plan's verification list: a malformed
      # manifest must be classified failed_manifest_validation without
      # preventing any other VMOD invocation, and without lane rows being
      # invented for a manifest that did not parse. No build script is touched.
      #
      # Every job that rebuilds the expected ledger from a fresh checkout has
      # to see the same corruption, or it would rebuild the full lane list and
      # report the very invented rows the case exists to forbid. That means
      # this step, the identical one in the summary job below, and the one in
      # ci.yml's collector.
      - name: inject a malformed manifest
        if: inputs.inject == 'manifest'
        shell: bash
        run: |
          set -eu
          # Which VMOD the injection acts on comes from the tool, never from a
          # comparison written here. Four jobs rebuild the expected ledger from
          # their own fresh checkout -- this one, this VMOD's summary, and
          # ci.yml's discover-engines and collect -- and if they disagreed
          # about which file to corrupt they would build different ledgers and
          # the run would report rows nobody asked for.
          victim=$(python3 tools/ci_matrix.py injection-scope --inject manifest)
          [ -n "$victim" ] || { echo "E: the manifest injection names no VMOD" >&2; exit 1; }
          [ "$victim" = "${{ inputs.vmod_id }}" ] || {
            echo "manifest injection targets $victim; leaving ${{ inputs.vmod_id }} intact"
            exit 0
          }
          printf 'schema: vmod-ci/v1\nid: %s\n' "${{ inputs.vmod_id }}" \
            > "${{ inputs.manifest }}"
          cat "${{ inputs.manifest }}"
        working-directory: vcache-packaging

      - name: validate this VMOD's manifest
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          python3 tools/ci_matrix.py validate-vmod \
            --manifest "${{ inputs.manifest }}" \
            --id "${{ inputs.vmod_id }}" \
            --tier "${{ inputs.tier }}"
        working-directory: vcache-packaging

      - name: expand this VMOD's lanes for the tier
        id: expand
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          set -o pipefail
          python3 tools/ci_matrix.py expand \
            --manifest "${{ inputs.manifest }}" \
            --id "${{ inputs.vmod_id }}" \
            --tier "${{ inputs.tier }}" \
            --inject "${{ inputs.inject }}" \
            --format github | tee -a "$GITHUB_OUTPUT"
        working-directory: vcache-packaging

      - name: record the invocation result
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            status=failed_manifest_validation
            detail="${{ inputs.manifest }} did not validate as vmod-ci/v1"
          elif [ "${{ steps.expand.outcome }}" != "success" ]; then
            status=failed_manifest_validation
            detail="lane expansion for tier ${{ inputs.tier }} failed"
          fi
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/invocation.json" \
            --kind invocation \
            --vmod "${{ inputs.vmod_id }}" \
            --status "$status" \
            --stage manifest \
            --detail "$detail"
        working-directory: vcache-packaging

      - name: upload the invocation result record
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: result-${{ inputs.vmod_id }}-invocation
          path: results/invocation.json
          if-no-files-found: error
          retention-days: 14

      # The classified record is written and uploaded first, then the job fails
      # explicitly. A step-local continue-on-error that reaches result
      # generation must never leave a required failure looking green.
      - name: fail when the manifest did not validate
        if: steps.validate.outcome == 'failure' || steps.expand.outcome != 'success'
        run: exit 1

  # ---- The upstream-owned recipe strategy: cachetag. ----
  #
  # Two jobs, gated on `recipe == 'upstream'`, and otherwise untouched: their
  # commands, pins and step order are exactly what they were before the second
  # VMOD existed. The strategy is selected from the manifest, never discovered.
  #
  # Per-strategy JOBS rather than per-step gating inside one job, deliberately.
  # Gating steps would leave every skipped step with outcome `skipped`, and the
  # classification chains below check for `failure` and for `!= 'success'` --
  # so a generated-recipe row running through the upstream job would classify
  # itself failed_infrastructure and its final `fail when` expression would
  # fire unconditionally. The cost is the engine download/verify/install block
  # appearing in both target jobs; that is the same bounded duplication the
  # separate lane scripts already accept, for the same reason.
  source:
    name: ${{ inputs.vmod_id }} source (${{ matrix.channel }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.source_count != '0' && needs.plan.outputs.recipe == 'upstream' }}
    runs-on: ubuntu-latest
    # Measured 2026-07-25 across six green runs: 6m09s-8m02s, the spread
    # being runner-to-runner variance on identical input. 20 minutes is a
    # "something has hung" guard, not a target.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout the VMOD source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ matrix.ref }}
          path: libvmod-cachetag
          fetch-depth: 0 # release-source-archive.sh reads git commit/committer-date metadata

      - name: verify the release tag and expected commit
        id: verify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_verify_cachetag_release_checkout \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "${{ matrix.ref }}" "${{ matrix.expected_commit }}"

      # The source-coupled half of registry validation, which used to sit in
      # the global registry gate and made a cachetag repository problem look
      # like a registry failure. It needs a checkout, so it belongs here: the
      # manifest's recorded version against the source's own configure.ac, and
      # the registry's cachetag.version against the same checkout.
      - name: cross-check the manifest and registry against the checked-out source
        id: cross_check
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          python3 tools/ci_matrix.py validate-vmod \
            --manifest "${{ inputs.manifest }}" \
            --id "${{ inputs.vmod_id }}" \
            --tier "${{ inputs.tier }}" \
            --source-channel "${{ matrix.channel }}" \
            --source-dir "$GITHUB_WORKSPACE/libvmod-cachetag"
          python3 tools/release_tool.py \
            --cachetag-src "$GITHUB_WORKSPACE/libvmod-cachetag" \
            validate
        working-directory: vcache-packaging

      - name: checkout ../vinyl-cache (pinned commit, not a GitHub remote)
        id: vinyl
        if: steps.cross_check.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_checkout_vinyl_cache "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" "$VINYL_VTEST2_COMMIT"

      - name: build docker/vinyl-cache-ubuntu-build.Dockerfile
        id: image
        if: steps.vinyl.outcome == 'success'
        continue-on-error: true
        run: |
          docker build -t vinyl-cache-ubuntu-build \
            -f docker/vinyl-cache-ubuntu-build.Dockerfile docker
        working-directory: libvmod-cachetag

      - name: scripts/release-source-archive.sh
        id: archive
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          set -o pipefail
          bash "$GITHUB_WORKSPACE/vcache-packaging/scripts/ci/source-archive.sh" \
            "$GITHUB_WORKSPACE/vinyl-cache" \
            "$VINYL_GIT_COMMIT" \
            "${{ matrix.archive_sha256 }}" \
            "${{ matrix.expected_commit }}" \
            release 2>&1 | tee "$GITHUB_WORKSPACE/source-archive.log"
        working-directory: libvmod-cachetag

      # The artifact every target row waits for. A failure here is a real
      # failure of this row -- it leaves the targets with nothing to download
      # -- so it must be classified and must fail the job, not be recorded as
      # a pass on a red job.
      - name: upload the pinned source archive
        id: upload
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.source_artifact }}
          path: |
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz
            libvmod-cachetag/release/dist/libvmod-cachetag-*.tar.gz.sha256
            libvmod-cachetag/release/dist/libvmod-cachetag-*.metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: classify and record the source result
        if: always()
        shell: bash
        run: |
          set -eu
          # First failing stage wins, so a stage skipped because an earlier one
          # failed is never mistaken for the cause. Checking for `failure`
          # rather than "not success" is what makes that true.
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            set_status failed_source_checkout \
              "checkout of ${{ needs.plan.outputs.repository }}@${{ matrix.ref }} failed"
          elif [ "${{ steps.verify.outcome }}" = "failure" ]; then
            set_status failed_source_checkout \
              "${{ matrix.ref }} did not resolve to ${{ matrix.expected_commit }}"
          elif [ "${{ steps.cross_check.outcome }}" = "failure" ]; then
            set_status failed_manifest_validation \
              "the manifest or registry disagrees with the checked-out source"
          elif [ "${{ steps.vinyl.outcome }}" = "failure" ] \
            || [ "${{ steps.image.outcome }}" = "failure" ]; then
            set_status failed_engine_build \
              "the Vinyl input the archive derivation builds against was unavailable"
          elif [ "${{ steps.archive.outcome }}" = "failure" ]; then
            if grep -q "does not match the pinned" "$GITHUB_WORKSPACE/source-archive.log" 2>/dev/null
            then
              set_status failed_source_digest \
                "derived archive digest does not match ${{ matrix.archive_sha256 }}"
            else
              set_status failed_source_archive "source archive derivation failed"
            fi
          elif [ "${{ steps.archive.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the source archive stage did not run"
          elif [ "${{ steps.upload.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the source artifact upload failed"
          fi
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/source-${{ matrix.channel }}.json" \
            --kind source \
            --vmod "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --status "$status" \
            --stage source \
            --detail "$detail" \
            --artifact "${{ matrix.source_artifact }}" \
            --ref "${{ matrix.ref }}" \
            --commit "${{ matrix.expected_commit }}" \
            --version "${{ matrix.version }}" \
            --digest "${{ matrix.archive_sha256 }}"
        working-directory: vcache-packaging

      # Same treatment as the target row's result upload: a lost result record
      # fails its row explicitly rather than leaving the job red for a reason
      # the log does not name. The collector catches the same thing
      # independently, as missing_result_record.
      - name: upload the source result record and logs
        id: upload_result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: |
            results/source-${{ matrix.channel }}.json
            source-archive.log
          if-no-files-found: warn
          retention-days: 14

      - name: fail when the source stage failed
        if: >-
          steps.checkout.outcome == 'failure' || steps.verify.outcome == 'failure'
          || steps.cross_check.outcome == 'failure' || steps.vinyl.outcome == 'failure'
          || steps.image.outcome == 'failure' || steps.archive.outcome != 'success'
          || steps.upload.outcome != 'success' || steps.upload_result.outcome == 'failure'
        run: exit 1

  target:
    name: ${{ inputs.vmod_id }} ${{ matrix.target }} (${{ matrix.engine }})
    needs: [plan, source]
    # Deliberately NOT ordinary `needs` semantics: this job must start after a
    # failed source job and decide from its own requested artifact whether it
    # can proceed, so a blocked row is reported as blocked rather than silently
    # skipped. An intentional cancellation still stops it.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.target_count != '0' && needs.plan.outputs.recipe == 'upstream' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      VINYL_TRACK: ${{ matrix.vinyl_track }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: checkout the VMOD source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ matrix.ref }}
          path: libvmod-cachetag

      - name: verify the release tag and expected commit
        id: verify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          . vcache-packaging/scripts/ci/lib/common.sh
          ci_verify_cachetag_release_checkout \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "${{ matrix.ref }}" "${{ matrix.expected_commit }}"

      # No Vinyl checkout in a package row any more. The engine is not built
      # here; it arrives as native packages built once by ci.yml's engine
      # matrix, which is the whole of Phase 2.
      #
      # Allowed to fail so the row can reach its result record: an artifact that
      # does not exist is a blocked row with a named cause, not an unclassified
      # download error. The two prerequisites are fetched independently rather
      # than in a chain, so a missing engine artifact cannot hide a broken VMOD
      # source and the classification below can put them in a fixed order.
      - name: download the pinned VMOD source archive
        id: download
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ matrix.source_artifact }}
          path: libvmod-cachetag/release/dist

      - name: download the shared engine artifact
        id: engine_download
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ matrix.engine_artifact }}
          path: engine-artifact

      # The plan's rule that a consumer verifies a dependency artifact's
      # resolved-identity metadata against its own row before use. This row has
      # no second, independent way to know what it downloaded -- unlike the VMOD
      # source archive, whose identity it re-establishes by checking the tag out
      # again above -- so this check is load-bearing, not advisory. It compares
      # the engine and target the artifact was built for, the resolved version,
      # commit, ABI and build-input identity read out of this checkout's own pin
      # file for this row's track, and the digest of every package file
      # delivered.
      - name: verify the engine artifact against this row
        id: engine_verify
        if: steps.engine_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          scripts/ci/engine-identity.sh "${{ matrix.family }}" \
            > "$GITHUB_WORKSPACE/engine-identity.env"
          cat "$GITHUB_WORKSPACE/engine-identity.env"
          python3 tools/ci_matrix.py verify-engine-metadata \
            --metadata "$GITHUB_WORKSPACE/engine-artifact/engine-metadata.json" \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --identity "$GITHUB_WORKSPACE/engine-identity.env" \
            --packages "$GITHUB_WORKSPACE/engine-artifact/packages"
        working-directory: vcache-packaging

      # Put the verified engine packages where the lane expects the cohort's
      # packages to be. Everything downstream -- the local repository the VMOD
      # build resolves its exact-version engine dependency from, the ABI
      # assertions, lint, the installed-package smoke and VTC suite, and the
      # checksum list -- then runs against exactly the files it ran against
      # before the split, and cannot tell that this row did not build them.
      - name: install the engine packages into the lane
        id: engine_install
        if: steps.engine_verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          case "${{ matrix.family }}" in
          deb) dest=dist/debian-13 ;;
          rpm) dest=dist/el9/packages ;;
          *) echo "unknown family" >&2; exit 1 ;;
          esac
          mkdir -p "$dest"
          cp -p "$GITHUB_WORKSPACE"/engine-artifact/packages/* "$dest/"
          ls -la "$dest"
        working-directory: vcache-packaging

      # ---- Debian 13 amd64 (pbuilder). VMOD scope; commands otherwise
      #      unchanged from the pre-split lane. ----
      - name: assemble the pinned VMOD source tree (build.sh source-vmod)
        id: deb_source
        if: matrix.family == 'deb' && steps.download.outcome == 'success' && steps.engine_install.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/build.sh source-vmod
        working-directory: vcache-packaging

      - name: build the pinned buildroot with mmdebstrap
        id: deb_chroot
        if: matrix.family == 'deb' && steps.deb_source.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci/debian13/make-chroot.sh
        working-directory: vcache-packaging

      - name: injected Debian package-build failure
        id: deb_inject
        if: matrix.family == 'deb' && matrix.inject_build == 'true' && steps.deb_chroot.outcome == 'success'
        continue-on-error: true
        run: exit 1

      - name: build the VMOD package in the pinned debian:trixie container (pbuilder)
        id: deb_build
        if: matrix.family == 'deb' && steps.deb_chroot.outcome == 'success' && steps.deb_inject.outcome != 'failure'
        continue-on-error: true
        run: bash scripts/ci/debian13/debian-lane.sh vmod
        working-directory: vcache-packaging

      - name: ABI and hardening assertions (mirrors stage-vinyl.sh / stage-cachetag.sh)
        id: deb_abi
        if: matrix.family == 'deb' && steps.deb_build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci/debian13/assert-packages.sh
        working-directory: vcache-packaging

      - name: lint (unchanged, build.sh lint)
        id: deb_lint
        if: matrix.family == 'deb' && steps.deb_abi.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/build.sh lint
        working-directory: vcache-packaging

      - name: installed-package smoke, fresh container (unchanged, build.sh smoke)
        id: deb_smoke
        if: matrix.family == 'deb' && steps.deb_lint.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/build.sh smoke
        working-directory: vcache-packaging

      - name: installed-package VTC suite, fresh container (unchanged, build.sh vtc-suite)
        id: deb_vtc
        if: matrix.family == 'deb' && steps.deb_smoke.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/build.sh vtc-suite
        working-directory: vcache-packaging

      - name: checksums (unchanged, build.sh sums)
        id: deb_sums
        if: matrix.family == 'deb' && steps.deb_vtc.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/build.sh sums
        working-directory: vcache-packaging

      # ---- EL9 x86_64 (Mock). Commands unchanged from ci.yml. ----
      - name: injected EL9 package-build failure
        id: el9_inject
        if: matrix.family == 'rpm' && matrix.inject_build == 'true' && steps.engine_install.outcome == 'success'
        continue-on-error: true
        run: exit 1

      - name: Mock build (libvmod-cachetag against the installed engine packages)
        id: el9_build
        if: matrix.family == 'rpm' && steps.download.outcome == 'success' && steps.engine_install.outcome == 'success' && steps.el9_inject.outcome != 'failure'
        continue-on-error: true
        run: |
          bash scripts/ci/el9/mock-build.sh \
            "" \
            "$GITHUB_WORKSPACE/libvmod-cachetag" \
            "$EL9_IMAGE" \
            vmod
        working-directory: vcache-packaging

      # `deps` first because this is a fresh container: stage_lint calls
      # rpmlint directly and stage_deps is what installs it. In the local
      # lane all stages share one container, so deps has always already run
      # by the time lint does; here it has not.
      - name: report + rpmlint (unchanged, container/build.sh stage_deps stage_report stage_lint)
        id: el9_lint
        if: matrix.family == 'rpm' && steps.el9_build.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/recipes/el9:/recipes:ro" \
            -v "$PWD/dist/el9:/out" \
            -w /out \
            "$EL9_IMAGE" \
            bash /recipes/container/build.sh deps report lint
        working-directory: vcache-packaging

      - name: installed-package smoke, fresh container (unchanged, build.sh --smoke-only)
        id: el9_smoke
        if: matrix.family == 'rpm' && steps.el9_lint.outcome == 'success'
        continue-on-error: true
        run: recipes/el9/build.sh --smoke-only
        working-directory: vcache-packaging

      - name: installed-package VTC suite, fresh container (unchanged, build.sh --vtc-suite-only)
        id: el9_vtc
        if: matrix.family == 'rpm' && steps.el9_smoke.outcome == 'success'
        continue-on-error: true
        run: recipes/el9/build.sh --vtc-suite-only
        working-directory: vcache-packaging

      # ---- Upgrade transactions: a tier-gated stage of the row, `transactions`
      #      tier only. Step 8 Wave 1; tier renamed in Wave 3a. ----
      #
      # The pair the legacy nightly-transactions.yml has run since step 9,
      # unchanged, moved inside the package row. It is gated on
      # `inputs.tier == 'transactions'` AND on the previous stage, which is the
      # same idiom every stage above uses, so at tier `ci` both steps are
      # SKIPPED -- and a skipped step's outcome is neither `failure` nor
      # `success`, which is exactly what the classification chain below already
      # knows how to read. That is what makes a `ci` row equivalent to the one
      # Wave 1 replaced: nothing new runs, and nothing existing was reordered.
      # Measured, not assumed: run 30520146411.
      #
      # The tier literal here and ci_matrix.TIERS must never disagree. If they
      # do, every gate is false for a tier nothing can request and the stage is
      # silently inert forever -- a green run that measured nothing. The
      # selftests assert every tier literal in this file is a member of TIERS
      # for that reason, and the rename moved both in one commit.
      #
      # After the checksums rather than before them, because mismatch-fixture.sh
      # verifies the baseline debs against dist/debian-13/SHA256SUMS before it
      # derives a fixture from them, and `build.sh sums` is what writes that file.
      # The EL9 half has no equivalent constraint -- stage_report wrote
      # dist/el9/packages/SHA256SUMS back at the lint step -- but it sits in the same block
      # so the row has one transaction stage rather than two placed differently.
      #
      # No parameters: dist/debian-13 and dist/el9 are the layout these scripts
      # default to, and cachetag's values are the defaults of every VMOD_* input
      # they gained in this wave.
      - name: mismatch fixture (Debian, transactions tier)
        id: deb_fixture
        if: matrix.family == 'deb' && inputs.tier == 'transactions' && steps.deb_sums.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/mismatch-fixture.sh
        working-directory: vcache-packaging

      - name: upgrade-transaction matrix (Debian, transactions tier)
        id: deb_txn
        if: matrix.family == 'deb' && inputs.tier == 'transactions' && steps.deb_fixture.outcome == 'success'
        continue-on-error: true
        run: recipes/debian-13/transactions.sh
        working-directory: vcache-packaging

      - name: mismatch fixture (EL9, transactions tier)
        id: el9_fixture
        if: matrix.family == 'rpm' && inputs.tier == 'transactions' && steps.el9_vtc.outcome == 'success'
        continue-on-error: true
        run: recipes/el9/mismatch-fixture.sh
        working-directory: vcache-packaging

      - name: upgrade-transaction matrix (EL9, transactions tier)
        id: el9_txn
        if: matrix.family == 'rpm' && inputs.tier == 'transactions' && steps.el9_fixture.outcome == 'success'
        continue-on-error: true
        run: recipes/el9/transactions.sh
        working-directory: vcache-packaging

      # ---- Package evidence, then the result, then the explicit failure. ----
      #
      # The package uploads come before the classification so that a failed
      # upload can be classified too: a record written before its own evidence
      # upload can only ever say `passed` on a job that then goes red. They are
      # continue-on-error so a failure here still reaches the record step.
      #
      # if-no-files-found: warn, not error. A compiler failure must stay
      # "compiler failed" rather than becoming an unrelated "no files found"
      # from the evidence upload; the row's classified result record is the
      # guaranteed evidence.
      - name: upload the Debian package artifacts
        id: deb_upload
        if: always() && matrix.family == 'deb'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.packages_artifact }}
          path: |
            vcache-packaging/dist/debian-13/*.deb
            vcache-packaging/dist/debian-13/*.ddeb
            vcache-packaging/dist/debian-13/*.dsc
            vcache-packaging/dist/debian-13/*.changes
            vcache-packaging/dist/debian-13/*.buildinfo
            vcache-packaging/dist/debian-13/*.tar.*
            vcache-packaging/dist/debian-13/SHA256SUMS
            vcache-packaging/dist/debian-13/logs/**
            vcache-packaging/dist/debian-13/work/target.txt
            vcache-packaging/dist/debian-13/mismatch/PROVENANCE
            vcache-packaging/dist/debian-13/mismatch/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: upload the EL9 package artifacts
        id: el9_upload
        if: always() && matrix.family == 'rpm'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.packages_artifact }}
          path: |
            vcache-packaging/dist/el9/packages/*.rpm
            vcache-packaging/dist/el9/packages/SHA256SUMS
            vcache-packaging/dist/el9/logs/**
            vcache-packaging/dist/el9/image.txt
            vcache-packaging/dist/el9/mismatch/SHA256SUMS
            vcache-packaging/dist/el9/mismatch/txn-image.txt
            vcache-packaging/dist/el9/mismatch/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: classify and record the target result
        id: record
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          if [ "${{ steps.checkout.outcome }}" = "failure" ] \
            || [ "${{ steps.verify.outcome }}" = "failure" ]; then
            set_status failed_source_checkout \
              "${{ matrix.ref }} did not check out at ${{ matrix.expected_commit }}"
          elif [ "${{ steps.download.outcome }}" != "success" ]; then
            set_status blocked_by_vmod_source \
              "source artifact ${{ matrix.source_artifact }} was not available"
          # The row's own VMOD source failure wins where both apply, matching
          # the collector's precedence: that cause is specific to this row,
          # while a broken engine is reported in full on its own engine row.
          elif [ "${{ steps.engine_download.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "${{ matrix.engine_row_key }} published no ${{ matrix.engine_artifact }}"
          elif [ "${{ steps.engine_verify.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "${{ matrix.engine_artifact }} does not describe ${{ matrix.engine_row_key }}"
          elif [ "${{ steps.engine_install.outcome }}" != "success" ]; then
            set_status failed_infrastructure \
              "the verified engine packages could not be placed in the lane"
          elif [ "${{ steps.deb_source.outcome }}" = "failure" ]; then
            set_status failed_package_build "build.sh source-vmod failed"
          elif [ "${{ steps.deb_chroot.outcome }}" = "failure" ]; then
            set_status failed_infrastructure "the mmdebstrap buildroot could not be built"
          elif [ "${{ steps.deb_inject.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_inject.outcome }}" = "failure" ]; then
            set_status failed_package_build "injected package-build failure"
          elif [ "${{ steps.deb_build.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_build.outcome }}" = "failure" ]; then
            set_status failed_package_build "the native package build failed"
          elif [ "${{ steps.deb_abi.outcome }}" = "failure" ]; then
            set_status failed_abi_or_hardening "assert-packages.sh failed"
          elif [ "${{ steps.deb_lint.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_lint.outcome }}" = "failure" ]; then
            set_status failed_lint "package lint failed"
          elif [ "${{ steps.deb_smoke.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_smoke.outcome }}" = "failure" ]; then
            set_status failed_install_or_smoke "the installed-package smoke failed"
          elif [ "${{ steps.deb_vtc.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_vtc.outcome }}" = "failure" ]; then
            set_status failed_behavior "the installed-package VTC suite failed"
          elif [ "${{ matrix.family }}" = "deb" ] \
            && [ "${{ steps.deb_sums.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the Debian row did not reach its checksums"
          elif [ "${{ matrix.family }}" = "rpm" ] \
            && [ "${{ steps.el9_vtc.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the EL9 row did not reach its VTC suite"
          # The transaction stage. Both arms are inert at every other
          # tier, because a skipped step's outcome is neither value tested here.
          # The fixture is classified as a transaction failure rather than as
          # infrastructure: it exists only to be the candidate the scenarios
          # resolve against, so a row without one has no transaction evidence,
          # which is precisely what failed_transactions says.
          elif [ "${{ steps.deb_fixture.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_fixture.outcome }}" = "failure" ]; then
            set_status failed_transactions \
              "the synthetic mismatched engine candidates could not be built"
          elif [ "${{ steps.deb_txn.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_txn.outcome }}" = "failure" ]; then
            set_status failed_transactions "the upgrade-transaction matrix failed"
          # And the guard against an inert stage: a transactions row that reached its
          # checksums and then did not run its transactions at all has produced
          # no transaction evidence, and must not report `passed` for it. Three
          # of Wave B's ten defects were injections that reached a job nothing
          # read; a tier-gated stage has the same shape available to it.
          elif [ "${{ inputs.tier }}" = "transactions" ] && [ "${{ matrix.family }}" = "deb" ] \
            && [ "${{ steps.deb_txn.outcome }}" != "success" ]; then
            set_status failed_transactions \
              "the transactions-tier Debian row did not reach its transaction matrix"
          elif [ "${{ inputs.tier }}" = "transactions" ] && [ "${{ matrix.family }}" = "rpm" ] \
            && [ "${{ steps.el9_txn.outcome }}" != "success" ]; then
            set_status failed_transactions \
              "the transactions-tier EL9 row did not reach its transaction matrix"
          elif [ "${{ steps.deb_upload.outcome }}" = "failure" ] \
            || [ "${{ steps.el9_upload.outcome }}" = "failure" ]; then
            set_status failed_infrastructure \
              "the package artifact upload failed after a successful build"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/${{ matrix.target }}-${{ matrix.engine }}.json" \
            --kind package-target \
            --vmod "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --status "$status" \
            --stage "${{ matrix.family }}" \
            --detail "$detail" \
            --artifact "${{ matrix.packages_artifact }}" \
            --ref "${{ matrix.ref }}" \
            --commit "${{ matrix.expected_commit }}" \
            --version "${{ matrix.version }}"
        working-directory: vcache-packaging

      # Injection case 8: suppress exactly one expected result artifact and
      # confirm the collector synthesizes missing_result_record for that row.
      # continue-on-error for the same reason as the package uploads: a lost
      # result record must fail this job explicitly rather than leave it red
      # for a reason the log does not name. The collector catches the same
      # thing independently, as missing_result_record.
      - name: upload the target result record
        id: upload_result
        if: always() && matrix.suppress_result != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: results/${{ matrix.target }}-${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 14

      - name: fail when this row failed
        if: steps.record.outputs.status != 'passed' || steps.upload_result.outcome == 'failure'
        run: exit 1

  # ---- The generated-recipe strategy: every VMOD whose upstream ships no
  #      packaging, which is the normal case. ----
  #
  # Same row keys, same artifact names, same classification vocabulary as the
  # upstream pair above: the collector reconciles both strategies against one
  # ledger and cannot tell which produced a row. What differs is only how the
  # source is obtained and how the recipe comes to exist.

  source-generated:
    name: ${{ inputs.vmod_id }} source (${{ matrix.channel }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.source_count != '0' && needs.plan.outputs.recipe == 'generated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # No VMOD checkout at all, and no actions/checkout for a non-GitHub host.
      # Where upstream publishes the release archive, a clone buys nothing: the
      # digest pins the bytes and `git ls-remote` answers the only question a
      # clone would have answered, which is whether the recorded tag still
      # names the recorded commit. That is why Step 5's "non-GitHub upstreams
      # need a new checkout mechanism" turned out to need a shell step instead.
      #
      # --ref comes from the matrix row, exactly as the cachetag path takes its
      # ref from the row, so a ref the expansion rewrote for an injected source
      # failure actually reaches the check that fails on it.
      - name: fetch and verify the pinned source archive
        id: archive
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          set -o pipefail
          sh scripts/ci/vmod/source.sh \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --id "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --ref "${{ matrix.ref }}" \
            --out "$GITHUB_WORKSPACE/vmod-source" 2>&1 |
            tee "$GITHUB_WORKSPACE/source-archive.log"
        working-directory: vcache-packaging

      - name: upload the pinned source archive
        id: upload
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.source_artifact }}
          path: vmod-source/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # The log is read to tell three different failures apart. They are three
      # different findings and send a reader to three different places: a moved
      # tag, bytes that are not the recorded bytes, and an archive that is not
      # the version the manifest says it is.
      - name: classify and record the source result
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          log="$GITHUB_WORKSPACE/source-archive.log"
          if [ "${{ steps.archive.outcome }}" = "failure" ]; then
            if grep -q "does not match the pinned" "$log" 2>/dev/null; then
              set_status failed_source_digest \
                "archive digest does not match ${{ matrix.archive_sha256 }}"
            elif grep -q "not the recorded commit" "$log" 2>/dev/null \
              || grep -q "does not exist at" "$log" 2>/dev/null; then
              set_status failed_source_checkout \
                "${{ matrix.ref }} did not resolve to ${{ matrix.expected_commit }}"
            elif grep -q "but the manifest records" "$log" 2>/dev/null; then
              set_status failed_manifest_validation \
                "the archive's own version disagrees with the manifest"
            else
              set_status failed_source_archive "the source stage failed"
            fi
          elif [ "${{ steps.archive.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the source stage did not run"
          elif [ "${{ steps.upload.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the source artifact upload failed"
          fi
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/source-${{ matrix.channel }}.json" \
            --kind source \
            --vmod "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --status "$status" \
            --stage source \
            --detail "$detail" \
            --artifact "${{ matrix.source_artifact }}" \
            --ref "${{ matrix.ref }}" \
            --commit "${{ matrix.expected_commit }}" \
            --version "${{ matrix.version }}" \
            --digest "${{ matrix.archive_sha256 }}"
        working-directory: vcache-packaging

      - name: upload the source result record and logs
        id: upload_result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: |
            results/source-${{ matrix.channel }}.json
            source-archive.log
          if-no-files-found: warn
          retention-days: 14

      - name: fail when the source stage failed
        if: >-
          steps.archive.outcome != 'success' || steps.upload.outcome != 'success'
          || steps.upload_result.outcome == 'failure'
        run: exit 1

  target-generated:
    name: ${{ inputs.vmod_id }} ${{ matrix.target }} (${{ matrix.engine }})
    needs: [plan, source-generated]
    # Deliberately NOT ordinary `needs` semantics, for the same reason as the
    # upstream target job: this row must start after a failed source job and
    # decide from its own requested artifact whether it can proceed, so a
    # blocked row is reported as blocked rather than silently skipped.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.target_count != '0' && needs.plan.outputs.recipe == 'generated' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      VINYL_TRACK: ${{ matrix.vinyl_track }}
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      - name: download the pinned VMOD source archive
        id: download
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ matrix.source_artifact }}
          path: lane/src

      - name: download the shared engine artifact
        id: engine_download
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ matrix.engine_artifact }}
          path: engine-artifact

      # Identical to the upstream target job's check, and load-bearing for the
      # same reason: this row has no second, independent way to know what it
      # downloaded. The cohort id is read back out of the same identity file
      # rather than pinned here, so the row and the artifact cannot disagree
      # about which cohort they belong to.
      - name: verify the engine artifact against this row
        id: engine_verify
        if: steps.engine_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          scripts/ci/engine-identity.sh "${{ matrix.family }}" \
            > "$GITHUB_WORKSPACE/engine-identity.env"
          cat "$GITHUB_WORKSPACE/engine-identity.env"
          python3 tools/ci_matrix.py verify-engine-metadata \
            --metadata "$GITHUB_WORKSPACE/engine-artifact/engine-metadata.json" \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --identity "$GITHUB_WORKSPACE/engine-identity.env" \
            --packages "$GITHUB_WORKSPACE/engine-artifact/packages"
          # sed, not `.`: engine-identity.sh emits values containing spaces
          # (the maintainer line, for one), so sourcing it would be a shell
          # injection surface and a quoting bug waiting to happen.
          cohort=$(sed -n 's/^cohort_id=//p' "$GITHUB_WORKSPACE/engine-identity.env")
          [ -n "$cohort" ] || { echo "E: no cohort_id in engine-identity.env" >&2; exit 1; }
          echo "cohort=$cohort" >> "$GITHUB_OUTPUT"
        working-directory: vcache-packaging

      - name: place the verified engine packages in the lane
        id: engine_install
        if: steps.engine_verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/lane/engine" "$GITHUB_WORKSPACE/lane/out"
          cp -p "$GITHUB_WORKSPACE"/engine-artifact/packages/* "$GITHUB_WORKSPACE/lane/engine/"
          ls -la "$GITHUB_WORKSPACE/lane/engine"

      # The Debian buildroot. make-chroot.sh is INVOKED, never modified: it is
      # part of the cachetag lane and this wave does not touch a byte of it. It
      # writes into dist/debian-13/work/chroot, so the tarball is copied to
      # where the generated lane's container expects it.
      - name: build the pinned buildroot with mmdebstrap
        id: chroot
        if: matrix.family == 'deb' && steps.engine_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          bash scripts/ci/debian13/make-chroot.sh
          mkdir -p "$GITHUB_WORKSPACE/lane/chroot"
          cp -p dist/debian-13/work/chroot/*.tar "$GITHUB_WORKSPACE/lane/chroot/"
          ls -la "$GITHUB_WORKSPACE/lane/chroot"
        working-directory: vcache-packaging

      # Render the recipe. --inject-token is the plan's verification case 4 and
      # corrupts the recipe AFTER rendering, on purpose: the generator already
      # refuses every token it can refuse, and its own tests cover that. This
      # proves the LANE refuses a recipe that a build would consume literally.
      - name: generate the native recipe
        id: generate
        if: >-
          steps.engine_install.outcome == 'success'
          && (matrix.family != 'deb' || steps.chroot.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          inject=""
          if [ "${{ matrix.inject_recipe }}" = "true" ]; then
            inject="--inject-token"
          fi
          if [ "${{ matrix.inject_patch }}" = "true" ]; then
            inject="$inject --omit-patch"
          fi
          # shellcheck disable=SC2086 # inject is empty or a list of flags
          sh scripts/ci/vmod/generate.sh \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --id "${{ inputs.vmod_id }}" \
            --cohort "${{ steps.engine_verify.outputs.cohort }}" \
            --target "${{ matrix.target }}" \
            --channel "${{ matrix.channel }}" \
            --archive "$(find "$GITHUB_WORKSPACE/lane/src" -name '*.tar.gz' | sort | head -1)" \
            --out "$GITHUB_WORKSPACE/lane" \
            $inject
        working-directory: vcache-packaging

      # The same injection point the upstream-recipe job has had since Phase 2,
      # and for the same reason: one step BEFORE the build, so no build script
      # is modified by any injection. Without it `matrix.inject_build` reached
      # this job and nothing read it, which made `inject=dict_build` produce a
      # GREEN run -- the third instance of an inert injection after D1 and D4,
      # and the reason this one survived is that the generated-recipe jobs were
      # written after the review pass that found those two. Found live by Wave B
      # run 30422290121.
      - name: injected package-build failure
        id: inject_build
        if: matrix.inject_build == 'true' && steps.generate.outcome == 'success'
        continue-on-error: true
        run: exit 1

      - name: build the package in the pinned buildroot
        id: build
        if: steps.generate.outcome == 'success' && steps.inject_build.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          case "${{ matrix.family }}" in
          deb) stage=build-deb ;;
          rpm) stage=build-rpm ;;
          *) echo "E: unknown family" >&2; exit 1 ;;
          esac
          sh scripts/ci/vmod/run.sh "$stage" \
            --lane "$GITHUB_WORKSPACE/lane" \
            --id "${{ inputs.vmod_id }}" \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --cohort "${{ steps.engine_verify.outputs.cohort }}" \
            --target "${{ matrix.target }}" \
            --engine-identity "$GITHUB_WORKSPACE/engine-identity.env"
        working-directory: vcache-packaging

      # Payload, ABI, hardening, lint, installed-package smoke and the ported
      # behaviour suite, all in a container that has never seen the build tree.
      - name: verify the installed package
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          case "${{ matrix.family }}" in
          deb) stage=verify-deb ;;
          rpm) stage=verify-rpm ;;
          *) echo "E: unknown family" >&2; exit 1 ;;
          esac
          sh scripts/ci/vmod/run.sh "$stage" \
            --lane "$GITHUB_WORKSPACE/lane" \
            --id "${{ inputs.vmod_id }}" \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --cohort "${{ steps.engine_verify.outputs.cohort }}" \
            --target "${{ matrix.target }}" \
            --engine-identity "$GITHUB_WORKSPACE/engine-identity.env"
        working-directory: vcache-packaging

      - name: checksums
        id: sums
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/lane/out"
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dsc' \
            -o -name '*.tar.*' -o -name '*.changes' -o -name '*.buildinfo' \) \
            -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      # ---- Upgrade transactions: a tier-gated stage of the row, `transactions`
      #      tier only. Step 8 Wave 1; tier renamed in Wave 3a. ----
      #
      # The same stage the upstream-recipe job gained, reaching the same scenario
      # tables through the same recipe scripts. What differs is only what a
      # generated row cannot default: its package lives in lane/out and the
      # engine's in lane/engine rather than in a dist/ tree, and its package name,
      # version, VCL import token and shared object are this VMOD's rather than
      # cachetag's. scripts/ci/vmod/transactions.sh stages the one and reads the
      # other four out of `vmod_recipe.py lane-env`, which is the same model the
      # recipe was rendered from and the same command run.sh uses for the verify
      # stage -- so nothing about this VMOD is named in a workflow expression.
      #
      # Gated identically to the upstream job's: at tier `ci` both steps are
      # skipped and every arm of the classification chain below reads a skipped
      # step as neither `failure` nor `success`.
      - name: mismatch fixture (transactions tier)
        id: fixture
        if: inputs.tier == 'transactions' && steps.sums.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          case "${{ matrix.family }}" in
          deb) stage=fixture-deb ;;
          rpm) stage=fixture-rpm ;;
          *) echo "E: unknown family" >&2; exit 1 ;;
          esac
          sh scripts/ci/vmod/transactions.sh "$stage" \
            --lane "$GITHUB_WORKSPACE/lane" \
            --id "${{ inputs.vmod_id }}" \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --cohort "${{ steps.engine_verify.outputs.cohort }}" \
            --target "${{ matrix.target }}"
        working-directory: vcache-packaging

      - name: upgrade-transaction matrix (transactions tier)
        id: transactions
        if: inputs.tier == 'transactions' && steps.fixture.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          case "${{ matrix.family }}" in
          deb) stage=matrix-deb ;;
          rpm) stage=matrix-rpm ;;
          *) echo "E: unknown family" >&2; exit 1 ;;
          esac
          sh scripts/ci/vmod/transactions.sh "$stage" \
            --lane "$GITHUB_WORKSPACE/lane" \
            --id "${{ inputs.vmod_id }}" \
            --manifest "${{ inputs.manifest }}" \
            --overlay "recipes/vmods/overlays/${{ inputs.vmod_id }}/overlay.yml" \
            --cohort "${{ steps.engine_verify.outputs.cohort }}" \
            --target "${{ matrix.target }}"
        working-directory: vcache-packaging

      # The generation record is evidence, not a build artefact: it carries the
      # digest of every input including the generator's own source, of every
      # rendered file, and the expected package names. A row that produced a
      # package but no record cannot be traced back to what generated it.
      - name: upload the package artifacts and the generation record
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.packages_artifact }}
          path: |
            lane/out/*
            lane/recipe/**
            lane/names.json
            lane/logs/**
            lane/txn/SHA256SUMS
            lane/txn/packages/SHA256SUMS
            lane/txn/logs/**
            lane/txn/mismatch/PROVENANCE
            lane/txn/mismatch/SHA256SUMS
            lane/txn/mismatch/txn-image.txt
            lane/txn/mismatch/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: classify and record the target result
        id: record
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          if [ "${{ steps.download.outcome }}" != "success" ]; then
            set_status blocked_by_vmod_source \
              "source artifact ${{ matrix.source_artifact }} was not available"
          elif [ "${{ steps.engine_download.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "${{ matrix.engine_row_key }} published no ${{ matrix.engine_artifact }}"
          elif [ "${{ steps.engine_verify.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "${{ matrix.engine_artifact }} does not describe ${{ matrix.engine_row_key }}"
          elif [ "${{ steps.engine_install.outcome }}" != "success" ]; then
            set_status failed_infrastructure \
              "the verified engine packages could not be placed in the lane"
          elif [ "${{ steps.chroot.outcome }}" = "failure" ]; then
            set_status failed_infrastructure "the mmdebstrap buildroot could not be built"
          # Before failed_package_build, and a separate status on purpose:
          # nothing was compiled, the inputs are wrong, and the fix is in the
          # manifest, the overlay, the adapter or the generator rather than in
          # the source. Calling it a build failure would send a reader to the
          # wrong place entirely.
          elif [ "${{ steps.generate.outcome }}" != "success" ]; then
            set_status failed_recipe_generation \
              "the native recipe could not be generated, or an unresolved token survived into it"
          elif [ "${{ steps.inject_build.outcome }}" = "failure" ]; then
            set_status failed_package_build "injected package-build failure"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            set_status failed_package_build "the native package build failed"
          elif [ "${{ steps.verify.outcome }}" = "failure" ]; then
            # One container invocation covers payload, ABI, hardening, lint,
            # smoke and behaviour, so the script leaves a stage marker and this
            # classifies from it. Collapsing all six into one status would have
            # left four statuses in the vocabulary that no producer could ever
            # emit, which is a latent lie about what the collector can report.
            # Matched on the stage's words, not its number: the two verify
            # scripts number their stages differently because the RPM side has
            # one check the Debian side does not.
            stage=$(cat "$GITHUB_WORKSPACE/lane/verify-stage" 2>/dev/null || echo unknown)
            case "$stage" in
            *lintian* | *rpmlint*)
              set_status failed_lint "package lint failed ($stage)" ;;
            *behaviour* | *behavior*)
              set_status failed_behavior "the installed-package VTC suite failed ($stage)" ;;
            *smoke*)
              set_status failed_install_or_smoke "the installed-package smoke failed ($stage)" ;;
            *ABI* | *payload* | *hardening* | *soname*)
              set_status failed_abi_or_hardening "$stage" ;;
            *)
              set_status failed_install_or_smoke \
                "installed-package verification failed at: $stage" ;;
            esac
          elif [ "${{ steps.sums.outcome }}" != "success" ]; then
            set_status failed_infrastructure "the row did not reach its checksums"
          # The transaction stage, classified exactly as the
          # upstream-recipe job classifies its own: inert at every other tier,
          # because a skipped step's outcome is neither value tested here.
          elif [ "${{ steps.fixture.outcome }}" = "failure" ]; then
            set_status failed_transactions \
              "the synthetic mismatched engine candidates could not be built"
          elif [ "${{ steps.transactions.outcome }}" = "failure" ]; then
            set_status failed_transactions "the upgrade-transaction matrix failed"
          # And the same guard against an inert stage: a transactions row that
          # produced no transaction evidence must not report `passed` for it.
          elif [ "${{ inputs.tier }}" = "transactions" ] \
            && [ "${{ steps.transactions.outcome }}" != "success" ]; then
            set_status failed_transactions \
              "the transactions-tier row did not reach its transaction matrix"
          elif [ "${{ steps.upload.outcome }}" = "failure" ]; then
            set_status failed_infrastructure \
              "the package artifact upload failed after a successful build"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/${{ matrix.target }}-${{ matrix.engine }}.json" \
            --kind package-target \
            --vmod "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --engine "${{ matrix.engine }}" \
            --target "${{ matrix.target }}" \
            --status "$status" \
            --stage "${{ matrix.family }}" \
            --detail "$detail" \
            --artifact "${{ matrix.packages_artifact }}" \
            --ref "${{ matrix.ref }}" \
            --commit "${{ matrix.expected_commit }}" \
            --version "${{ matrix.version }}"
        working-directory: vcache-packaging

      - name: upload the target result record
        id: upload_result
        if: always() && matrix.suppress_result != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: results/${{ matrix.target }}-${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 14

      - name: fail when this row failed
        if: steps.record.outputs.status != 'passed' || steps.upload_result.outcome == 'failure'
        run: exit 1

  # ---- The trunk early-warning strategy: no package, no artifact, no
  #      publication. Step 8 Wave 3c. ----
  #
  # Build this VMOD from its own source against unpinned Vinyl trunk HEAD, and
  # run the VTCs it declares against what that build produced. It is the
  # tripwire: the strict VMOD ABI token is the Vinyl commit id itself, so a
  # Vinyl core change breaks VMOD source before any cohort is minted, and this
  # says so within days rather than at the next re-pin.
  #
  # GENERIC, and that is the design rather than a convenience. There is no
  # per-VMOD harness script and no invocation of anything in another
  # repository: the only per-VMOD input is `harness.tests` out of the manifest,
  # and everything else the container does is autotools, discovered. At the
  # roadmap's ~40-VMOD ambition a bespoke harness per VMOD would be forty
  # cross-repository couplings to keep working, and each of them would build
  # Vinyl again for itself -- throwing away the one engine build the caller
  # already did and shares. The precedent is already in the tree: the verify
  # container runs cachetag's own VTCs against the installed package without
  # invoking anything from cachetag's repository.
  #
  # The engine arrives as a prefix tarball the caller built ONCE this run, and
  # its identity is verified before anything is built against it -- the same
  # rule the package rows follow for the engine packages, for the same reason:
  # a consumer that cannot re-derive what it downloaded has to check what it
  # was told.
  harness:
    name: ${{ inputs.vmod_id }} source harness (${{ matrix.channel }} / ${{ matrix.engine }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.harness_count != '0' }}
    runs-on: ubuntu-latest
    # No Vinyl build here since Wave 3c's rework -- the caller does that once
    # and shares it -- so this is a VMOD build plus a VTC suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.harnesses) }}
    env:
      # The prefix the engine was CONFIGURED for. It must match the caller's
      # value: libtool bakes it into the .la files, pkg-config into vinylapi.pc
      # and vmod_abi.h into the ABI string, so the tarball only works when it
      # is unpacked at the path it was built for. Verified against the
      # artifact's own identity file below rather than trusted.
      VINYL_PREFIX: /opt/vinyl-trunk
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # Allowed to fail so the row reaches its result record: a prefix that is
      # not there is a blocked row with a named cause, not an unclassified
      # download error. Same treatment, and same reasoning, as a package row's
      # engine artifact.
      - name: download the shared Vinyl trunk prefix
        id: engine_download
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: engine-vinyl-trunk-head-prefix
          path: engine-prefix

      - name: verify the prefix identity and unpack it
        id: engine_verify
        if: steps.engine_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          identity="$GITHUB_WORKSPACE/engine-prefix/trunk-engine-identity.env"
          [ -f "$identity" ] || { echo "E: the artifact carries no identity file" >&2; exit 1; }
          cat "$identity"
          # sed, not `.`: the identity file is data from another job and
          # sourcing data is how a quoting bug becomes an injection.
          value() { sed -n "s/^$1=//p" "$identity" | head -1; }
          engine=$(value engine)
          commit=$(value vinyl_git_commit)
          prefix=$(value vinyl_prefix)
          [ "$engine" = vinyl-trunk-head ] ||
            { echo "E: the artifact is for engine '$engine', not vinyl-trunk-head" >&2; exit 1; }
          [ "$prefix" = "$VINYL_PREFIX" ] ||
            { echo "E: built for prefix '$prefix'; this row expects $VINYL_PREFIX" >&2; exit 1; }
          [ -n "$commit" ] ||
            { echo "E: the artifact records no Vinyl commit" >&2; exit 1; }
          # The caller's observation, when it passed one. A difference here is
          # a REAL disagreement -- the engine in this artifact is not the
          # engine the gate decided about -- unlike the harmless drift between
          # a gate reading a ref and a job cloning it, because both sides of
          # this comparison describe the same artifact.
          expected='${{ inputs.vinyl_trunk_sha }}'
          if [ -n "$expected" ] && [ "$expected" != "$commit" ]; then
            echo "E: the prefix was built from $commit; the caller expected $expected" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          sudo tar -C / -xzf "$GITHUB_WORKSPACE/engine-prefix/vinyl-trunk-prefix.tar.gz"
          sudo chmod -R a+rX "$VINYL_PREFIX"
          ls -la "$VINYL_PREFIX"

      - name: checkout the VMOD's trunk branch
        id: checkout
        if: steps.engine_verify.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ matrix.ref }}
          path: vmod-source

      # SCOPE.md: "Trunk compatibility jobs may follow an upstream branch
      # because detecting change is their purpose. They must record the commit
      # they actually tested." Both sides reach the result record.
      - name: resolve the VMOD commit under test
        id: vmod_commit
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          commit=$(git -C "$GITHUB_WORKSPACE/vmod-source" rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ inputs.vmod_id }} against Vinyl Cache trunk HEAD"
            echo
            echo "| side | ref | commit |"
            echo "| --- | --- | --- |"
            echo "| ${{ inputs.vmod_id }} | ${{ matrix.ref }} | $commit |"
            echo "| vinyl-cache | HEAD | ${{ steps.engine_verify.outputs.commit }} |"
            echo
            echo "suite: \`${{ matrix.tests }}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The generic harness. The container is the same pinned Debian image the
      # engine was built in, so what compiles the VMOD is what compiled Vinyl.
      - name: build and test against the trunk prefix
        id: run
        if: steps.vmod_commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          . recipes/debian-13/pins.env
          mkdir -p "$GITHUB_WORKSPACE/harness-out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/vcache-packaging:/repo:ro" \
            -v "$GITHUB_WORKSPACE/vmod-source:/src:ro" \
            -v "$GITHUB_WORKSPACE/harness-out:/out" \
            -v "$VINYL_PREFIX:$VINYL_PREFIX:ro" \
            -e "VMOD_ID=${{ inputs.vmod_id }}" \
            -e "VMOD_TESTS=${{ matrix.tests }}" \
            -e "VINYL_PREFIX=$VINYL_PREFIX" \
            "$IMAGE" \
            bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends \
              build-essential automake autoconf autoconf-archive libtool pkg-config \
              git ca-certificates python3 python3-docutils python3-sphinx \
              libedit-dev libjemalloc-dev libncurses-dev libpcre2-dev libunwind-dev \
              >/dev/null && bash /repo/scripts/ci/vmod/container/source-harness.sh'
        working-directory: vcache-packaging

      - name: classify and record the harness result
        id: record
        if: always()
        shell: bash
        run: |
          set -eu
          status=passed
          detail=""
          set_status() { status=$1; detail=$2; }
          if [ "${{ steps.engine_download.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "engine-vinyl-trunk-head-prefix was not published by this run"
          elif [ "${{ steps.engine_verify.outcome }}" != "success" ]; then
            set_status blocked_by_engine_artifact \
              "engine-vinyl-trunk-head-prefix does not describe the trunk engine this row expects"
          elif [ "${{ steps.checkout.outcome }}" != "success" ] \
            || [ "${{ steps.vmod_commit.outcome }}" != "success" ]; then
            set_status failed_source_checkout \
              "checkout of ${{ needs.plan.outputs.repository }}@${{ matrix.ref }} failed"
          elif [ "${{ steps.run.outcome }}" != "success" ]; then
            # NOT failed_behavior, and the container's four distinct exit codes
            # all land here on purpose. Build, no module, empty suite and failing
            # suite are one finding -- this VMOD's source does not work against
            # today's trunk -- and the log says which. The status exists to send
            # a reader to Vinyl rather than to the package.
            set_status failed_source_harness \
              "the source harness failed against Vinyl trunk ${{ steps.engine_verify.outputs.commit }}"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 tools/ci_matrix.py record \
            --out "$GITHUB_WORKSPACE/results/harness-${{ matrix.channel }}.json" \
            --kind source-harness \
            --vmod "${{ inputs.vmod_id }}" \
            --channel "${{ matrix.channel }}" \
            --engine "${{ matrix.engine }}" \
            --status "$status" \
            --stage harness \
            --detail "$detail" \
            --ref "${{ matrix.ref }}" \
            --commit "${{ steps.vmod_commit.outputs.commit }}" \
            --engine-commit "${{ steps.engine_verify.outputs.commit }}"
        working-directory: vcache-packaging

      - name: upload the harness result record and logs
        id: upload_result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.result_artifact }}
          path: |
            results/harness-${{ matrix.channel }}.json
            harness-out/logs/**
            harness-out/harness-summary.env
          if-no-files-found: warn
          retention-days: 30

      - name: fail when this row failed
        if: steps.record.outputs.status != 'passed' || steps.upload_result.outcome == 'failure'
        run: exit 1

  summary:
    name: ${{ inputs.vmod_id }} summary
    needs: [plan, source, target, source-generated, target-generated, harness]
    # Runs after ordinary failures, respects an intentional cancellation, and
    # never fails on a row failure: the row already failed and the caller's
    # collector owns the verdict. This job's job is to make sure every expected
    # row of this VMOD has an outcome recorded somewhere, including when the
    # source job failed and every target row was skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout vcache-packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vcache-packaging

      # This job rebuilds the expected ledger from its own fresh checkout, so
      # the injected corruption has to be reapplied here (see the plan job).
      # Without it an injected run would synthesize blocked lane rows for a
      # manifest that never parsed.
      - name: inject a malformed manifest
        if: inputs.inject == 'manifest'
        shell: bash
        run: |
          set -eu
          # Which VMOD the injection acts on comes from the tool, never from a
          # comparison written here. Four jobs rebuild the expected ledger from
          # their own fresh checkout -- this one, this VMOD's summary, and
          # ci.yml's discover-engines and collect -- and if they disagreed
          # about which file to corrupt they would build different ledgers and
          # the run would report rows nobody asked for.
          victim=$(python3 tools/ci_matrix.py injection-scope --inject manifest)
          [ -n "$victim" ] || { echo "E: the manifest injection names no VMOD" >&2; exit 1; }
          [ "$victim" = "${{ inputs.vmod_id }}" ] || {
            echo "manifest injection targets $victim; leaving ${{ inputs.vmod_id }} intact"
            exit 0
          }
          printf 'schema: vmod-ci/v1\nid: %s\n' "${{ inputs.vmod_id }}" \
            > "${{ inputs.manifest }}"
          cat "${{ inputs.manifest }}"
        working-directory: vcache-packaging

      - name: download this VMOD's result records
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-${{ inputs.vmod_id }}-*
          path: results

      # The shared engine rows too, so a blocked row in this VMOD's summary can
      # name the engine row that blocked it rather than reporting it as missing
      # evidence. summarize-vmod never synthesizes an engine record and never
      # writes one into this VMOD's merged result: the engine rows belong to the
      # whole run and the caller's collector owns their verdict.
      - name: download the shared engine result records
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-engine-*
          path: results

      - name: reconcile this VMOD's expected rows and synthesize the missing ones
        shell: bash
        run: |
          set -eu
          python3 tools/ci_matrix.py summarize-vmod \
            --manifest "${{ inputs.manifest }}" \
            --id "${{ inputs.vmod_id }}" \
            --tier "${{ inputs.tier }}" \
            --results "$GITHUB_WORKSPACE/results" \
            --out "$GITHUB_WORKSPACE/vmod-result/result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
        working-directory: vcache-packaging

      - name: upload this VMOD's merged result record
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: result-${{ inputs.vmod_id }}-summary
          path: vmod-result/result.json
          if-no-files-found: error
          retention-days: 14
