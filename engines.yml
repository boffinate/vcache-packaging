# yaml-language-server: $schema=schemas/engines.schema.json
# Hand-maintained engine catalog (schema engines/1, DESIGN.md).
# Release pins were transcribed once from v1: vinyl-9.0.1 from
# recipes/debian-13/pins.env (release block), varnish-9.0.3 from
# survey/harness/pins.env. Trunk rows carry no pin: the branch HEAD is built
# as it stands and the cell result records the commit.
schema: engines/1
toolchains:
  rust:
    version: "1.90.0"
    bootstrap: rustup
targets:
  # Each target carries the complete execution contract. Adding a target is
  # therefore one catalog edit: engine rows below only select target ids.
  debian-13-amd64:
    image: debian:13
    format: deb
    runner: ubuntu-24.04
    platform: linux/amd64
    package_arch: amd64
  debian-13-arm64:
    image: debian:13
    format: deb
    runner: ubuntu-24.04-arm
    platform: linux/arm64
    package_arch: arm64
  ubuntu-26.04-amd64:
    image: ubuntu:26.04
    format: deb
    runner: ubuntu-24.04
    platform: linux/amd64
    package_arch: amd64
  ubuntu-26.04-arm64:
    image: ubuntu:26.04
    format: deb
    runner: ubuntu-24.04-arm
    platform: linux/arm64
    package_arch: arm64
  el10-x86_64:
    image: almalinux:10
    format: rpm
    runner: ubuntu-24.04
    platform: linux/amd64
    package_arch: x86_64
  el10-aarch64:
    image: almalinux:10
    format: rpm
    runner: ubuntu-24.04-arm
    platform: linux/arm64
    package_arch: aarch64
engines:
  - id: vinyl-9.0.1
    family: vinyl
    series: vinyl-9.0
    kind: release
    source:
      tarball_url: https://vinyl-cache.org/downloads/vinyl-cache-9.0.1.tgz
      sha256: "2e8ec67cd213ea6864c763939d64912025557342fad2a5ffda6c7c5b59bdeb17"
    packages: "true"
    package_revision: "5"
    targets:
      - debian-13-amd64
      - debian-13-arm64
      - ubuntu-26.04-amd64
      - ubuntu-26.04-arm64
      - el10-x86_64
      - el10-aarch64
  - id: varnish-9.0.3
    family: varnish
    series: varnish-9.0
    kind: release
    source:
      tarball_url: https://github.com/varnish/varnish/releases/download/varnish-9.0.3/varnish-9.0.3.tar.gz
      sha256: "2aac11dd95329b0cea148d478168b3ccc6fe45fab38160c440159386403b69fd"
    packages: "true"
    package_revision: "2"
    targets:
      - debian-13-amd64
      - debian-13-arm64
      - ubuntu-26.04-amd64
      - ubuntu-26.04-arm64
      - el10-x86_64
      - el10-aarch64
  # Vinyl upstream's default branch is main (origin/HEAD of the same remote
  # v1's watcher and trunk workflow cloned).
  - id: vinyl-trunk
    family: vinyl
    series: vinyl-trunk
    kind: trunk
    source:
      git_url: https://code.vinyl-cache.org/vinyl-cache/vinyl-cache.git
      branch: main
    packages: "false"
    # Upstream trunk configures as version "trunk"; the prefix .pc files carry
    # this stand-in instead, meaning "later than every 9.x release, below the
    # next major" (decision 29). Bump the major when the series moves on.
    pkgconfig_version: "9.99.0"
    targets:
      - debian-13-amd64
      - debian-13-arm64
      - el10-x86_64
      - el10-aarch64
  # Varnish Cache's current upstream repository is varnish/varnish; its
  # default branch is main.
  - id: varnish-trunk
    family: varnish
    series: varnish-trunk
    kind: trunk
    source:
      git_url: https://github.com/varnish/varnish.git
      branch: main
    packages: "false"
    # Upstream trunk configures as version "trunk"; the prefix .pc files carry
    # this stand-in instead, meaning "later than every 9.x release, below the
    # next major" (decision 29). Bump the major when the series moves on.
    pkgconfig_version: "9.99.0"
    targets:
      - debian-13-amd64
      - debian-13-arm64
      - el10-x86_64
      - el10-aarch64
