# fixture3: reviewed packaging data for a SYNTHETIC ACCEPTANCE FIXTURE entry.
#
# A clone of recipes/vmods/overlays/dict/overlay.yml. Everything below is
# vmod-dict's reviewed data, because this alias builds vmod-dict's real pinned
# source. What differs is exactly the id-bearing values, which have to differ or
# two catalog entries would emit the same package names: `id`, `revision`,
# `upstream.name`, the three `package.*_name` fields, `package.revision`, and the
# lintian override's package prefix -- lintian reports `mismatched-override`
# when the prefix is not the package the tag was emitted for.
#
# What deliberately does NOT differ, and why:
#
#   * `source.archive.stem` stays `vmod-dict`. It names the BYTES: the published
#     tarball really is vmod-dict-1.7.tar.gz unpacking to vmod-dict-1.7/, and the
#     RPM spec's %autosetup -n is rendered from it. The Debian source name is a
#     separate field and generate.sh renames the tree to match it.
#   * `payload.vmod_object` stays libvmod_dict.so and the man page stays
#     vmod_dict.3, because the built payload is vmod-dict's.
#   * `summary` and `description` stay word for word, so the reviewed rpmlint
#     spelling waivers still cover exactly the text they were measured against. A
#     reworded description could fail lint on seven rows and defeat the
#     acceptance run for a reason that has nothing to do with the graph.
#
# This file never reaches main. See registry/vmods/fixture3.yml.
schema: vmod-recipe-overlay/v1
id: fixture3
adapter: autotools

# Bump on any change to this file. Recorded in the generated changelog and in
# the generation record.
#
# 2 (2026-07-29, Step 7 Wave 1): the Summary is capitalised and the reviewed
# rpmlint waivers below arrived. Both move package bytes, which is why they are
# one revision and one change rather than two -- see the package.revision note.
revision: "1"

upstream:
  # AC_INIT([vmod-dict],[1.7],[gray@gnu.org]) in configure.ac.
  name: vmod-fixture3
  contact: "Sergey Poznyakoff <gray@gnu.org>"
  homepage: https://git.gnu.org.ua/vmod-dict.git
  vcs_git: https://git.gnu.org.ua/vmod-dict.git
  vcs_browser: https://git.gnu.org.ua/vmod-dict.git

source:
  clone_url: https://git.gnu.org.ua/vmod-dict.git

  archive:
    # `upstream-release` selects a published release tarball; `derived-git-tag`
    # selects the deterministic archive scripts/ci/vmod-source-archive.sh
    # derives from the tag. The choice is recorded, never discovered: the
    # generator refuses to guess and never prefers a newly found archive over
    # the one named here.
    #
    # WHY upstream-release, when the Step 5 research recorded that no upstream
    # tarball existed: it does exist. src/vmod_dict.vcc's DOWNLOADS section
    # names https://download.gnu.org.ua/release/vmod-dict, which carries
    # vmod-dict-1.7.tar.gz and a detached PGP signature, published 2026-03-25,
    # the same day as the tag. It is a complete `make dist` archive: configure
    # (generated by autoconf 2.71), Makefile.in, aclocal.m4, build-aux/, the
    # acvmod macros, the generated man page, and tests/testsuite are all in it.
    #
    # That is not merely a nicer input, it is the only workable one for the
    # el9-x86_64 target. The tag's tree carries no configure, so it must be
    # bootstrapped, and configure.ac declares AC_PREREQ([2.71]) with
    # AM_INIT_AUTOMAKE([1.16.5 ...]); AlmaLinux 9 ships autoconf 2.69 and
    # automake 1.16.2 (verified in a container, 2026-07-28), so a bootstrap
    # there fails before it starts. The derived archive remains verified and
    # reproducible -- sha256
    # 499f48cbcf5a961633f053778403b95658f22abeb72849d3da13f9ca35c893e4,
    # 50768 bytes, identical from debian:13 and almalinux:9 -- and is recorded
    # in the Wave A1 note as the fallback if this download host is ever ruled
    # unacceptable. It is not the selected input.
    method: upstream-release
    url: https://download.gnu.org.ua/release/vmod-dict/vmod-dict-1.7.tar.gz

    # The archive's digest lives in dict.yml, with the rest of the source
    # identity, so there is exactly one authority for it.
    bytes: "414559"

    # The directory the archive unpacks to, and the stem the Debian source
    # package and the RPM Source0 use.
    stem: vmod-dict

    # SOURCE_DATE_EPOCH and every generated changelog date. This is the
    # committer date of the release commit 784584d2, 2026-03-25T09:04:22Z --
    # a recorded property of the selected source, never wall-clock time.
    source_date_epoch: "1774429462"

  # Recorded for `method: derived-git-tag` and for audit. .gitmodules at v1.7
  # declares acvmod with a git:// clone URL; the derivation script rewrites it
  # to https:// through an explicit, repository-local insteadOf rather than
  # relying on ambient configuration. The published tarball vendors the same
  # macros directly, so the selected input needs none of this.
  submodules:
    - path: acvmod
      commit: 4fba6604d1d1e586274376a20841be0966bf7df3
      url: https://git.gnu.org.ua/acvmod.git

package:
  # Upstream's own name, which is the same rule cachetag follows
  # (libvmod-cachetag is upstream's name too). Varnish Software publishes no
  # package called vmod-dict on either lane, so nothing is duplicated; the
  # naming note in the Wave A1 record explains what happens if that changes.
  debian_source_name: vmod-fixture3
  debian_binary_name: vmod-fixture3
  rpm_name: vmod-fixture3
  debian_section: web

  # Canonical package revision, starting at 1, exactly as
  # registry/README.md defines it for cachetag. It moves when the same
  # vmod-dict source is rebuilt against a different engine input or for a
  # packaging-only fix.
  #
  # 2 (2026-07-29): a packaging-only fix. Wave 0 measured the EL9 lane
  # reporting `0 errors, 6 warnings` and passing, because verify-rpm.sh
  # propagates rpmlint's exit status and that is non-zero only for errors --
  # weaker than the cachetag EL9 gate, which filters through a reviewed waiver
  # file and then asserts "0 errors, 0 warnings". Closing it needed two things,
  # and the audit ruled they are ONE change: the summary-not-capitalized
  # finding is a real defect and gets fixed, the other five are the class a
  # reviewed waiver exists for. Doing them separately would move dict's package
  # bytes twice for two separately-reasoned tidy-ups, and every byte movement
  # is supposed to have one attributable cause.
  revision: "1"

  # Capitalised since revision 2. rpmlint's summary-not-capitalized is a real
  # finding: RPM summaries are sentence-like and start with a capital. Debian's
  # opposite convention (a lower-case synopsis) is not violated -- lintian's
  # description-synopsis-starts-with-article and friends care about articles,
  # not case, and the Debian package carried no finding either way.
  summary: Dictionary look-up VMOD for Vinyl Cache

  # Rendered into Debian's continuation format and into the RPM %description.
  # An empty string becomes a paragraph break.
  description:
    - vmod-dict loads a keyword-to-value dictionary from a disk file at VCL
    - initialisation and looks keys up from VCL. Each non-empty, non-comment
    - line of the dictionary file holds a keyword and a value separated by
    - whitespace.
    - ""
    - 'It exposes dict.load(), dict.lookup(), dict.ci() for case-insensitive'
    - matching, dict.collisions() to bound the hash table collision chains,
    - and dict.clear().
    - ""
    - This package installs only the VMOD shared object and its manual page.
    - It installs no daemon, service unit, system user or VCL, and it does not
    - restart Vinyl Cache.
    - ""
    - The module declares no ABI tag, so Vinyl Cache treats it as strict, and
    - the binary works only with the exact Vinyl Cache build it was compiled
    - against. That coupling is encoded as dependencies on virtual packages
    - which only the matching runtime provides, so an incompatible upgrade is
    - unresolvable rather than silently loadable.

license:
  # COPYING at v1.7 is the GNU GPL version 3, 674 lines, and every source file
  # header says "either version 3, or (at your option) any later version".
  # Verified from the tree, not inferred from a repository host.
  expression: GPL-3.0-or-later
  debian_short_name: GPL-3+

  # Installed by the RPM %license directive. Debian carries the licence in
  # debian/copyright and references /usr/share/common-licenses/GPL-3.
  files:
    - COPYING

copyright:
  # debian/copyright Files: stanzas, in order.
  files:
    - pattern: "*"
      holder: 2017-2026 Sergey Poznyakoff
      license: GPL-3+
    - pattern: "acvmod/*"
      holder: 2016-2020 Sergey Poznyakoff
      license: GPL-3+
  packaging: 2026 Boffinate

abi:
  # src/vmod_dict.vcc declares no $ABI line, and Vinyl Cache defaults an
  # undeclared $ABI to strict. So the package depends on the exact strict-ABI
  # token and the cohort provide, the same expressions cachetag uses; the
  # generator derives them from the engine row rather than from this field.
  # The field records what was verified, so a future $ABI vrt declaration
  # upstream becomes a visible manifest change rather than a silent one.
  mode: strict

build:
  # The published tarball ships configure, so nothing is regenerated. See the
  # adapter's `bootstrap` comment for why this matters on EL9.
  bootstrap: none

  # src/Makefile.am generates vcc_if.h and vmod_dict.man.rst from one rule and
  # builds vmod_dict.3 from the latter, without declaring that dependency. At
  # -j1 the order is Makefile order and correct; above it, it is a race.
  parallel_build: "no"

  # tests/ci.at and tests/cs.at are the whole suite and both drive a real
  # daemon through vtest, so there is no self-contained build-time subset to
  # run. Behaviour is proven against the installed package instead, which is
  # the stronger claim anyway.
  build_time_tests: none

  configure_args: []

build_dependencies:
  # Added to the autotools adapter's shared list. Both are required by
  # acvmod.m4: AM_PATH_PYTHON([3.5]) and AC_PATH_PROGS(RST2MAN, ...). python3
  # also runs the engine's vmodtool.py, which generates vcc_if.c on every
  # build because it is a nodist source.
  debian:
    - python3
    - python3-docutils
  rpm:
    - python3
    - python3-docutils

payload:
  # src/Makefile.am: vmod_LTLIBRARIES = libvmod_dict.la, built with
  # -module -export-dynamic -avoid-version, so the installed name has no
  # version suffix.
  vmod_object: libvmod_dict.so

  # src/Makefile.am: dist_man_MANS = vmod_dict.3, and src/vmod_dict.vcc says
  # "$Module dict 3", so section and installed path agree.
  man_pages:
    - man3/vmod_dict.3

  # Nothing else is installed: the .vcc and the generated .rst files are in
  # EXTRA_DIST only, with no install rule. Documentation below is added by the
  # packaging from the source tree.
  doc_files:
    - README
    - NEWS
    - AUTHORS

behaviour:
  # The installed-package behaviour suite's fixture contract. These two values
  # were hardcoded in a `case` in scripts/ci/vmod/run.sh until Step 7 Wave 1;
  # they are the same values, moved to the file that owns per-VMOD facts.

  # Nothing to install: the ported VTCs drive the packaged daemon and read a
  # dictionary file. The Debian and RPM lists are separate because a fixture
  # package is a distribution package name, not a portable one.
  packages:
    debian: []
    rpm: []

  # tests/*.dict in the release archive: the dictionaries tests/ci.at and
  # tests/cs.at load. They are staged from upstream's archive rather than
  # copied into this repository, so the oracle's input data cannot drift from
  # the expectations the ported VTCs assert.
  fixture_root: tests
  fixture_patterns:
    - "*.dict"

  # The ported VTCs address the staged directory as ${dictdir}.
  macros:
    - "dictdir=@FIXTURES@"

  # vinyltest runs the whole ledger itself; there are no fixture servers to
  # start.
  driver: none

rpmlint_overrides:
  # Reviewed waivers for the EL9 gating pass, added at revision 2. Each carries
  # its reason; a filter without one is a bug. Measured against the run
  # 30437775658 package: with these five filters and the capitalised Summary,
  # rpmlint reports 0 errors and 0 warnings.
  filters:
    - "# rpmlint 1.11 ships a en_US dictionary that predates the vocabulary of"
    - "# this project's own %description. `initialisation` is British spelling in"
    - "# a British-English project; `whitespace`, `ci` and `unresolvable` are"
    - "# ordinary technical words the dictionary does not carry. The description"
    - "# is correct; the dictionary is the thing that is out of date."
    - "addFilter(r' W: spelling-error %description -l en_US (initialisation|whitespace|ci|unresolvable) ')"
    - ""
    - "# rpmlint 1.11 predates SPDX identifiers and wants legacy strings. SPDX is"
    - "# correct for modern packaging and is what upstream's COPYING actually"
    - "# says. The same filter, for the same reason, is in the cachetag lane's"
    - "# recipes/el9/rpmlint-waivers.rpmlintrc."
    - "addFilter(r' W: invalid-license GPL-3.0-or-later')"

lintian_overrides:
  source: []

  # Reviewed, one tag, with the context pinned so it cannot silently start
  # covering something else.
  #
  # Upstream's src/vmod_dict.3 is generated by rst2man, and docutils emits
  # `.ft C` for its literal blocks (line 48 of the installed page). groff's
  # default font family has CR, not C, so it warns. The page is upstream's
  # own generated content, shipped in the release archive; correcting it would
  # mean patching upstream source, and the autotools adapter deliberately has
  # no patch capability in Step 6 -- verification case 10 was relocated to
  # Step 7 for exactly that reason.
  #
  # This is not a relaxation of the gate: `lintian --fail-on error,warning`
  # still runs with the exit status propagated, and the override is the
  # mechanism the recipe-generation plan requires for reviewed, VMOD-scoped
  # exceptions. Verified against the run-30410876882 package in a debian:13
  # container: with this line lintian exits 0, and a form matching only the
  # file path does not match at all (`mismatched-override`), which is why the
  # message text is part of the context here.
  #
  # Remove when upstream's man page stops selecting font C, or when the
  # adapter gains a reviewed patch stack that can fix it at the source.
  binary:
    - "# rst2man emits `.ft C` for literal blocks; groff's default family has CR,"
    - "# not C. Upstream's generated man page, shipped verbatim in the release"
    - "# archive. See recipes/vmods/overlays/dict/overlay.yml for the full note."
    - "vmod-fixture3: groff-message *cannot select font 'C'* [usr/share/man/man3/vmod_dict.3.gz:*]"
